  applyEffects(ch.effects);
  npcSay(sc.npc, ch.reply);
  sc.npc.state = 'leave';
  pathTo(sc.npc, sc.npc.home.tx, sc.npc.home.ty);
  S.approaching = null; S.scene = null; S.mode = 'playing';
  S.scoldReadyAt = S.time + CONFIG.scold.cooldown;
  if (!SIM) { UI.hideDialog(); sfx.choose(); }
  checkDeath();
}
function updateDirector(dt) {
  const C = CONFIG.director;
  S.directorT -= dt;
  if (S.directorT <= 0) { S.directorT = C.checkEvery; if (Math.random() < C.chance) queueScold('director', 'random'); }
  if (S.stats.compliance < C.lowCompliance && S.time - S.lastLowCompAt > C.lowComplianceCooldown) {

/* =====================================================================
   RANDOM EVENTS + MEETINGS
   ===================================================================== */
function updateEvents(dt) {

    S.event.timeLeft -= dt;
    if (!SIM) {
      const sec = Math.ceil(S.event.timeLeft);
      if (sec < V.evSecond && sec <= 3 && sec > 0) sfx.tick();
      V.evSecond = sec;
    }
    if (S.event.def.type === 'meeting' && playerZone() === 'meeting' && !PLAYER.moving) return startMeeting();

  } else if (S.time >= S.nextEventAt) spawnEvent();
}
function spawnEvent(id) {
  const list = CONTENT.events;

  if (!def) def = pick(list.filter((e) => e.id !== S.lastEventId));
  const C = CONFIG.events;
  S.event = { def, timeLeft: def.type === 'meeting' ? C.meetingTravelTime : C.responseTime };
  S.event.total = S.event.timeLeft;

  }

/* =====================================================================
   AUDIO: chiptune beeps generated with Web Audio (no files)
   ===================================================================== */
const NOTE = { G2: 98, Ab2: 103.83, Bb2: 116.54, C3: 130.81, D3: 146.83, Eb3: 155.56, F3: 174.61, G3: 196,
  C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392, A4: 440, B4: 493.88, C5: 523.25, D5: 587.33, E5: 659.25, G5: 783.99, A5: 880, C6: 1046.5 };

const Sound = {
  ctx: null, master: null, musicBus: null, noiseBuf: null,
  muted: !!Store.get(CONFIG.storageKeys.muted, false),
  init() {
    if (!this.ctx) {
      try {

        this.master.connect(this.ctx.destination);
        this.musicBus = this.ctx.createGain();
        this.musicBus.gain.value = CONFIG.audio.musicVolume;
        this.musicBus.connect(this.master);
        const len = Math.floor(this.ctx.sampleRate * 0.5);

  noise(dur, o = {}) {

/* Tiny chiptune loop: bass + hi-hat, speeds up when a stat is in danger */
const Music = {
  playing: false, step: 0, nextT: 0, timer: null,
  prog: ['C3', 'Ab2', 'Bb2', 'G2'],
  start() {
    if (!CONFIG.audio.music || !Sound.ctx || this.playing) return;
    this.playing = true; this.step = 0; this.nextT = Sound.ctx.currentTime + 0.1;
    this.timer = setInterval(() => this.schedule(), 25);
  },
  stop() { this.playing = false; clearInterval(this.timer); this.timer = null; },
  schedule() {
    if (!this.playing || !Sound.ctx) return;
    const ctx = Sound.ctx;
    const tempo = CONFIG.audio.bpm * (S.mode === 'playing' && anyDanger() ? CONFIG.audio.dangerTempo : 1);
    const stepLen = 60 / tempo / 2;
    while (this.nextT < ctx.currentTime + 0.12) {
      const i = this.step % 32, bar = Math.floor(i / 8), beat = i % 8;
      const root = NOTE[this.prog[bar]];
      const f = [root, root * 2, root * 1.5, root * 2, root, root * 2, root * 1.5, root * 2][beat];
      const delay = this.nextT - ctx.currentTime;
      Sound.tone(f, stepLen * 0.9, { type: 'triangle', vol: 0.22, delay, dest: Sound.musicBus });
      if (beat % 2 === 1) Sound.noise(0.03, { vol: 0.05, filter: 7000, high: true, delay, dest: Sound.musicBus });
      if (beat === 0 && this.step % 64 >= 32) Sound.tone(root * 4, stepLen * 1.8, { type: 'square', vol: 0.05, delay, dest: Sound.musicBus });
      this.nextT += stepLen; this.step++;
    }
  },
};

function pxWidth(text, s) { return text.length * 6 * s - s; }
function drawPxRaw(ctx, text, x, y, s, color) {
  ctx.fillStyle = color;
  for (let i = 0; i < text.length; i++) {
    const g = FONT[text[i]] || FONT[' '];
    for (let r = 0; r < 7; r++) {
      const row = g[r];
      if (!row) continue;
      for (let c = 0; c < 5; c++) if (row & (16 >> c)) ctx.fillRect(x + (i * 6 + c) * s, y + r * s, s, s);
    }
  }
}
function drawPx(ctx, text, x, y, s, color, align = 'left', shadow = null) {
  text = String(text).toUpperCase();
  const w = pxWidth(text, s);
  const x0 = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
  if (shadow) drawPxRaw(ctx, text, x0 + s, y + s, s, shadow);
  drawPxRaw(ctx, text, x0, y, s, color);
}
function wrapWords(text, maxChars) {
  const words = String(text).toUpperCase().split(' ');
  const lines = [];
  let cur = '';
  for (const w of words) {
    if (cur && (cur + ' ' + w).length > maxChars) { lines.push(cur); cur = w; } else cur = cur ? cur + ' ' + w : w;
  }
  if (cur) lines.push(cur);
  return lines;
}
/* A crisp <canvas> element containing pixel text (for DOM overlays) */
function pxCanvas(lines, s, color, shadow = '#000', cls = '') {
  if (typeof lines === 'string') lines = [lines.toUpperCase()];
  const maxLen = Math.max(...lines.map((l) => l.length));
  const c = document.createElement('canvas');
  c.width = pxWidth('x'.repeat(maxLen), s) + s;
  c.height = lines.length * 9 * s - 2 * s + s;
  c.className = 'px ' + cls;
  const ctx = c.getContext('2d');
  lines.forEach((l, i) => {
    const x = (c.width - s - pxWidth(l, s)) / 2;
    drawPxRaw(ctx, l, x + s, i * 9 * s + s, s, shadow);
    drawPxRaw(ctx, l, x, i * 9 * s, s, color);
  });
  return c;
}

/* =====================================================================

const INK = '#1d1830';
const cv = $('#world'), ctx = cv.getContext('2d');
const cam = { x: 0, y: 0, zoom: 2, inset: 0, vw: 0, vh: 0, dpr: 1 };

function resizeView() {
  cam.dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(innerWidth * cam.dpr);
  cv.height = Math.round(innerHeight * cam.dpr);
  cam.inset = innerWidth <= 700 ? Math.round($('#hudTop').getBoundingClientRect().bottom) : 0;
  updateCamera(0, true);
}
function updateCamera(dt, snap) {
  const W = innerWidth, H = Math.max(120, innerHeight - cam.inset);
  cam.zoom = Math.min(Math.max(innerWidth, innerHeight) / (CONFIG.view.tilesAcross * T), Math.min(W, H) / (CONFIG.view.minTiles * T));
  cam.vw = W / cam.zoom; cam.vh = H / cam.zoom;
  const mw = MAP_W * T, mh = MAP_H * T;
  let tx = PLAYER.x - cam.vw / 2, ty = PLAYER.y - 24 - cam.vh / 2;
  tx = mw <= cam.vw ? (mw - cam.vw) / 2 : clamp(tx, 0, mw - cam.vw);
  ty = mh <= cam.vh ? (mh - cam.vh) / 2 : clamp(ty, 0, mh - cam.vh);
  const k = snap ? 1 : 1 - Math.exp(-dt * 10);
  cam.x += (tx - cam.x) * k; cam.y += (ty - cam.y) * k;
}
function shakeOffset() {
  if (V.shakeT <= 0) return { x: 0, y: 0 };

}
function toScreen(wx, wy) { return { x: (wx - cam.x) * cam.zoom, y: cam.inset + (wy - cam.y) * cam.zoom }; }
function toWorld(sx, sy) { return { x: sx / cam.zoom + cam.x, y: (sy - cam.inset) / cam.zoom + cam.y }; }

// ---- primitives ----
function rr(c, x, y, w, h, r) {
  c.beginPath();

  c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  c.lineTo(x + r, y + h); c.quadraticCurveTo(x, y + h, x, y + h - r);

/* ---- Quiz engine: Code It! / Abstract Blitz / Serious or Not? / Spot the Error ---- */
class QuizGame {
  constructor(id, def, npc) {
    this.kind = 'quiz'; this.id = id; this.def = def; this.npc = npc;
    const n = Math.min(CONFIG.minigames.quizRounds, def.items.length);
    this.items = shuffle([...def.items]).slice(0, n).map((it) => {
      const opts = it.options.map((text, i) => ({ text, ok: i === it.answer }));
      return { q: it.q, opts: opts.length > 2 ? shuffle(opts) : opts };   // yes/no games keep a fixed order
    });
    this.round = -1; this.correct = 0; this.state = 'intro'; this.t = 0; this.picked = null;
  }
  get item() { return this.items[this.round]; }
  update(dt) {
    this.t += dt;
    if (this.state === 'intro' && this.t > 1.6) this.next();
    else if (this.state === 'question') { this.timeLeft -= dt; if (this.timeLeft <= 0) this.answer(-1); }
    else if (this.state === 'feedback' && this.t > 0.9) this.next();
  }
  next() {
    this.round++; this.t = 0; this.picked = null;
    if (this.round >= this.items.length) return this.finish();
    this.state = 'question'; this.timeLeft = CONFIG.minigames.quizSeconds;
    UI.renderMinigame(this);
  }
  answer(i) {
    if (this.state !== 'question') return;
    this.picked = i; this.state = 'feedback'; this.t = 0;
    const ok = i >= 0 && this.item.opts[i] && this.item.opts[i].ok;
    if (ok) { this.correct++; sfx.stepDone(); } else sfx.denied();
    UI.renderMinigame(this);
  }
  finish() {
    const R = CONFIG.minigames.quizReward, n = this.items.length, frac = this.correct / n;
    this.reward = { sanity: R.sanityBase + R.sanityPerCorrect * this.correct, compliance: R.compliancePerCorrect * this.correct };
    this.resultLine = this.def.results[frac >= 1 ? 0 : frac >= 0.6 ? 1 : 2];
    this.state = 'result'; this.t = 0;
    frac >= 0.6 ? sfx.submit() : sfx.meh();
    UI.renderMinigame(this);
  }
  key(k) {
    if (this.state === 'result') { if (this.t > 0.4 && ['e', ' ', 'enter'].includes(k)) endMinigame(); return; }
    if (this.state === 'intro' && ['e', ' ', 'enter'].includes(k)) return this.next();
    const i = ['1', '2', '3', '4'].indexOf(k);
    if (i >= 0 && this.state === 'question' && i < this.item.opts.length) this.answer(i);
  }
}

/* ---- Table tennis (Pong) ---- */
class PongGame {
  constructor(def, npc) {
    this.kind = 'pong'; this.def = def; this.npc = npc;
    this.W = 480; this.H = 270; this.PH = 54; this.PW = 10;
    this.py = this.H / 2; this.cy = this.H / 2; this.pointerY = null;
    this.score = [0, 0]; this.state = 'intro'; this.t = 0; this.cpuErr = 0; this.ball = null;
  }
  serve(dir) {
    const C = CONFIG.minigames.pong, a = rand(-0.5, 0.5);
    this.ball = { x: this.W / 2, y: this.H / 2, vx: Math.cos(a) * C.ballSpeed * dir, vy: Math.sin(a) * C.ballSpeed, r: 6 };
    this.cpuErr = rand(-18, 18);
  }
  update(dt) {
    const C = CONFIG.minigames.pong;
    this.t += dt;
    if (this.state === 'intro') { if (this.t > 1.6) { this.state = 'play'; this.serve(Math.random() < 0.5 ? 1 : -1); } return; }
    if (this.state === 'point') { if (this.t > 0.9) { if (Math.max(...this.score) >= C.pointsToWin) this.finish(); else { this.state = 'play'; this.serve(this.lastWinner === 0 ? 1 : -1); } } return; }
    if (this.state !== 'play') return;
    // player paddle: keys / joystick / pointer drag
    const d = heldDir(), sp = C.paddleSpeed * dt, half = this.PH / 2 + 4;
    if (d === 'up') this.py -= sp;
    if (d === 'down') this.py += sp;
    if (this.pointerY != null) this.py += clamp(this.pointerY - this.py, -sp * 1.4, sp * 1.4);
    this.py = clamp(this.py, half, this.H - half);
    // CPU paddle: tracks the ball with a little human error
    const b = this.ball;
    const target = b.vx > 0 ? b.y + this.cpuErr : this.H / 2;
    this.cy += clamp(target - this.cy, -C.cpuSpeed * dt, C.cpuSpeed * dt);
    this.cy = clamp(this.cy, half, this.H - half);
    // ball
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.y < b.r) { b.y = b.r; b.vy = Math.abs(b.vy); sfx.tick(); }
    if (b.y > this.H - b.r) { b.y = this.H - b.r; b.vy = -Math.abs(b.vy); sfx.tick(); }
    const hit = (px, py, side) => {
      if (Math.abs(b.x - px) > this.PW / 2 + b.r || Math.abs(b.y - py) > this.PH / 2 + b.r) return false;
      const speed = Math.min(C.maxBallSpeed, Math.hypot(b.vx, b.vy) * C.speedUpPerHit);
      const off = clamp((b.y - py) / (this.PH / 2), -1, 1);
      const ang = off * 0.9;
      b.vx = Math.cos(ang) * speed * side; b.vy = Math.sin(ang) * speed;
      b.x = px + side * (this.PW / 2 + b.r + 1);
      sfx.blip();
      return true;
    };
    if (b.vx < 0) hit(24, this.py, 1);
    else if (hit(this.W - 24, this.cy, -1)) this.cpuErr = rand(-30, 30) * (1 + Math.hypot(b.vx, b.vy) / 400);
    if (b.x < -20 || b.x > this.W + 20) {
      const winner = b.x > this.W ? 0 : 1;
      this.score[winner]++; this.lastWinner = winner;
      this.state = 'point'; this.t = 0;
      winner === 0 ? sfx.stepDone() : sfx.meh();
      UI.renderMinigame(this);
    }
  }
  finish() {
    const C = CONFIG.minigames.pong, won = this.score[0] > this.score[1];
    this.reward = won ? C.win : C.lose;
    this.resultLine = pick(won ? this.def.win : this.def.lose);
    this.won = won; this.state = 'result'; this.t = 0;
    won ? sfx.submit() : sfx.meh();
    UI.renderMinigame(this);
  }
  key(k) { if (this.state === 'result' && this.t > 0.4 && ['e', ' ', 'enter'].includes(k)) endMinigame(); }
  render(c) {
    const W = this.W, H = this.H;
    c.fillStyle = '#1f7a4d'; c.fillRect(0, 0, W, H);
    c.strokeStyle = '#ffffff'; c.lineWidth = 3; c.strokeRect(4, 4, W - 8, H - 8);
    c.setLineDash([8, 8]); c.beginPath(); c.moveTo(W / 2, 6); c.lineTo(W / 2, H - 6); c.stroke(); c.setLineDash([]);
    c.globalAlpha = 0.35; c.beginPath(); c.moveTo(6, H / 2); c.lineTo(W - 6, H / 2); c.lineWidth = 1.5; c.stroke(); c.globalAlpha = 1;
    drawPx(c, String(this.score[0]), W / 2 - 40, 16, 4, '#ffffff', 'center', '#0d3d26');
    drawPx(c, String(this.score[1]), W / 2 + 40, 16, 4, '#ffffff', 'center', '#0d3d26');
    const oppColor = this.npc ? (this.npc.look.jacket || this.npc.look.shirt) : '#ff3fb4';
    for (const [x, y, col] of [[24, this.py, PLAYER.look.jacket], [W - 24, this.cy, oppColor]]) {
      c.fillStyle = col; rr(c, x - this.PW / 2, y - this.PH / 2, this.PW, this.PH, 4); c.fill(); ink(c, 2.5);
    }
    if (this.ball && this.state === 'play') {
      c.fillStyle = 'rgba(0,0,0,.25)'; ellipse(c, this.ball.x + 3, this.ball.y + 4, 6, 4); c.fill();
      c.fillStyle = '#fff6d8'; circle(c, this.ball.x, this.ball.y, this.ball.r); c.fill(); ink(c, 2);
    }
    drawPx(c, 'CASEY', 24, H - 16, 1, '#ffffff', 'left');
    drawPx(c, this.npc ? this.npc.name.split(' ')[0] : 'CPU', W - 24, H - 16, 1, '#ffffff', 'right');
    if (this.state === 'intro') drawPx(c, 'FIRST TO ' + CONFIG.minigames.pong.pointsToWin + '!', W / 2, H / 2 - 10, 3, '#ffd23f', 'center', INK);
    if (this.state === 'point') drawPx(c, this.lastWinner === 0 ? 'POINT CASEY!' : 'POINT ' + (this.npc ? this.npc.name.split(' ')[0] : 'CPU') + '!', W / 2, H / 2 - 10, 3, '#ffd23f', 'center', INK);
  }
}

/* =====================================================================
   PV TRIVIA (arcade cabinet): a no-repeat shuffle bag + an arcade quiz with streaks
   ===================================================================== */
/** Remembers which questions this browser has already seen (across games and sessions).
 *  A question only comes back after the whole bank has been used; then the bag reshuffles. */
const TriviaBag = {
  seen: new Set(), lastCat: null, cycle: 1,
  load() {
    const d = Store.get(CONFIG.storageKeys.trivia, null);
    this.seen = new Set(d && Array.isArray(d.seen) ? d.seen : []);
    this.lastCat = (d && d.lastCat) || null;
    this.cycle = (d && d.cycle) || 1;
  },
  save() { Store.set(CONFIG.storageKeys.trivia, { seen: [...this.seen], lastCat: this.lastCat, cycle: this.cycle }); },
  mixFor(day) {
    let mix = CONFIG.trivia.difficultyByDay[0].mix;
    for (const r of CONFIG.trivia.difficultyByDay) if (day >= r.fromDay) mix = r.mix;
    return mix;
  },
  draw(day) {
    const bank = CONTENT.triviaBank;
    let pool = bank.filter((q) => !this.seen.has(q.id));
    if (!pool.length) { this.seen.clear(); this.cycle++; pool = bank.slice(); }   // whole bank used: reshuffle
    const otherCat = pool.filter((q) => q.cat !== this.lastCat);                   // no same category twice in a row
    if (otherCat.length) pool = otherCat;
    // difficulty ramp: pick a target difficulty for this day, fall back to the nearest one that still has questions
    const mix = this.mixFor(day);
    let r = Math.random() * ((mix[1] || 0) + (mix[2] || 0) + (mix[3] || 0)), target = 1;
    for (const d of [1, 2, 3]) { r -= mix[d] || 0; if (r <= 0) { target = d; break; } }
    const order = [1, 2, 3].sort((a, b) => Math.abs(a - target) - Math.abs(b - target) || a - b);
    let cands = [];
    for (const d of order) { cands = pool.filter((q) => q.diff === d); if (cands.length) break; }
    const q = pick(cands);
    this.seen.add(q.id); this.lastCat = q.cat; this.save();
    return q;
  },
};
TriviaBag.load();

function prepareTrivia(q) {
  const opts = q.type === 'tf'
    ? [{ text: 'TRUE', ok: q.answer === true }, { text: 'FALSE', ok: q.answer === false }]
    : shuffle(q.options.map((text, i) => ({ text, ok: i === q.answer })));
  return { ...q, opts };
}
function triviaMultiplier(streak) {
  let x = 1;
  for (const m of CONFIG.trivia.multipliers) if (streak >= m.streak) x = m.x;
  return x;
}
function startTrivia() {
  if (!minigameReady('trivia')) { say(pick(CONTENT.props.a.lines)); sfx.denied(); return; }
  startMinigame('trivia', null);
}

class TriviaGame {
  constructor(def) {
    this.kind = 'trivia'; this.def = def; this.npc = null;
    this.n = CONFIG.trivia.questionsPerGame;
    this.round = -1; this.correct = 0; this.points = 0; this.gained = 0; this.bonusMsg = '';
    this.bestStreak = S.triviaStreak || 0;
    this.state = 'intro'; this.t = 0; this.q = null; this.picked = null;
  }
  update(dt) {
    this.t += dt;
    if (this.state === 'intro' && this.t > 1.8) this.next();
    else if (this.state === 'question') { this.timeLeft -= dt; if (this.timeLeft <= 0) this.answer(-1); }
    else if (this.state === 'feedback' && this.t > CONFIG.trivia.whySeconds) this.next();
  }
  next() {
    this.round++; this.t = 0; this.picked = null; this.gained = 0; this.bonusMsg = '';
    if (this.round >= this.n) return this.finish();
    this.q = prepareTrivia(TriviaBag.draw(S.day));
    this.timeTotal = CONFIG.trivia.seconds[this.q.type] || 10;
    this.timeLeft = this.timeTotal;
    this.state = 'question';
    UI.renderMinigame(this);
  }
  answer(i) {
    if (this.state !== 'question') return;
    const C = CONFIG.trivia;
    this.picked = i;
    this.ok = i >= 0 && !!(this.q.opts[i] && this.q.opts[i].ok);
    if (this.ok) {
      this.correct++;
      S.triviaStreak = (S.triviaStreak || 0) + 1;
      this.bestStreak = Math.max(this.bestStreak, S.triviaStreak);
      this.mult = triviaMultiplier(S.triviaStreak);
      this.gained = Math.round((C.pointsPerDifficulty[this.q.diff] || 100) * this.mult);
      this.points += this.gained;
      sfxTrivia.correct();
      if (S.triviaStreak % C.streakBonusEvery === 0) {
        applyEffects(C.streakBonus);
        this.bonusMsg = `STREAK ${S.triviaStreak}! ${fxHint(C.streakBonus).replace(/<[^>]+>/g, '')}`;
        sfxTrivia.streak();
      }
    } else {
      S.triviaStreak = 0;
      sfxTrivia.wrong();
    }
    this.state = 'feedback'; this.t = 0;
    UI.renderMinigame(this);
  }
  finish() {
    const R = CONFIG.trivia.reward, frac = this.correct / this.n;
    this.reward = { sanity: R.sanityBase + R.sanityPerCorrect * this.correct, compliance: R.compliancePerCorrect * this.correct };
    this.resultLine = this.def.results[frac >= 1 ? 0 : frac >= 0.6 ? 1 : 2];
    this.state = 'result'; this.t = 0;
    frac >= 0.6 ? sfx.submit() : sfx.meh();
    UI.renderMinigame(this);
  }
  key(k) {
    const go = ['e', ' ', 'enter'].includes(k);
    if (this.state === 'result') { if (this.t > 0.4 && go) endMinigame(); return; }
    if (this.state === 'intro') { if (go) this.next(); return; }
    if (this.state === 'feedback') { if (go && this.t > 0.6) this.next(); return; }
    if (this.state !== 'question') return;
    let i = ['1', '2', '3', '4'].indexOf(k);
    if (this.q.type === 'tf' && (k === 't' || k === 'f')) i = k === 't' ? 0 : 1;
    if (i >= 0 && i < this.q.opts.length) this.answer(i);
  }
}

/* =====================================================================
   LEADERBOARD: office-wide scores (Supabase REST), with an on-device fallback.
   The game never depends on it: offline or blocked, it shows this computer's scores.
   ===================================================================== */
const dedupeBy = (list, key) => { const seen = new Set(); return list.filter((r) => { const k = String(r[key]).toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; }); };
const newId = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
  : 'xxxxxxxx-xxxx-4xxx-8xxx-xxxxxxxxxxxx'.replace(/x/g, () => Math.floor(Math.random() * 16).toString(16));

const Board = {
  status: 'idle',        // idle | loading | online | offline
  remote: [],            // office top list (best score per player)
  lastPost: null,        // { name, score, state: posting | posted | failed | local }
  local: (() => {
    const l = Store.get(CONFIG.storageKeys.board, []);
    return Array.isArray(l) ? l.filter((e) => e && typeof e.score === 'number' && typeof e.name === 'string').slice(0, 50) : [];
  })(),
  name: String(Store.get(CONFIG.storageKeys.player, '') || ''),
  playerId: (() => {
    let id = Store.get(CONFIG.storageKeys.playerId, null);
    if (typeof id !== 'string' || !/^[0-9a-f-]{36}$/i.test(id)) { id = newId(); Store.set(CONFIG.storageKeys.playerId, id); }
    return id;
  })(),

  enabled() { const L = CONFIG.leaderboard; return !!(L.url && L.key && window.fetch); },
  cleanName(s) {
    return String(s || '').replace(/[\u0000-\u001f\u007f<>]/g, '').replace(/\s+/g, ' ').trim().slice(0, CONFIG.leaderboard.nameMax);
  },
  setName(n) { this.name = n; Store.set(CONFIG.storageKeys.player, n); },

  async request(path, opts = {}) {
    const L = CONFIG.leaderboard, ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), L.timeoutMs);
    try {
      const r = await fetch(`${L.url}/rest/v1/${path}`, {
        ...opts, signal: ctl.signal,
        headers: { apikey: L.key, Authorization: `Bearer ${L.key}`, ...(opts.headers || {}) },
      });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return r;
    } finally { clearTimeout(timer); }
  },
  async refresh() {
    if (SIM) return;
    if (!this.enabled()) { this.status = 'offline'; UI.refreshBoards(); return; }
    if (this.status !== 'online') { this.status = 'loading'; UI.refreshBoards(); }
    try {
      const L = CONFIG.leaderboard;
      const r = await this.request(`${L.table}?select=name,score,days,cases,player_id&order=score.desc,created_at.asc&limit=${L.fetchLimit}`);
      const rows = await r.json();
      this.remote = dedupeBy(Array.isArray(rows) ? rows : [], 'player_id').slice(0, L.size);
      this.status = 'online';
    } catch (e) { this.status = 'offline'; }
    UI.refreshBoards();
  },
  /** Record a finished game: always on this device, and on the office board when reachable. */
  async submit(entry) {
    if (SIM) return;
    this.local.push({ ...entry, at: Date.now() });
    this.local.sort((a, b) => b.score - a.score);
    this.local = dedupeBy(this.local, 'name').slice(0, 50);
    Store.set(CONFIG.storageKeys.board, this.local);
    this.lastPost = { ...entry, state: 'posting' };
    UI.refreshBoards();
    if (!this.enabled() || entry.score <= 0) { this.lastPost.state = 'local'; UI.refreshBoards(); return; }
    try {
      await this.request(CONFIG.leaderboard.table, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Prefer: 'return=minimal' },
        body: JSON.stringify({ player_id: this.playerId, name: entry.name, score: Math.round(entry.score),
          days: Math.round(entry.days * 100) / 100, cases: entry.cases }),
      });
      this.lastPost.state = 'posted';
    } catch (e) { this.lastPost.state = 'failed'; }
    await this.refresh();
  },
  /** Rows to show: the office board when online, otherwise this computer's. */
  rows() {
    const size = CONFIG.leaderboard.size;
    if (this.status === 'online') return this.remote.slice(0, size).map((r) => ({ ...r, me: r.player_id === this.playerId }));
    return this.local.slice(0, size).map((r) => ({ ...r, me: r.name.toLowerCase() === this.name.toLowerCase() }));
  },
};

/* =====================================================================
   UI: HUD, case queue, dialogue box, alerts, overlays
   ===================================================================== */
function fxHint(fx) {
  const out = [];
  for (const [k, v] of Object.entries(fx || {})) {
    if (!v) continue;
    if (k in CONFIG.stats) {
      const n = Math.abs(v) >= 12 ? 2 : 1;
      out.push(`<span class="${v > 0 ? 'up' : 'down'}">${(v > 0 ? '▲' : '▼').repeat(n)}${CONFIG.stats[k].short}</span>`);
    } else if (k === 'cases' || k === 'favor') out.push(`<span class="down">+${v} CASE</span>`);
    else if (k === 'serious') out.push(`<span class="down">+SERIOUS</span>`);
    else if (k === 'removeCase') out.push(`<span class="up">-${v} CASE</span>`);
    else if (k === 'dbDown') out.push(`<span class="down">DB ${v}s</span>`);
  }
  return out.join(' ');
}

/* =====================================================================
   INPUT: keyboard, mouse/touch tap-to-move, on-screen joystick
   ===================================================================== */
const KEY_DIR = { arrowup: 'up', w: 'up', arrowdown: 'down', s: 'down', arrowleft: 'left', a: 'left', arrowright: 'right', d: 'right' };
document.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (e.target && e.target.tagName === 'INPUT') {          // typing a name: let every key through
    if (k === 'enter') { e.preventDefault(); UI.submitName(); }
    else if (k === 'escape') { e.preventDefault(); S.mode === 'gameover' ? UI.showGameOver() : UI.showTitle(); }
    return;
  }
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k)) e.preventDefault();
  if (S.mode === 'title' || S.mode === 'gameover') {
    if ((k === ' ' || k === 'enter') && !e.repeat) {
      if (UI.nameEntryOpen) UI.submitName();
      else if (S.mode === 'title' || canRestart()) UI.showNameEntry();
    }
    if (k === 'm') toggleMute();
    return;
  }
  if (S.mode === 'paused' && $('#overlay').dataset.kind === 'clockout') {
    if (k === 'enter' && !e.repeat) clockOut();
    else if ([' ', 'escape', 'p'].includes(k) && !e.repeat) resumeGame();
    return;
  }
  if (S.mode === 'paused') { if ([' ', 'enter', 'p', 'escape'].includes(k) && !e.repeat) resumeGame(); else if (k === 'm') toggleMute(); return; }
  if (S.mode === 'mail') {
    if (k === '2') closeMail(true);
    else if (['1', 'e', ' ', 'enter', 'escape'].includes(k) && !e.repeat) closeMail(false);
    return;
  }
  if (k === 'o' && S.mode === 'playing') return UI.showClockOut();
  if (S.mode === 'minigame') {
    if (k === 'escape') return endMinigame(true);
    if (k === 'p') return pauseGame();
    if (k === 'm') return toggleMute();
    const dm = KEY_DIR[k]; if (dm && !input.keys.includes(dm)) input.keys.push(dm);
    if (MG.active && !e.repeat) MG.active.key(k);
    return;
  }
  if (k === 'p' || k === 'escape') return pauseGame();
  if (k === 'm') return toggleMute();
  if (['1', '2', '3', '4', '5'].includes(k)) return chooseAny(Number(k) - 1);
  if (k === 'e' || k === ' ' || k === 'enter') {
    if (UI.tw && UI.tw.n < UI.tw.full.length) { UI.tw.n = UI.tw.full.length; return; }
    if (!e.repeat && S.mode === 'playing') input.actionPressed = true;
    input.actionHeld = true;
    return;
  }
  const d = KEY_DIR[k];
  if (d && !input.keys.includes(d)) { input.keys.push(d); input.tap = d; }
});
document.addEventListener('keyup', (e) => {
  const k = e.key.toLowerCase();
  if (k === 'e' || k === ' ' || k === 'enter') input.actionHeld = false;
  const d = KEY_DIR[k];
  if (d) input.keys = input.keys.filter((x) => x !== d);
});
window.addEventListener('blur', () => { input.keys = []; input.actionHeld = false; input.touchHeld = false; input.mouseWork = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
document.addEventListener('contextmenu', (e) => e.preventDefault());

// click / tap to move (and to use things)
cv.addEventListener('pointerdown', (e) => {
  Sound.init();
  if (e.pointerType === 'touch') { UI.enableTouch(); return; }   // phones: joystick + action button only, no tap-to-move
  if (S.mode !== 'playing') return;
  const w = toWorld(e.clientX, e.clientY);
  const tx = Math.floor(w.x / T), ty = Math.floor(w.y / T);
  V.clickMark = { x: (tx + 0.5) * T, y: (ty + 0.5) * T, until: V.t + 0.5 };
  const P = PLAYER;
  // a person? (their body covers the tile they stand on and the one above)
  const n = NPCS.find((q) => q.tx === tx && (q.ty === ty || q.ty === ty + 1));
  if (n) {
    if (adjacentTo(P, n.tx, n.ty)) { P.dir = dirTo(P, n.tx, n.ty); interact({ kind: 'npc', npc: n }); return; }
    pathNextTo(P, n.tx, n.ty); P.onArrive = () => { if (adjacentTo(P, n.tx, n.ty)) { P.dir = dirTo(P, n.tx, n.ty); interact({ kind: 'npc', npc: n }); } };
    return;
  }
  const o = objAt(tx, ty);
  if (o && INTERACT_TYPES.has(o.type)) {
    if (o.type === 'M') input.mouseWork = true;         // keep holding to work
    if (adjacentTo(P, o.x, o.y, o.w, o.h)) { faceRect(P, o.x, o.y, o.w, o.h); if (o.type !== 'M') interact({ kind: 'obj', obj: o }); return; }
    if (o.type === 'M' && !occupied(22, 9, P)) pathTo(P, 22, 9); else pathNextTo(P, o.x, o.y, o.w, o.h);
    P.onArrive = () => { faceRect(P, o.x, o.y, o.w, o.h); if (o.type !== 'M' && adjacentTo(P, o.x, o.y, o.w, o.h)) interact({ kind: 'obj', obj: o }); };
    return;
  }
  if (walkable(tx, ty)) { pathTo(P, tx, ty); P.onArrive = null; }
});
window.addEventListener('pointerup', () => { input.mouseWork = false; });

// on-screen joystick + action button (phones)
(() => {
  const joy = $('#joy'), knob = $('#knob'), btn = $('#actBtn');
  let id = null;
  const move = (e) => {
    const r = joy.getBoundingClientRect();
    const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const len = Math.hypot(dx, dy), max = r.width / 2 - 20, k = len > max ? max / len : 1;
    knob.style.transform = `translate(${dx * k}px,${dy * k}px)`;
    input.joy = len < 14 ? null : Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
  };
  const end = () => { id = null; input.joy = null; knob.style.transform = ''; };
  joy.addEventListener('pointerdown', (e) => { e.preventDefault(); Sound.init(); id = e.pointerId; try { joy.setPointerCapture(id); } catch (err) { /* capture is optional */ } move(e); });
  joy.addEventListener('pointermove', (e) => { if (e.pointerId === id) move(e); });
  joy.addEventListener('pointerup', end); joy.addEventListener('pointercancel', end);
  btn.addEventListener('pointerdown', (e) => {
    e.preventDefault(); Sound.init(); btn.classList.add('held');
    if (S.mode === 'title' || S.mode === 'gameover') {
      if (UI.nameEntryOpen) return UI.submitName();
      if (S.mode === 'title' || canRestart()) UI.showNameEntry();
      return;
    }
    if (S.mode === 'paused') return resumeGame();
    if (S.mode === 'minigame') { if (MG.active) MG.active.key('e'); return; }
    if (S.mode === 'mail') return closeMail(false);
    if (UI.tw && UI.tw.n < UI.tw.full.length) { UI.tw.n = UI.tw.full.length; return; }
    if (S.mode === 'playing') { input.actionPressed = true; input.touchHeld = true; }
  });
  const up = () => { btn.classList.remove('held'); input.touchHeld = false; };
  btn.addEventListener('pointerup', up); btn.addEventListener('pointercancel', up); btn.addEventListener('pointerleave', up);
})();
window.addEventListener('resize', resizeView);

/* =====================================================================
   MAIN LOOP
   ===================================================================== */
let lastFrame = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - lastFrame) / 1000);
  lastFrame = now;
  if (S.mode === 'playing') update(dt);
  else if (S.mode === 'title') for (const n of NPCS) updateNPC(n, dt);   // office stays alive behind the title
  else if (S.mode === 'minigame' && MG.active) {
    MG.active.update(dt);
    const mc = $('#mgCanvas');
    if (MG.active && MG.active.kind === 'pong' && mc) { const x = mc.getContext('2d'); x.setTransform(2, 0, 0, 2, 0, 0); x.lineJoin = 'round'; x.lineCap = 'round'; MG.active.render(x); }
  }
  updateVisuals(dt);
  updateCamera(dt, false);
  render();
  if (!$('#overlay').hidden) renderPortrait();
  UI.sync(dt);
  requestAnimationFrame(frame);
}

/* Test/balance hooks (harmless in normal play) */
window.DSS = {
  CONFIG, CONTENT, S, V, P: PLAYER, NPCS, OBJECTS, GRID, MY_DESK, walkable, bfs,
  start: startGame, gameOver, Board, clockOut, openMail, closeMail, TriviaBag, prepareTrivia, startTrivia, spawnEvent, spawnCase, queueScold, chooseAny, MG, startMinigame, endMinigame,
  api: {
    goToTile(tx, ty) { const P = PLAYER; if (P.tx === tx && P.ty === ty && !P.moving) return true; if (!P.path.length && !P.moving) pathTo(P, tx, ty); return false; },
    goToObj(type) {
      const P = PLAYER;
      const o = OBJECTS.filter((x) => x.type === type).sort((a, b) => (Math.abs(a.x - P.tx) + Math.abs(a.y - P.ty)) - (Math.abs(b.x - P.tx) + Math.abs(b.y - P.ty)))[0];
      if (adjacentTo(P, o.x, o.y, o.w, o.h) && !P.moving) { faceRect(P, o.x, o.y, o.w, o.h); return true; }
      if (!P.path.length && !P.moving) pathNextTo(P, o.x, o.y, o.w, o.h);
      return false;
    },
    goToNpc(n) {
      const P = PLAYER;
      if (adjacentTo(P, n.tx, n.ty) && !P.moving) { P.dir = dirTo(P, n.tx, n.ty); return true; }
      if (!P.moving) pathNextTo(P, n.tx, n.ty);
      return false;
    },
    press() { input.actionPressed = true; },
    hold(b) { input.simHold = b; },
    target: () => currentTarget(),
    vendReady: () => S.time >= S.vendReadyAt,
    toiletReady: () => S.time >= S.toiletReadyAt,
    coffeeReady() { const P = PLAYER; const o = OBJECTS.filter((x) => x.type === 'C').sort((a, b) => (Math.abs(a.x - P.tx) + Math.abs(a.y - P.ty)) - (Math.abs(b.x - P.tx) + Math.abs(b.y - P.ty)))[0]; return S.time >= (S.coffeeReady[o.id] || 0); },
    zone: () => playerZone(),
    activeCase: () => activeCase(),
  },
  /* Run a whole game headlessly: policy(api, S) is called every tick */
  simulate(policy, maxSeconds = 1800, dt = 1 / 30) {
    SIM = true;
    resetGame(); S.mode = 'playing';
    let stuck = 0;
    while (S.mode !== 'gameover' && S.time < maxSeconds) {
      policy(DSS.api, S);
      if (S.mode === 'playing') { update(dt); stuck = 0; }
      else if (++stuck > 300) chooseAny(0);
    }
    const res = { seconds: +S.time.toFixed(1), days: +(S.time / CONFIG.secondsPerDay).toFixed(2), cause: S.mode === 'gameover' ? S.deathCause : 'timeout', onTime: S.onTime, late: S.lateCount, score: computeScore() };
    SIM = false; input.simHold = false;
    resetGame(); S.mode = 'title'; UI.showTitle();
    return res;
  },
};

resetGame();
UI.init();
UI.showTitle();
Board.refresh();
resizeView();
requestAnimationFrame(frame);
</script>
