  { id: 'cq-med-009', diff: 2, type: 'mc', q: '"Fell asleep in the middle of a meeting."', options: ["Somnolence", "Insomnia", "Syncope"], answer: 0,
    why: "Falling asleep is somnolence, not fainting (syncope)." },
  { id: 'cq-med-010', diff: 1, type: 'mc', q: '"Ringing in my ears since Tuesday."', options: ["Tinnitus", "Deafness", "Ear pain"], answer: 0,
    why: "Ringing in the ears = tinnitus." },
  { id: 'cq-med-011', diff: 2, type: 'mc', q: '"The whole room was spinning."', options: ["Vertigo", "Headache", "Tinnitus"], answer: 0,
    why: "A spinning sensation is described as vertigo." },
  { id: 'cq-med-012', diff: 1, type: 'mc', q: '"I fainted and woke up on the kitchen floor."', options: ["Syncope", "Seizure", "Vertigo"], answer: 0,
    why: "Fainting = syncope. (Code the fall too, if an injury is reported.)" },
  { id: 'cq-med-013', diff: 1, type: 'mc', q: '"Loose, watery stools five times a day."', options: ["Diarrhoea", "Constipation", "Abdominal pain"], answer: 0,
    why: "Frequent watery stools = diarrhoea." },
  { id: 'cq-med-014', diff: 1, type: 'mc', q: '"Couldn\'t go to the toilet for four days."', options: ["Constipation", "Diarrhoea", "Flatulence"], answer: 0,
    why: "Four days without a bowel movement: constipation." },
  { id: 'cq-med-015', diff: 2, type: 'mc', q: '"Raised itchy welts all over my arms."', options: ["Urticaria", "Pruritus", "Dry skin"], answer: 0,
    why: "Welts or hives = urticaria. Itching alone would be pruritus." },
  { id: 'cq-med-016', diff: 2, type: 'mc', q: '"My hair is falling out in clumps."', options: ["Alopecia", "Dry skin", "Pruritus"], answer: 0,
    why: "Hair loss = alopecia." },
  { id: 'cq-med-017', diff: 1, type: 'mc', q: '"My hands keep shaking."', options: ["Tremor", "Seizure", "Muscle spasms"], answer: 0,
    why: "Involuntary shaking = tremor." },
  { id: 'cq-med-018', diff: 2, type: 'mc', q: '"I feel down and cry all the time." (no diagnosis given)', options: ["Depressed mood", "Anxiety", "Insomnia"], answer: 0,
    why: "Code the symptom reported. Don't upgrade it to a diagnosis like depression." },
  { id: 'cq-med-019', diff: 2, type: 'mc', q: '"Constantly worried and restless."', options: ["Anxiety", "Depressed mood", "Somnolence"], answer: 0,
    why: "Worry plus restlessness points to anxiety." },
  { id: 'cq-med-020', diff: 3, type: 'mc', review: true, q: '"My blood pressure was 190/110." (no diagnosis given)', options: ["Blood pressure increased", "Hypotension", "Headache"], answer: 0,
    why: "A reported measurement without a diagnosis usually goes to an 'increased' investigation term." },
  { id: 'cq-med-021', diff: 2, type: 'mc', q: '"A nosebleed that wouldn\'t stop."', options: ["Epistaxis", "Haemoptysis", "Haematemesis"], answer: 0,
    why: "Nosebleed = epistaxis." },
  { id: 'cq-med-022', diff: 3, type: 'mc', q: '"Coughing up blood."', options: ["Haemoptysis", "Epistaxis", "Haematemesis"], answer: 0,
    why: "Blood from the airways = haemoptysis. Vomited blood = haematemesis." },
  { id: 'cq-med-023', diff: 3, type: 'mc', q: '"Vomiting blood."', options: ["Haematemesis", "Haemoptysis", "Melaena"], answer: 0,
    why: "Haematemesis = vomiting blood." },
  { id: 'cq-med-024', diff: 3, type: 'mc', q: '"Black, tarry stools."', options: ["Melaena", "Haematochezia", "Constipation"], answer: 0,
    why: "Black, tarry stools = melaena. Fresh red blood = haematochezia." },
  { id: 'cq-med-025', diff: 2, type: 'mc', q: '"My skin and eyes turned yellow."', options: ["Jaundice", "Pruritus", "Rash"], answer: 0,
    why: "Yellowing of skin and eyes = jaundice." },
  { id: 'cq-med-026', diff: 3, type: 'mc', review: true, q: '"Out of breath climbing just one flight of stairs."', options: ["Dyspnoea exertional", "Asthma", "Cough"], answer: 0,
    why: "Breathlessness on effort has its own term: dyspnoea exertional." },
  { id: 'cq-med-027', diff: 1, type: 'mc', q: '"Been coughing for three weeks."', options: ["Cough", "Dyspnoea", "Wheezing"], answer: 0,
    why: "Simple and accurate: cough." },
  { id: 'cq-med-028', diff: 3, type: 'mc', review: true, q: '"Took two tablets instead of one by mistake."', options: ["Extra dose administered", "Drug ineffective", "Drug abuse"], answer: 0,
    why: "An accidental extra dose is a medication error, not abuse." },
  { id: 'cq-med-029', diff: 2, type: 'mc', q: '"Used it for a condition that isn\'t on the label."', options: ["Off label use", "Drug ineffective", "Drug abuse"], answer: 0,
    why: "Use outside the authorised indication = off label use." },
  { id: 'cq-med-030', diff: 2, type: 'mc', q: '"Found out I was pregnant while taking it. No problems so far."', options: ["Exposure during pregnancy", "Drug ineffective", "Abortion spontaneous"], answer: 0,
    why: "Pregnancy exposure is captured even without an adverse event." },
  { id: 'cq-med-031', diff: 1, type: 'mc', q: '"My muscles ache all over."', options: ["Myalgia", "Arthralgia", "Back pain"], answer: 0,
    why: "Muscle pain = myalgia. Joint pain = arthralgia." },
  { id: 'cq-med-032', diff: 1, type: 'mc', q: '"Both my knees hurt."', options: ["Arthralgia", "Myalgia", "Joint swelling"], answer: 0,
    why: "Joint pain = arthralgia." },
  { id: 'cq-med-033', diff: 1, type: 'mc', q: '"Tired all the time, zero energy."', options: ["Fatigue", "Somnolence", "Insomnia"], answer: 0,
    why: "Tiredness and lack of energy = fatigue." },
  { id: 'cq-med-034', diff: 1, type: 'mc', q: '"Everything looks blurry."', options: ["Vision blurred", "Blindness", "Eye pain"], answer: 0,
    why: "Don't overstate it: blurry is not blind." },
  { id: 'cq-med-035', diff: 2, type: 'mc', q: '"Pins and needles in my fingers."', options: ["Paraesthesia", "Hypoaesthesia", "Tremor"], answer: 0,
    why: "Tingling = paraesthesia. Reduced feeling = hypoaesthesia." },
  { id: 'cq-med-036', diff: 3, type: 'mc', review: true, q: '"My lips went numb."', options: ["Hypoaesthesia oral", "Paraesthesia", "Dry mouth"], answer: 0,
    why: "Numbness in the mouth area has a specific oral hypoaesthesia term." },
  { id: 'cq-med-037', diff: 1, type: 'mc', q: '"My mouth is so dry."', options: ["Dry mouth", "Dysgeusia", "Thirst"], answer: 0,
    why: "Keep it literal: dry mouth." },
  { id: 'cq-med-038', diff: 2, type: 'mc', q: '"Lost my appetite completely."', options: ["Decreased appetite", "Weight decreased", "Nausea"], answer: 0,
    why: "No weight loss was reported, just appetite: decreased appetite." },
  { id: 'cq-med-039', diff: 1, type: 'mc', q: '"Put on 5 kg in a month."', options: ["Weight increased", "Increased appetite", "Oedema"], answer: 0,
    why: "A reported weight gain = weight increased." },
  { id: 'cq-med-040', diff: 3, type: 'mc', review: true, q: '"Heartburn after every dose."', options: ["Dyspepsia", "Nausea", "Abdominal pain"], answer: 0,
    why: "'Heartburn' is a lower-level term that sits under the PT dyspepsia." },
];

CONTENT.minigames.lit.bank = [   // Abstract Blitz with Lin Literature: is this a reportable individual human case?
  { id: 'cq-lit-001', diff: 1, type: 'bin', q: 'Mice given Compound Z showed reduced fur density.', options: ["Relevant case", "Not relevant"], answer: 1,
    why: "Animal data: no human patient, so no ICSR." },
  { id: 'cq-lit-002', diff: 1, type: 'bin', q: 'A 58-year-old man developed jaundice two weeks after starting Product A.', options: ["Relevant case", "Not relevant"], answer: 0,
    why: "Identifiable patient, suspect product, adverse event: a valid literature case." },
  { id: 'cq-lit-003', diff: 1, type: 'bin', q: 'In vitro: Compound Z inhibits an enzyme in cell cultures.', options: ["Relevant case", "Not relevant"], answer: 1,
    why: "Lab data with no patient. Interesting, but not an ICSR." },
  { id: 'cq-lit-004', diff: 2, type: 'bin', q: 'A pregnant woman exposed to Product A delivered a healthy baby.', options: ["Relevant case", "Not relevant"], answer: 0,
    why: "Pregnancy exposure is a special situation to capture, even with a good outcome." },
  { id: 'cq-lit-005', diff: 1, type: 'bin', q: 'Rats fed Product A for 90 days gained weight.', options: ["Relevant case", "Not relevant"], answer: 1,
    why: "Animal study: not an individual human case." },
  { id: 'cq-lit-006', diff: 1, type: 'bin', q: 'Two patients on Product A developed a severe rash; one was hospitalised.', options: ["Relevant case", "Not relevant"], answer: 0,
    why: "Two identifiable patients with adverse events: two cases to process." },
  { id: 'cq-lit-007', diff: 1, type: 'bin', q: 'A review of Product A manufacturing costs in 2024.', options: ["Relevant case", "Not relevant"], answer: 1,
    why: "Economics, not safety." },
  { id: 'cq-lit-008', diff: 2, type: 'bin', q: 'A child accidentally swallowed Product A tablets. No symptoms.', options: ["Relevant case", "Not relevant"], answer: 0,
    why: "Accidental exposure in a child is a special situation, even without symptoms." },
  { id: 'cq-lit-009', diff: 1, type: 'bin', q: 'Zebrafish embryos exposed to Compound Z swam in circles.', options: ["Relevant case", "Not relevant"], answer: 1,
    why: "Fish are not patients. Yet." },
  { id: 'cq-lit-010', diff: 1, type: 'bin', q: 'An elderly patient fell and broke a hip after the dose was doubled.', options: ["Relevant case", "Not relevant"], answer: 0,
    why: "Identifiable patient, suspect product, serious adverse event." },
  { id: 'cq-lit-011', diff: 1, type: 'bin', q: 'A 34-year-old woman developed hives minutes after the first dose of Product B.', options: ["Relevant case", "Not relevant"], answer: 0,
    why: "Classic case report: process it." },
  { id: 'cq-lit-012', diff: 2, type: 'bin', q: 'A patient had seizures after an overdose of Product B.', options: ["Relevant case", "Not relevant"], answer: 0,
    why: "Overdose with an adverse event: reportable." },
  { id: 'cq-lit-013', diff: 1, type: 'bin', q: 'A 70-year-old man had acute kidney injury on Product A; it improved after stopping.', options: ["Relevant case", "Not relevant"], answer: 0,
    why: "A positive dechallenge makes this case even more interesting." },
  { id: 'cq-lit-014', diff: 2, type: 'bin', q: 'A teenager used Product C recreationally and was admitted with an arrhythmia.', options: ["Relevant case", "Not relevant"], answer: 0,
    why: "Abuse or misuse with an adverse event is reportable." },
  { id: 'cq-lit-015', diff: 1, type: 'bin', q: 'Case series: three identifiable patients developed hearing loss on Product D.', options: ["Relevant case", "Not relevant"], answer: 0,
    why: "Each identifiable patient is an individual case." },
  { id: 'cq-lit-016', diff: 2, type: 'bin', q: 'A breastfed infant was unusually drowsy while the mother took Product A.', options: ["Relevant case", "Not relevant"], answer: 0,
    why: "Exposure via breast milk with an adverse event: reportable." },
  { id: 'cq-lit-017', diff: 1, type: 'bin', q: 'A 45-year-old woman noticed hair loss three months after starting Product B.', options: ["Relevant case", "Not relevant"], answer: 0,
    why: "Late onset still counts. Process it." },
  { id: 'cq-lit-018', diff: 2, type: 'bin', q: 'A patient developed a rash after the pharmacy dispensed the wrong strength of Product A.', options: ["Relevant case", "Not relevant"], answer: 0,
    why: "Medication error with an adverse event: reportable." },
  { id: 'cq-lit-019', diff: 2, type: 'bin', q: 'The author, a 40-year-old physician, describes her own palpitations on Product A.', options: ["Relevant case", "Not relevant"], answer: 0,
    why: "The author can be both reporter and patient." },
  { id: 'cq-lit-020', diff: 1, type: 'bin', q: 'A man with a known allergy was given Product F and developed anaphylaxis.', options: ["Relevant case", "Not relevant"], answer: 0,
    why: "Serious adverse event with an identifiable patient." },
  { id: 'cq-lit-021', diff: 2, type: 'bin', q: 'A 6-year-old given Product A off-label developed vomiting.', options: ["Relevant case", "Not relevant"], answer: 0,
    why: "Off-label use with an adverse event: reportable." },
  { id: 'cq-lit-022', diff: 2, type: 'bin', q: 'A woman became pregnant while taking Product G, an oral contraceptive.', options: ["Relevant case", "Not relevant"], answer: 0,
    why: "Unintended pregnancy on a contraceptive suggests lack of efficacy: capture it." },
  { id: 'cq-lit-023', diff: 1, type: 'bin', q: 'Tendon pain after two weeks on Product H; resolved on stopping.', options: ["Relevant case", "Not relevant"], answer: 0,
    why: "Identifiable patient plus a plausible ADR." },
  { id: 'cq-lit-024', diff: 1, type: 'bin', q: 'A 50-year-old woman had liver enzymes ten times normal on Product A.', options: ["Relevant case", "Not relevant"], answer: 0,
    why: "Significant lab abnormality in an identifiable patient." },
  { id: 'cq-lit-025', diff: 1, type: 'bin', q: 'A budget impact model for Product A in three countries.', options: ["Relevant case", "Not relevant"], answer: 1,
    why: "Pharmacoeconomics: no patients, no adverse events." },
  { id: 'cq-lit-026', diff: 1, type: 'bin', q: "A survey of pharmacists' opinions on the new packaging colour.", options: ["Relevant case", "Not relevant"], answer: 1,
    why: "Opinions about colour are not adverse events." },
  { id: 'cq-lit-027', diff: 1, type: 'bin', q: 'A review of the chemical synthesis of Compound Z.', options: ["Relevant case", "Not relevant"], answer: 1,
    why: "Chemistry, not safety." },
  { id: 'cq-lit-028', diff: 1, type: 'bin', q: 'A study of Product A in dogs showing liver changes.', options: ["Relevant case", "Not relevant"], answer: 1,
    why: "Animal data can inform safety, but it is not an ICSR." },
  { id: 'cq-lit-029', diff: 3, type: 'bin', review: true, q: 'A cohort of 10,000 patients reports an overall headache rate of 2%. No individual patients described.', options: ["Relevant case", "Not relevant"], answer: 1,
    why: "Aggregate data without identifiable patients is not an ICSR (but may matter for signals)." },
  { id: 'cq-lit-030', diff: 1, type: 'bin', q: 'An editorial on the history of pharmacovigilance.', options: ["Relevant case", "Not relevant"], answer: 1,
    why: "A good read, but no cases." },
  { id: 'cq-lit-031', diff: 2, type: 'bin', q: 'A patient took Product A for a year and reported no problems at all.', options: ["Relevant case", "Not relevant"], answer: 1,
    why: "No adverse event and no special situation: nothing to report." },
  { id: 'cq-lit-032', diff: 3, type: 'bin', q: "A case report of rash on another company's product. No exposure to your product.", options: ["Relevant case", "Not relevant"], answer: 1,
    why: "Your product isn't a suspect, so it isn't your case." },
  { id: 'cq-lit-033', diff: 1, type: 'bin', q: 'A computer model predicts how Compound Z binds to its target.', options: ["Relevant case", "Not relevant"], answer: 1,
    why: "In silico data: no patient." },
  { id: 'cq-lit-034', diff: 1, type: 'bin', q: "A marketing survey of doctors' brand awareness.", options: ["Relevant case", "Not relevant"], answer: 1,
    why: "Brand awareness is not an adverse event." },
  { id: 'cq-lit-035', diff: 1, type: 'bin', q: 'A study of Compound Z in yeast cells.', options: ["Relevant case", "Not relevant"], answer: 1,
    why: "Yeast is not a patient." },
  { id: 'cq-lit-036', diff: 3, type: 'bin', review: true, q: "'Some patients reportedly felt dizzy.' No patient details at all.", options: ["Relevant case", "Not relevant"], answer: 1,
    why: "No identifiable patient means no valid case." },
  { id: 'cq-lit-037', diff: 1, type: 'bin', q: 'A guideline on storing Product A at room temperature.', options: ["Relevant case", "Not relevant"], answer: 1,
    why: "Storage advice, not safety data." },
  { id: 'cq-lit-038', diff: 1, type: 'bin', q: 'A plant extract study in rabbits.', options: ["Relevant case", "Not relevant"], answer: 1,
    why: "Rabbits: adorable, but not ICSRs." },
  { id: 'cq-lit-039', diff: 1, type: 'bin', q: 'A conference poster on a new tablet coating process.', options: ["Relevant case", "Not relevant"], answer: 1,
    why: "Manufacturing technology: no patients involved." },
  { id: 'cq-lit-040', diff: 2, type: 'bin', q: 'A 29-year-old man had a severe headache after Product B; the authors call it "possibly related".', options: ["Relevant case", "Not relevant"], answer: 0,
    why: "Author's causality doesn't change validity: identifiable patient, product and event." },
];

CONTENT.minigames.serious.bank = [   // Serious or Not? with Nora Narrative: apply the ICH E2A seriousness criteria
  { id: 'cq-ser-001', diff: 1, type: 'bin', q: 'Admitted to hospital overnight for liver failure.', options: ["Serious", "Non-serious"], answer: 0,
    why: "Hospitalisation is a seriousness criterion." },
  { id: 'cq-ser-002', diff: 1, type: 'bin', q: 'Mild headache, gone after a nap.', options: ["Serious", "Non-serious"], answer: 1,
    why: "No seriousness criterion met." },
  { id: 'cq-ser-003', diff: 1, type: 'bin', q: 'Anaphylaxis in the ER. Life-threatening.', options: ["Serious", "Non-serious"], answer: 0,
    why: "Life-threatening = at immediate risk of death at the time of the event." },
  { id: 'cq-ser-004', diff: 1, type: 'bin', q: 'Nausea for two days, no treatment needed.', options: ["Serious", "Non-serious"], answer: 1,
    why: "Unpleasant, but not serious." },
  { id: 'cq-ser-005', diff: 1, type: 'bin', q: 'A baby born with a heart defect after exposure in pregnancy.', options: ["Serious", "Non-serious"], answer: 0,
    why: "Congenital anomaly/birth defect is a seriousness criterion." },
  { id: 'cq-ser-006', diff: 1, type: 'bin', q: 'The patient died. Relationship to the drug unknown.', options: ["Serious", "Non-serious"], answer: 0,
    why: "Death is serious, whatever the causality." },
  { id: 'cq-ser-007', diff: 1, type: 'bin', q: 'Itchy rash on one arm, gone within a week.', options: ["Serious", "Non-serious"], answer: 1,
    why: "No criterion met." },
  { id: 'cq-ser-008', diff: 2, type: 'bin', q: 'Permanent hearing loss after treatment.', options: ["Serious", "Non-serious"], answer: 0,
    why: "Persistent or significant disability/incapacity." },
  { id: 'cq-ser-009', diff: 1, type: 'bin', q: 'Felt a bit tired after the dose.', options: ["Serious", "Non-serious"], answer: 1,
    why: "Common and non-serious." },
  { id: 'cq-ser-010', diff: 2, type: 'bin', q: 'A seizure treated in the ER to prevent a worse outcome.', options: ["Serious", "Non-serious"], answer: 0,
    why: "Medically important event: medical judgement makes it serious." },
  { id: 'cq-ser-011', diff: 2, type: 'bin', q: 'Hospital stay extended by three days because of a drug rash.', options: ["Serious", "Non-serious"], answer: 0,
    why: "Prolongation of an existing hospitalisation counts." },
  { id: 'cq-ser-012', diff: 3, type: 'bin', q: '"SEVERE toothache," says the reporter. No treatment was needed.', options: ["Serious", "Non-serious"], answer: 1,
    why: "Severe is intensity, not seriousness. No criterion met." },
  { id: 'cq-ser-013', diff: 2, type: 'bin', q: 'Went to the GP for a rash and got a cream.', options: ["Serious", "Non-serious"], answer: 1,
    why: "An outpatient visit is not hospitalisation." },
  { id: 'cq-ser-014', diff: 3, type: 'bin', q: 'Seen in the ER for a mild allergic rash, sent home after two hours.', options: ["Serious", "Non-serious"], answer: 1,
    why: "An ER visit alone is not hospitalisation. Judge the event itself." },
  { id: 'cq-ser-015', diff: 3, type: 'bin', q: 'A planned hospital admission for elective surgery booked before the drug was started.', options: ["Serious", "Non-serious"], answer: 1,
    why: "The hospitalisation must be caused by the event. A planned admission isn't." },
  { id: 'cq-ser-016', diff: 2, type: 'bin', q: 'Stevens-Johnson syndrome, treated as an outpatient.', options: ["Serious", "Non-serious"], answer: 0,
    why: "SJS is a medically important event, even without admission." },
  { id: 'cq-ser-017', diff: 2, type: 'bin', q: 'Agranulocytosis requiring close monitoring.', options: ["Serious", "Non-serious"], answer: 0,
    why: "Medically important: it could quickly become life-threatening." },
  { id: 'cq-ser-018', diff: 2, type: 'bin', q: 'A suicide attempt while on treatment.', options: ["Serious", "Non-serious"], answer: 0,
    why: "Considered a medically important event." },
  { id: 'cq-ser-019', diff: 2, type: 'bin', q: 'Permanently unable to walk after a stroke.', options: ["Serious", "Non-serious"], answer: 0,
    why: "Persistent disability." },
  { id: 'cq-ser-020', diff: 1, type: 'bin', q: 'Admitted for severe dehydration from diarrhoea.', options: ["Serious", "Non-serious"], answer: 0,
    why: "Hospitalisation." },
  { id: 'cq-ser-021', diff: 1, type: 'bin', q: 'A pulmonary embolism treated in hospital.', options: ["Serious", "Non-serious"], answer: 0,
    why: "Hospitalised, and potentially life-threatening." },
  { id: 'cq-ser-022', diff: 1, type: 'bin', q: 'Cleft lip in a baby exposed during pregnancy.', options: ["Serious", "Non-serious"], answer: 0,
    why: "Congenital anomaly." },
  { id: 'cq-ser-023', diff: 1, type: 'bin', q: 'An overdose that led to a coma.', options: ["Serious", "Non-serious"], answer: 0,
    why: "Life-threatening." },
  { id: 'cq-ser-024', diff: 2, type: 'bin', q: 'Drug-induced liver injury requiring a liver transplant.', options: ["Serious", "Non-serious"], answer: 0,
    why: "Hospitalisation and life-threatening: very serious." },
  { id: 'cq-ser-025', diff: 2, type: 'bin', q: 'Lost the sight in one eye.', options: ["Serious", "Non-serious"], answer: 0,
    why: "Persistent or significant incapacity." },
  { id: 'cq-ser-026', diff: 3, type: 'bin', q: 'The patient died in a car accident while drowsy on the drug.', options: ["Serious", "Non-serious"], answer: 0,
    why: "Death is a seriousness criterion. Causality is assessed separately." },
  { id: 'cq-ser-027', diff: 2, type: 'bin', q: 'Anaphylaxis treated with adrenaline in the ER; home the same day.', options: ["Serious", "Non-serious"], answer: 0,
    why: "Anaphylaxis is medically important even without admission." },
  { id: 'cq-ser-028', diff: 1, type: 'bin', q: 'Dry mouth for a week.', options: ["Serious", "Non-serious"], answer: 1,
    why: "No criterion met." },
  { id: 'cq-ser-029', diff: 1, type: 'bin', q: 'Trouble sleeping for three nights.', options: ["Serious", "Non-serious"], answer: 1,
    why: "Non-serious insomnia." },
  { id: 'cq-ser-030', diff: 1, type: 'bin', q: 'Mild diarrhoea that settled on its own.', options: ["Serious", "Non-serious"], answer: 1,
    why: "Self-limiting and non-serious." },
  { id: 'cq-ser-031', diff: 1, type: 'bin', q: 'Noticed some hair thinning.', options: ["Serious", "Non-serious"], answer: 1,
    why: "Distressing, but no seriousness criterion." },
  { id: 'cq-ser-032', diff: 1, type: 'bin', q: 'A 2 cm red patch at the injection site.', options: ["Serious", "Non-serious"], answer: 1,
    why: "Local reaction, non-serious." },
  { id: 'cq-ser-033', diff: 1, type: 'bin', q: 'Dizzy when standing up; resolved quickly.', options: ["Serious", "Non-serious"], answer: 1,
    why: "Non-serious." },
  { id: 'cq-ser-034', diff: 1, type: 'bin', q: 'Gained 2 kg over two months.', options: ["Serious", "Non-serious"], answer: 1,
    why: "Non-serious." },
  { id: 'cq-ser-035', diff: 1, type: 'bin', q: 'A metallic taste in the mouth.', options: ["Serious", "Non-serious"], answer: 1,
    why: "Non-serious dysgeusia." },
  { id: 'cq-ser-036', diff: 3, type: 'bin', review: true, q: 'Stayed overnight in hospital only because no carer was available at home. No medical need.', options: ["Serious", "Non-serious"], answer: 1,
    why: "An admission for social reasons, with no medical need, is generally not a seriousness criterion." },
  { id: 'cq-ser-037', diff: 1, type: 'bin', q: 'Mild constipation for a few days.', options: ["Serious", "Non-serious"], answer: 1,
    why: "Non-serious." },
  { id: 'cq-ser-038', diff: 1, type: 'bin', q: 'A cold sweat for one afternoon.', options: ["Serious", "Non-serious"], answer: 1,
    why: "Non-serious." },
  { id: 'cq-ser-039', diff: 3, type: 'bin', q: 'A bad headache kept the patient off work for one day.', options: ["Serious", "Non-serious"], answer: 1,
    why: "One day off work is not persistent or significant incapacity." },
  { id: 'cq-ser-040', diff: 2, type: 'bin', q: 'Taken to intensive care with severe low blood pressure.', options: ["Serious", "Non-serious"], answer: 0,
    why: "Hospitalisation, and likely life-threatening." },

const $ = (s) => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
/** Like pick(), but never returns the same item twice in a row for the same key. */
const _lastPick = {};
const pickFresh = (arr, key) => {
  if (arr.length < 2) return arr[0];
  let v; do { v = pick(arr); } while (v === _lastPick[key]);
  return (_lastPick[key] = v);
};
/** Cycles through a list in random order before repeating (one bag per key, for this session). */
const _bags = {};
const drawFromBag = (arr, key) => {
  let b = _bags[key];
  if (!b || !b.length) {
    b = _bags[key] = arr.map((_, i) => i).sort(() => Math.random() - 0.5);
    if (arr.length > 1 && b[b.length - 1] === _lastPick[key]) b.unshift(b.pop());
  }
  const i = b.pop(); _lastPick[key] = i;
  return arr[i];
};

/* =====================================================================
   MAP: 40x26 tile office, built from rooms + furniture placements
   ===================================================================== */
const T = 32;                 // tile size in world pixels
const MAP_W = 40, MAP_H = 26;
const FEET = 8;               // feet sit this far below the tile center
const GRID = [];              // GRID[y][x] = '#' wall, '.' floor, or a furniture letter
const FLOOR = [];             // FLOOR[y][x] = zone key used for floor styling
const OBJECTS = [];           // furniture objects { type, x, y, w, h }
const ZONES = {
  director: { x: 1,  y: 1,  w: 10, h: 6,  label: 'DIRECTOR' },
  manager:  { x: 12, y: 1,  w: 11, h: 6,  label: 'MANAGER' },
  restroom: { x: 24, y: 1,  w: 3,  h: 6,  label: 'WC' },
  meeting:  { x: 28, y: 1,  w: 11, h: 6,  label: 'MEETING ROOM' },
  open:     { x: 1,  y: 8,  w: 38, h: 10, label: 'PV OPEN PLAN' },
  kitchen:  { x: 1,  y: 19, w: 14, h: 6,  label: 'KITCHEN' },
  break:    { x: 16, y: 19, w: 23, h: 6,  label: 'BREAK AREA' },
};
const DOORS = [[8, 7, 2, 1], [17, 7, 2, 1], [25, 7, 1, 1], [30, 7, 2, 1], [6, 18, 2, 1], [22, 18, 3, 1]];
// Furniture letters: D desk, M my desk, C coffee machine, K counter, F fridge, k kitchen table, T meeting table,
// W whiteboard, H shelf, X manager desk, Z director desk, P printer, s sofa, v TV, g ping pong, a arcade, p plant, w water cooler,
// L toilet, n sink, V vending machine, B noticeboard
const INTERACT_TYPES = new Set(['M', 'C', 'P', 'F', 'a', 'v', 'W', 'T', 'X', 'Z', 's', 'w', 'k', 'H', 'D', 'p', 'g', 'K', 'L', 'n', 'V', 'B']);

function buildMap() {
  for (let y = 0; y < MAP_H; y++) { GRID[y] = Array(MAP_W).fill('#'); FLOOR[y] = Array(MAP_W).fill('open'); }
  const carve = (x, y, w, h, key) => { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) { GRID[j][i] = '.'; FLOOR[j][i] = key; } };
  for (const [key, z] of Object.entries(ZONES)) carve(z.x, z.y, z.w, z.h, key);
  for (const d of DOORS) carve(d[0], d[1], d[2], d[3], 'door');
  const place = (type, x, y, w = 1, h = 1) => {
    for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) GRID[j][i] = type;
    OBJECTS.push({ type, x, y, w, h, id: OBJECTS.length });
  };
  // director
  place('H', 4, 1, 4, 1); place('p', 1, 1); place('p', 10, 1); place('Z', 3, 3, 4, 1); place('p', 1, 6);
  // manager
  place('H', 14, 1, 4, 1); place('p', 22, 1); place('X', 15, 3, 4, 1); place('p', 12, 6);
  // meeting room
  place('W', 29, 1, 8, 1); place('T', 29, 3, 8, 2); place('p', 28, 6); place('p', 38, 6);
  // restroom (WC)
  place('L', 25, 1); place('n', 24, 4);
  // open plan desk clusters (2 tiles per desk, back to back)
  for (const cx of [3, 11, 19, 27]) for (const r of [10, 14]) for (const dy of [0, 1]) for (const dx of [0, 2]) {
    const mine = cx === 19 && r === 10 && dy === 0 && dx === 2;
    place(mine ? 'M' : 'D', cx + dx, r + dy, 2, 1);
  }
  place('P', 37, 10, 1, 2); place('w', 1, 8); place('p', 38, 8); place('p', 1, 13); place('p', 38, 13);
  place('C', 33, 8, 2, 1);   // open-plan coffee corner, close to the desks
  place('V', 36, 8);         // vending machine: snacks for Energy
  // kitchen
  place('K', 1, 24, 7, 1); place('C', 8, 24, 2, 1); place('K', 10, 24, 3, 1); place('F', 13, 23, 2, 2); place('k', 5, 20, 3, 2);
  // break area
  place('v', 19, 19, 3, 1); place('s', 18, 22, 5, 1); place('g', 28, 21, 5, 2); place('a', 37, 19, 1, 2); place('p', 16, 24); place('p', 38, 24);
  place('B', 26, 19, 3, 1);   // noticeboard with the pinned corporate emails
  // desks remember which side the chair is on
  for (const o of OBJECTS) if (o.type === 'D' || o.type === 'M') o.sitterAbove = walkable(o.x, o.y - 1);
  for (const o of OBJECTS) if (o.type === 'C') o.label = 'COFFEE';

/* =====================================================================
   PATHFINDING (BFS on the tile grid)
   ===================================================================== */
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

/** Shortest walkable path from (sx,sy) to any tile where isGoal(x,y) is true. Returns [{tx,ty}] excluding start, or null. */

    const cur = q[h], cx = cur % MAP_W, cy = (cur / MAP_W) | 0;

      const path = [];
      for (let c = cur; c !== start; c = prev[c]) path.push({ tx: c % MAP_W, ty: (c / MAP_W) | 0 });
      return path.reverse();
    }
    for (const [, [dx, dy]] of DIR_LIST) {
      const nx = cx + dx, ny = cy + dy, ni = nx + ny * MAP_W;
      if (!walkable(nx, ny) || prev[ni] !== -1) continue;
      if (avoid && avoid(nx, ny) && !isGoal(nx, ny)) continue;

/* =====================================================================
   ENTITIES + GRID MOVEMENT (Pokemon style: one tile per step)
   ===================================================================== */
function makeEntity(id, def) {

    tx: h.tx, ty: h.ty, fx: h.tx, fy: h.ty, x: 0, y: 0, dir: h.dir, home: h,
    moving: false, moveT: 0, moveDur: 0.2, foot: 0, path: [], blockT: 0, onArrive: null,
    state: 'idle', waitT: rand(1, 4), say: null, chatReadyAt: 0, seed: Math.random() * 10, exclaimUntil: 0 };
}
const PLAYER = makeEntity('casey', CONTENT.people.casey);
Object.assign(PLAYER, { turnT: 0, wasWalking: false, lockedUntil: 0, lockReason: '', lockStart: 0, bumpT: 0 });
const NPCS = ['nora', 'max', 'lin', 'quinn', 'manager', 'director'].map((id) => makeEntity(id, CONTENT.people[id]));
const MANAGER = NPCS.find((n) => n.role === 'manager');

const ALL = [PLAYER, ...NPCS];

function occupied(tx, ty, except) { return ALL.some((e) => e !== except && e.tx === tx && e.ty === ty); }

function dirTo(e, tx, ty) {

/** Try to step one tile in a direction. Returns true if the step started. */
function startStep(e, dir, dur) {

/** Follow e.path one tile at a time; waits (and eventually re-plans) when someone is in the way. */

/* Main simulation step (world is frozen while a dialogue or scene is open) */

/* =====================================================================

function inRegenZone() { const c = S.stats.caffeine, z = CONFIG.energyRegen; return c >= z.caffeineMin && c <= z.caffeineMax; }

function updateStats(dt) {
  const st = S.stats, C = CONFIG, m = Math.min(C.difficulty.maxDrainMult, 1 + (S.day - 1) * C.difficulty.drainPerDay);
  for (const k of STAT_KEYS) st[k] -= C.stats[k].drain * m * dt;
  if (inRegenZone()) st.energy += C.energyRegen.rate * dt;

/** Apply a bag of effects (stat deltas + special keys). Returns the net stat change. */
function applyEffects(fx) {
  let net = 0;
  for (const [k, v] of Object.entries(fx || {})) {
    if (!v) continue;
    if (k in S.stats) {
      S.stats[k] = clamp(S.stats[k] + v, 0, 100);
      pop(`${v > 0 ? '+' : ''}${v} ${CONFIG.stats[k].short}`, v > 0 ? CONFIG.stats[k].color : '#ff4d4d');
      UI.bump(k, v);
      net += v;
    } else if (k === 'cases') { for (let i = 0; i < v; i++) spawnCase({}); }
    else if (k === 'serious') { for (let i = 0; i < v; i++) spawnCase({ serious: true }); }
    else if (k === 'favor') { for (let i = 0; i < v; i++) spawnCase({ favor: true }); }
    else if (k === 'removeCase') removeCases(v);

/* =====================================================================

    input.tap = null; P.path = []; P.onArrive = null;

/* What is on the tile Casey is facing? */

/* =====================================================================
   CASES (the core loop)
   ===================================================================== */
const STEPS = CONFIG.work.steps;

  S.caseSeq++;
  const c = { id: S.caseSeq, code: `AE-${S.caseSeq}`, serious, favor: !!opts.favor,
    title: pick(serious ? CONTENT.cases.serious : CONTENT.cases.normal),
    source: opts.favor ? 'FAVOR' : pick(CONTENT.cases.sources),
    step: 0, progress: 0, deadline: S.time + total, total, late: false, bounced: false };

  return c;
}
function removeCases(n) {

    const cands = S.cases.filter((c) => c !== activeCase() && c.step === 0);

function workTick(dt) {

  if (S.time < S.dbDownUntil) return;
  const C = CONFIG.work;
  S.working = true;
  let speed = 1;
  if (S.stats.energy < CONFIG.moods.exhaustedBelow) speed = C.exhaustedSpeed;
  if (S.stats.caffeine > CONFIG.jitter.threshold) speed *= C.jitterySpeed;

    V.workSayT -= dt; if (V.workSayT <= 0) { say(pick(CONTENT.lines.work)); V.workSayT = 6; }

}

    c.bounced = true; c.step = STEPS.findIndex((s) => s.id === 'narrative'); c.progress = 0; S.casesVersion++;
    if (!SIM) { pop('QC BOUNCE!', '#ff3b3b', 3); say(pick(CONTENT.lines.qcBounce)); sfx.bad(); }
    queueScold('manager', 'qc');

}

    if (!SIM) { pop(`+${CONFIG.score.perCase} ON TIME!`, '#39ff88', 3); sfx.submit(); say(pickFresh(CONTENT.lines.steps.submit, 'step-submit')); V.happyUntil = V.t + 1.5;
      for (let i = 0; i < 10; i++) emit('star', PLAYER.x + rand(-20, 20), PLAYER.y - 40, { vx: rand(-60, 60), vy: rand(-90, -30), life: 0.8 }); }

/** Arrivals speed up a little each day (capped) and come in waves, so there are quiet stretches for coffee and games. */
function caseWave() { const C = CONFIG.cases; return 1 + C.waveAmp * Math.sin(2 * Math.PI * S.time / C.waveSeconds); }

  const C = CONFIG.cases;

    else { spawnCase({}); S.nextCaseAt = S.time + rand(C.arrivalMin, C.arrivalMax) / caseRate(); }

/* =====================================================================

    n.exclaimUntil = V.t + CONFIG.scold.exclaimSeconds; n.pauseUntil = S.time + CONFIG.scold.exclaimSeconds;
    S.approaching = n;

    const p = bfs(n.tx, n.ty, (a, b) => goals.has(a + ',' + b) && !occupied(a, b, n), (a, b) => occupied(a, b, n));

const NOTE = { G2: 98, Ab2: 103.83, Bb2: 116.54, C3: 130.81, D3: 146.83, Eb3: 155.56, F3: 174.61, G3: 196,

const sfx = {

/* Tiny chiptune loop: bass + hi-hat, speeds up when a stat is in danger */
const Music = {
  playing: false, step: 0, nextT: 0, timer: null,
  prog: ['C3', 'Ab2', 'Bb2', 'G2'],
  start() {
    if (!CONFIG.audio.music || !Sound.ctx || this.playing) return;
    this.playing = true; this.step = 0; this.nextT = Sound.ctx.currentTime + 0.1;
    this.timer = setInterval(() => this.schedule(), 25);
  },
  stop() { this.playing = false; clearInterval(this.timer); this.timer = null; },
  schedule() {
    if (!this.playing || !Sound.ctx) return;
    const ctx = Sound.ctx;
    const tempo = CONFIG.audio.bpm * (S.mode === 'playing' && anyDanger() ? CONFIG.audio.dangerTempo : 1);
    const stepLen = 60 / tempo / 2;
    while (this.nextT < ctx.currentTime + 0.12) {
      const i = this.step % 32, bar = Math.floor(i / 8), beat = i % 8;
      const root = NOTE[this.prog[bar]];
      const f = [root, root * 2, root * 1.5, root * 2, root, root * 2, root * 1.5, root * 2][beat];
      const delay = this.nextT - ctx.currentTime;
      Sound.tone(f, stepLen * 0.9, { type: 'triangle', vol: 0.22, delay, dest: Sound.musicBus });
      if (beat % 2 === 1) Sound.noise(0.03, { vol: 0.05, filter: 7000, high: true, delay, dest: Sound.musicBus });
      if (beat === 0 && this.step % 64 >= 32) Sound.tone(root * 4, stepLen * 1.8, { type: 'square', vol: 0.05, delay, dest: Sound.musicBus });
      this.nextT += stepLen; this.step++;
    }
  },
};

function pxWidth(text, s) { return text.length * 6 * s - s; }
function drawPxRaw(ctx, text, x, y, s, color) {
  ctx.fillStyle = color;
  for (let i = 0; i < text.length; i++) {
    const g = FONT[text[i]] || FONT[' '];
    for (let r = 0; r < 7; r++) {
      const row = g[r];
      if (!row) continue;
      for (let c = 0; c < 5; c++) if (row & (16 >> c)) ctx.fillRect(x + (i * 6 + c) * s, y + r * s, s, s);
    }
  }
}
function drawPx(ctx, text, x, y, s, color, align = 'left', shadow = null) {
  text = String(text).toUpperCase();
  const w = pxWidth(text, s);
  const x0 = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
  if (shadow) drawPxRaw(ctx, text, x0 + s, y + s, s, shadow);
  drawPxRaw(ctx, text, x0, y, s, color);
}
function wrapWords(text, maxChars) {
  const words = String(text).toUpperCase().split(' ');
  const lines = [];
  let cur = '';
  for (const w of words) {
    if (cur && (cur + ' ' + w).length > maxChars) { lines.push(cur); cur = w; } else cur = cur ? cur + ' ' + w : w;
  }
  if (cur) lines.push(cur);
  return lines;
}
/* A crisp <canvas> element containing pixel text (for DOM overlays) */
function pxCanvas(lines, s, color, shadow = '#000', cls = '') {
  if (typeof lines === 'string') lines = [lines.toUpperCase()];
  const maxLen = Math.max(...lines.map((l) => l.length));
  const c = document.createElement('canvas');
  c.width = pxWidth('x'.repeat(maxLen), s) + s;
  c.height = lines.length * 9 * s - 2 * s + s;
  c.className = 'px ' + cls;
  const ctx = c.getContext('2d');
  lines.forEach((l, i) => {
    const x = (c.width - s - pxWidth(l, s)) / 2;
    drawPxRaw(ctx, l, x + s, i * 9 * s + s, s, shadow);
    drawPxRaw(ctx, l, x, i * 9 * s, s, color);
  });
  return c;
}

/* =====================================================================

const INK = '#1d1830';
const cv = $('#world'), ctx = cv.getContext('2d');
const cam = { x: 0, y: 0, zoom: 2, inset: 0, vw: 0, vh: 0, dpr: 1 };

function resizeView() {
  cam.dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(innerWidth * cam.dpr);
  cv.height = Math.round(innerHeight * cam.dpr);
  cam.inset = innerWidth <= 700 ? Math.round($('#hudTop').getBoundingClientRect().bottom) : 0;
  updateCamera(0, true);
}
function updateCamera(dt, snap) {
  const W = innerWidth, H = Math.max(120, innerHeight - cam.inset);
  cam.zoom = Math.min(Math.max(innerWidth, innerHeight) / (CONFIG.view.tilesAcross * T), Math.min(W, H) / (CONFIG.view.minTiles * T));
  cam.vw = W / cam.zoom; cam.vh = H / cam.zoom;
  const mw = MAP_W * T, mh = MAP_H * T;
  let tx = PLAYER.x - cam.vw / 2, ty = PLAYER.y - 24 - cam.vh / 2;
  tx = mw <= cam.vw ? (mw - cam.vw) / 2 : clamp(tx, 0, mw - cam.vw);
  ty = mh <= cam.vh ? (mh - cam.vh) / 2 : clamp(ty, 0, mh - cam.vh);
  const k = snap ? 1 : 1 - Math.exp(-dt * 10);
  cam.x += (tx - cam.x) * k; cam.y += (ty - cam.y) * k;
}
function shakeOffset() {
  if (V.shakeT <= 0) return { x: 0, y: 0 };

}
function toScreen(wx, wy) { return { x: (wx - cam.x) * cam.zoom, y: cam.inset + (wy - cam.y) * cam.zoom }; }
function toWorld(sx, sy) { return { x: sx / cam.zoom + cam.x, y: (sy - cam.inset) / cam.zoom + cam.y }; }

// ---- primitives ----
function rr(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  c.lineTo(x + r, y + h); c.quadraticCurveTo(x, y + h, x, y + h - r);
  c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y); c.closePath();
}

/* ---- Table tennis (Pong) ---- */
class PongGame {
  constructor(def, npc) {
    this.kind = 'pong'; this.def = def; this.npc = npc;
    this.W = 480; this.H = 270; this.PH = 54; this.PW = 10;
    this.py = this.H / 2; this.cy = this.H / 2; this.pointerY = null;
    this.score = [0, 0]; this.state = 'intro'; this.t = 0; this.cpuErr = 0; this.ball = null;
  }
  serve(dir) {
    const C = CONFIG.minigames.pong, a = rand(-0.5, 0.5);
    this.ball = { x: this.W / 2, y: this.H / 2, vx: Math.cos(a) * C.ballSpeed * dir, vy: Math.sin(a) * C.ballSpeed, r: 6 };
    this.cpuErr = rand(-18, 18);
  }
  update(dt) {
    const C = CONFIG.minigames.pong;
    this.t += dt;
    if (this.state === 'intro') { if (this.t > 1.6) { this.state = 'play'; this.serve(Math.random() < 0.5 ? 1 : -1); } return; }
    if (this.state === 'point') { if (this.t > 0.9) { if (Math.max(...this.score) >= C.pointsToWin) this.finish(); else { this.state = 'play'; this.serve(this.lastWinner === 0 ? 1 : -1); } } return; }
    if (this.state !== 'play') return;
    // player paddle: keys / joystick / pointer drag
    // paddle: keys give full speed, the joystick is analogue, pointer/touch drag follows the finger;
    // velocity eases toward the target so it feels quick but smooth
    const half = this.PH / 2 + 4;
    let want = 0;
    const v = input.joyVec;
    if (v && Math.abs(v.y) > 0.12) want = v.y * C.paddleSpeed;
    else { const d = heldDir(); if (d === 'up') want = -C.paddleSpeed; if (d === 'down') want = C.paddleSpeed; }
    if (this.pointerY != null) want = clamp((this.pointerY - this.py) * 14, -C.paddleSpeed * 1.4, C.paddleSpeed * 1.4);
    this.pv = (this.pv || 0) + (want - (this.pv || 0)) * Math.min(1, dt * C.paddleAccel);
    this.py = clamp(this.py + this.pv * dt, half, this.H - half);
    if (this.py === half || this.py === this.H - half) this.pv = 0;
    // CPU paddle: tracks the ball with a little human error
    const b = this.ball;
    const target = b.vx > 0 ? b.y + this.cpuErr : this.H / 2;
    this.cy += clamp(target - this.cy, -C.cpuSpeed * dt, C.cpuSpeed * dt);
    this.cy = clamp(this.cy, half, this.H - half);
    // ball
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.y < b.r) { b.y = b.r; b.vy = Math.abs(b.vy); sfx.tick(); }
    if (b.y > this.H - b.r) { b.y = this.H - b.r; b.vy = -Math.abs(b.vy); sfx.tick(); }
    const hit = (px, py, side) => {
      if (Math.abs(b.x - px) > this.PW / 2 + b.r || Math.abs(b.y - py) > this.PH / 2 + b.r) return false;
      const speed = Math.min(C.maxBallSpeed, Math.hypot(b.vx, b.vy) * C.speedUpPerHit);
      const off = clamp((b.y - py) / (this.PH / 2), -1, 1);
      const ang = off * 0.9;
      b.vx = Math.cos(ang) * speed * side; b.vy = Math.sin(ang) * speed;
      b.x = px + side * (this.PW / 2 + b.r + 1);
      sfx.blip();
      return true;
    };
    if (b.vx < 0) hit(24, this.py, 1);
    else if (hit(this.W - 24, this.cy, -1)) this.cpuErr = rand(-30, 30) * (1 + Math.hypot(b.vx, b.vy) / 400);
    if (b.x < -20 || b.x > this.W + 20) {
      const winner = b.x > this.W ? 0 : 1;
      this.score[winner]++; this.lastWinner = winner;
      this.state = 'point'; this.t = 0;
      winner === 0 ? sfx.stepDone() : sfx.meh();
      UI.renderMinigame(this);
    }
  }
  finish() {
    const C = CONFIG.minigames.pong, won = this.score[0] > this.score[1];
    this.reward = won ? C.win : C.lose;
    this.resultLine = pick(won ? this.def.win : this.def.lose);
    this.won = won; this.state = 'result'; this.t = 0;
    won ? sfx.submit() : sfx.meh();
    UI.renderMinigame(this);
  }
  key(k) { if (this.state === 'result' && this.t > 0.4 && ['e', ' ', 'enter'].includes(k)) endMinigame(); }
  render(c) {
    const W = this.W, H = this.H;
    c.fillStyle = '#1f7a4d'; c.fillRect(0, 0, W, H);
    c.strokeStyle = '#ffffff'; c.lineWidth = 3; c.strokeRect(4, 4, W - 8, H - 8);
    c.setLineDash([8, 8]); c.beginPath(); c.moveTo(W / 2, 6); c.lineTo(W / 2, H - 6); c.stroke(); c.setLineDash([]);
    c.globalAlpha = 0.35; c.beginPath(); c.moveTo(6, H / 2); c.lineTo(W - 6, H / 2); c.lineWidth = 1.5; c.stroke(); c.globalAlpha = 1;
    drawPx(c, String(this.score[0]), W / 2 - 40, 16, 4, '#ffffff', 'center', '#0d3d26');
    drawPx(c, String(this.score[1]), W / 2 + 40, 16, 4, '#ffffff', 'center', '#0d3d26');
    const oppColor = this.npc ? (this.npc.look.jacket || this.npc.look.shirt) : '#ff3fb4';
    for (const [x, y, col] of [[24, this.py, PLAYER.look.jacket], [W - 24, this.cy, oppColor]]) {
      c.fillStyle = col; rr(c, x - this.PW / 2, y - this.PH / 2, this.PW, this.PH, 4); c.fill(); ink(c, 2.5);
    }
    if (this.ball && this.state === 'play') {
      c.fillStyle = 'rgba(0,0,0,.25)'; ellipse(c, this.ball.x + 3, this.ball.y + 4, 6, 4); c.fill();
      c.fillStyle = '#fff6d8'; circle(c, this.ball.x, this.ball.y, this.ball.r); c.fill(); ink(c, 2);
    }
    drawPx(c, 'CASEY', 24, H - 16, 1, '#ffffff', 'left');
    drawPx(c, this.npc ? this.npc.name.split(' ')[0] : 'CPU', W - 24, H - 16, 1, '#ffffff', 'right');
    if (this.state === 'intro') drawPx(c, 'FIRST TO ' + CONFIG.minigames.pong.pointsToWin + '!', W / 2, H / 2 - 10, 3, '#ffd23f', 'center', INK);
    if (this.state === 'point') drawPx(c, this.lastWinner === 0 ? 'POINT CASEY!' : 'POINT ' + (this.npc ? this.npc.name.split(' ')[0] : 'CPU') + '!', W / 2, H / 2 - 10, 3, '#ffd23f', 'center', INK);
  }
}

/* =====================================================================
   QUESTION GAMES: PV Trivia (arcade) + the four colleague quizzes, one shared engine
   ===================================================================== */
/** A no-repeat "shuffle bag" over a question bank, remembered in localStorage across games and sessions.
 *  An item only comes back after the whole bank has been used; then the bag reshuffles. */
function makeQuestionBag(storageKey, getBank) {
  const bag = {
    seen: new Set(), lastCat: null, cycle: 1,
    load() {
      const d = Store.get(storageKey, null);
      this.seen = new Set(d && Array.isArray(d.seen) ? d.seen : []);
      this.lastCat = (d && d.lastCat) || null;
      this.cycle = (d && d.cycle) || 1;
    },
    save() { Store.set(storageKey, { seen: [...this.seen], lastCat: this.lastCat, cycle: this.cycle }); },
    mixFor(day) {
      let mix = CONFIG.trivia.difficultyByDay[0].mix;
      for (const r of CONFIG.trivia.difficultyByDay) if (day >= r.fromDay) mix = r.mix;
      return mix;
    },
    draw(day) {
      const bank = getBank();
      let pool = bank.filter((q) => !this.seen.has(q.id));
      if (!pool.length) { this.seen.clear(); this.cycle++; pool = bank.slice(); }   // whole bank used: reshuffle
      const otherCat = pool.filter((q) => q.cat !== this.lastCat);                   // no same category twice in a row
      if (otherCat.length) pool = otherCat;
      // difficulty ramp: pick a target difficulty for this day, fall back to the nearest one that still has items
      const mix = this.mixFor(day);
      let r = Math.random() * ((mix[1] || 0) + (mix[2] || 0) + (mix[3] || 0)), target = 1;
      for (const d of [1, 2, 3]) { r -= mix[d] || 0; if (r <= 0) { target = d; break; } }
      const order = [1, 2, 3].sort((a, b) => Math.abs(a - target) - Math.abs(b - target) || a - b);
      let cands = [];
      for (const d of order) { cands = pool.filter((q) => q.diff === d); if (cands.length) break; }
      const q = pick(cands);
      this.seen.add(q.id); this.lastCat = q.cat || null; this.save();
      return q;
    },
  };
  bag.load();
  return bag;
}
const TriviaBag = makeQuestionBag(CONFIG.storageKeys.trivia, () => CONTENT.triviaBank);
const QuizBags = {};
function quizBag(id) { return QuizBags[id] || (QuizBags[id] = makeQuestionBag(CONFIG.storageKeys.quizPrefix + id, () => CONTENT.minigames[id].bank)); }

function prepareTrivia(q) {
  let opts;
  if (q.type === 'tf') opts = [{ text: 'TRUE', ok: q.answer === true }, { text: 'FALSE', ok: q.answer === false }];
  else {
    opts = q.options.map((text, i) => ({ text, ok: i === q.answer }));
    if (q.type !== 'bin') opts = shuffle(opts);   // yes/no style games keep their fixed button order
  }
  return { ...q, opts };
}
function triviaMultiplier(streak) {
  let x = 1;
  for (const m of CONFIG.trivia.multipliers) if (streak >= m.streak) x = m.x;
  return x;
}
function startTrivia() {
  if (!minigameReady('trivia')) { say(pick(CONTENT.props.a.lines)); sfx.denied(); return; }
  startMinigame('trivia', null);
}
const sfxTrivia = {
  correct() { Sound.seq([NOTE.C5, NOTE.E5, NOTE.G5, NOTE.C6], 0.06, { vol: 0.18 }); },
  wrong()   { Sound.tone(260, 0.18, { type: 'sawtooth', vol: 0.18 }); Sound.tone(180, 0.35, { type: 'sawtooth', vol: 0.18, slide: 90, delay: 0.16 }); },
  streak()  { Sound.seq([NOTE.G5, NOTE.C6, NOTE.G5, NOTE.C6, NOTE.E5, NOTE.C6], 0.05, { vol: 0.15, delay: 0.28 }); },
};

/** One engine for PV Trivia (id 'trivia') and the colleague quizzes (id = their CONTENT.minigames key). */
class TriviaGame {
  constructor(def, npc = null, id = 'trivia') {
    this.kind = 'trivia'; this.id = id; this.def = def; this.npc = npc;
    this.colleague = id !== 'trivia';
    this.bag = this.colleague ? quizBag(id) : TriviaBag;
    this.n = this.colleague ? CONFIG.minigames.quizRounds : CONFIG.trivia.questionsPerGame;
    this.round = -1; this.correct = 0; this.points = 0; this.gained = 0; this.bonusMsg = '';
    this.bestStreak = this.streak;
    this.state = 'intro'; this.t = 0; this.q = null; this.picked = null;
  }
  get streak() { return this.colleague ? (S.quizStreaks[this.id] || 0) : (S.triviaStreak || 0); }
  set streak(v) { if (this.colleague) S.quizStreaks[this.id] = v; else S.triviaStreak = v; }
  update(dt) {
    this.t += dt;
    if (this.state === 'intro' && this.t > 1.8) this.next();
    else if (this.state === 'question') { this.timeLeft -= dt; if (this.timeLeft <= 0) this.answer(-1); }
    else if (this.state === 'feedback' && this.t > CONFIG.trivia.whySeconds) this.next();
  }
  next() {
    this.round++; this.t = 0; this.picked = null; this.gained = 0; this.bonusMsg = '';
    if (this.round >= this.n) return this.finish();
    this.q = prepareTrivia(this.bag.draw(S.day));
    const secs = this.colleague ? CONFIG.minigames.quizSeconds : CONFIG.trivia.seconds;
    this.timeTotal = secs[this.q.type] || 10;
    this.timeLeft = this.timeTotal;
    this.state = 'question';
    UI.renderMinigame(this);
  }
  answer(i) {
    if (this.state !== 'question') return;
    const C = CONFIG.trivia;
    this.picked = i;
    this.ok = i >= 0 && !!(this.q.opts[i] && this.q.opts[i].ok);
    if (this.ok) {
      this.correct++;
      this.streak = this.streak + 1;
      this.bestStreak = Math.max(this.bestStreak, this.streak);
      this.mult = triviaMultiplier(this.streak);
      this.gained = Math.round((C.pointsPerDifficulty[this.q.diff] || 100) * this.mult);
      this.points += this.gained;
      sfxTrivia.correct();
      if (this.streak % C.streakBonusEvery === 0) {
        applyEffects(C.streakBonus);
        this.bonusMsg = `STREAK ${this.streak}! ${fxHint(C.streakBonus).replace(/<[^>]+>/g, '')}`;
        sfxTrivia.streak();
      }
    } else {
      this.streak = 0;
      sfxTrivia.wrong();
    }
    this.state = 'feedback'; this.t = 0;
    UI.renderMinigame(this);
  }
  finish() {
    const R = this.colleague ? CONFIG.minigames.quizReward : CONFIG.trivia.reward, frac = this.correct / this.n;
    this.reward = { sanity: R.sanityBase + R.sanityPerCorrect * this.correct, compliance: R.compliancePerCorrect * this.correct };
    this.resultLine = this.def.results[frac >= 1 ? 0 : frac >= 0.6 ? 1 : 2];
    this.state = 'result'; this.t = 0;
    frac >= 0.6 ? sfx.submit() : sfx.meh();
    UI.renderMinigame(this);
  }
  key(k) {
    const go = ['e', ' ', 'enter'].includes(k);
    if (this.state === 'result') { if (this.t > 0.4 && go) endMinigame(); return; }
    if (this.state === 'intro') { if (go) this.next(); return; }
    if (this.state === 'feedback') { if (go && this.t > 0.6) this.next(); return; }
    if (this.state !== 'question') return;
    let i = ['1', '2', '3', '4'].indexOf(k);
    if (this.q.type === 'tf' && (k === 't' || k === 'f')) i = k === 't' ? 0 : 1;
    if (i >= 0 && i < this.q.opts.length) this.answer(i);
  }
}

/* =====================================================================
   WHACK-A-SIGNAL (on the break-room TV): whack real safety signals, leave the noise alone
   ===================================================================== */
const NUMPAD = { 7: 0, 8: 1, 9: 2, 4: 3, 5: 4, 6: 5, 1: 6, 2: 7, 3: 8 };
class WhackGame {
  constructor(def) {
    this.kind = 'whack'; this.def = def; this.npc = null;
    this.W = 480; this.H = 270;
    this.cells = Array.from({ length: 9 }, () => ({ kind: null, label: '', t: 0, dur: 0, hit: 0, hitOk: false }));
    this.cursor = 4; this.state = 'intro'; this.t = 0;
    this.time = CONFIG.minigames.whack.seconds; this.points = 0; this.combo = 0; this.bestCombo = 0;
    this.hits = 0; this.falses = 0; this.missed = 0; this.spawnT = 0.3; this.joyT = 0;
  }
  cellRect(i) {   // screen layout of the 3x3 wall of monitors
    const cw = 120, ch = 56, gap = 10, gx = (this.W - 3 * cw - 2 * gap) / 2, gy = 40;
    const c = i % 3, r = Math.floor(i / 3);
    return { x: gx + c * (cw + gap), y: gy + r * (ch + gap), w: cw, h: ch };
  }
  update(dt) {
    const C = CONFIG.minigames.whack;
    this.t += dt;
    for (const c of this.cells) if (c.hit > 0) c.hit -= dt;
    if (this.state === 'intro') { if (this.t > 1.8) { this.state = 'play'; this.t = 0; } return; }
    if (this.state !== 'play') return;
    this.time -= dt;
    if (this.time <= 0) return this.finish();
    const prog = 1 - this.time / C.seconds;
    this.spawnT -= dt;
    if (this.spawnT <= 0) {
      this.spawnT = (C.spawnStart + (C.spawnEnd - C.spawnStart) * prog) * rand(0.7, 1.3);
      this.spawn(C.upStart + (C.upEnd - C.upStart) * prog);
    }
    for (const c of this.cells) {
      if (!c.kind) continue;
      c.t += dt;
      if (c.t >= c.dur) {
        if (c.kind === 'signal') { this.missed++; this.combo = 0; }
        c.kind = null;
      }
    }
    const d = input.joy;   // joystick moves the cursor, with key-repeat
    if (d) { this.joyT -= dt; if (this.joyT <= 0) { this.moveCursor(d); this.joyT = 0.18; } } else this.joyT = 0;
  }
  spawn(up) {
    const empty = this.cells.map((c, i) => (c.kind ? -1 : i)).filter((i) => i >= 0);
    if (!empty.length) return;
    const i = pick(empty), signal = Math.random() > CONFIG.minigames.whack.noiseChance, D = this.def;
    this.cells[i] = { kind: signal ? 'signal' : 'noise', label: pick(signal ? D.signals : D.noise), t: 0, dur: up, hit: 0, hitOk: false };
  }
  moveCursor(d) {
    let r = Math.floor(this.cursor / 3), c = this.cursor % 3;
    if (d === 'up') r = Math.max(0, r - 1); if (d === 'down') r = Math.min(2, r + 1);
    if (d === 'left') c = Math.max(0, c - 1); if (d === 'right') c = Math.min(2, c + 1);
    this.cursor = r * 3 + c;
  }
  whack(i) {
    if (this.state !== 'play') return;
    const C = CONFIG.minigames.whack, cell = this.cells[i];
    this.cursor = i;
    if (cell.kind === 'signal') {
      this.hits++; this.combo++; this.bestCombo = Math.max(this.bestCombo, this.combo);
      this.points += Math.round(C.signalPoints * (1 + Math.floor(this.combo / C.comboStep) * 0.5));
      cell.kind = null; cell.hit = 0.35; cell.hitOk = true;
      Sound.seq([NOTE.E5, NOTE.A5], 0.04, { vol: 0.16 });
    } else if (cell.kind === 'noise') {
      this.falses++; this.combo = 0; this.points = Math.max(0, this.points - C.noisePenalty);
      cell.kind = null; cell.hit = 0.35; cell.hitOk = false;
      Sound.tone(150, 0.15, { type: 'sawtooth', vol: 0.16 });
    } else Sound.tone(500, 0.03, { vol: 0.06 });
  }
  tap(x, y) {
    for (let i = 0; i < 9; i++) { const r = this.cellRect(i); if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return this.whack(i); }
  }
  finish() {
    const C = CONFIG.minigames.whack;
    this.reward = { sanity: Math.min(C.maxSanity, C.sanityBase + Math.floor(this.points / C.pointsPerSanity)),
      compliance: Math.min(C.maxCompliance, Math.floor(this.hits / C.hitsPerCompliance)) };
    const acc = this.hits / Math.max(1, this.hits + this.falses + this.missed);
    this.won = acc >= 0.6;
    this.resultLine = this.def.results[acc >= 0.8 ? 0 : acc >= 0.6 ? 1 : 2];
    this.state = 'result'; this.t = 0;
    this.won ? sfx.submit() : sfx.meh();
    UI.renderMinigame(this);
  }
  key(k) {
    const go = ['e', ' ', 'enter'].includes(k);
    if (this.state === 'result') { if (this.t > 0.4 && go) endMinigame(); return; }
    if (this.state === 'intro') { if (go) { this.state = 'play'; this.t = 0; } return; }
    if (k in NUMPAD) return this.whack(NUMPAD[k]);
    const dirs = { arrowup: 'up', w: 'up', arrowdown: 'down', s: 'down', arrowleft: 'left', a: 'left', arrowright: 'right', d: 'right' };
    if (dirs[k]) return this.moveCursor(dirs[k]);
    if (go) this.whack(this.cursor);
  }
  render(c) {
    const W = this.W, H = this.H, C = CONFIG.minigames.whack;
    c.fillStyle = '#0b1636'; c.fillRect(0, 0, W, H);
    c.fillStyle = '#e53935'; c.fillRect(0, 0, W, 22);
    drawPx(c, 'PV NEWS LIVE', 10, 7, 1, '#ffffff');
    drawPx(c, 'WHACK-A-SIGNAL', W / 2, 7, 1, '#ffd23f', 'center');
    drawPx(c, `${Math.max(0, Math.ceil(this.time))}S`, W - 10, 7, 1, '#ffffff', 'right');
    c.fillStyle = '#1b2a5c'; c.fillRect(0, H - 22, W, 22);
    drawPx(c, `SCORE ${this.points}`, 10, H - 15, 1, '#ffffff');
    drawPx(c, `COMBO ${this.combo}`, W / 2, H - 15, 1, this.combo >= C.comboStep ? '#ffd23f' : '#9fb0d8', 'center');
    drawPx(c, `HITS ${this.hits}  NOISE ${this.falses}`, W - 10, H - 15, 1, '#9fb0d8', 'right');
    const tb = Math.max(0, this.time / C.seconds);
    c.fillStyle = '#29e6ff'; c.fillRect(0, 22, W * tb, 3);
    for (let i = 0; i < 9; i++) {
      const r = this.cellRect(i), cell = this.cells[i];
      c.fillStyle = '#050a1c'; rr(c, r.x, r.y, r.w, r.h, 6); c.fill();
      c.strokeStyle = i === this.cursor ? '#ffd23f' : '#2e3f7a'; c.lineWidth = i === this.cursor ? 3 : 2; c.stroke();
      c.globalAlpha = 0.25; c.strokeStyle = '#29e6ff'; c.lineWidth = 1;
      c.beginPath(); c.moveTo(r.x + 6, r.y + r.h - 8); c.lineTo(r.x + r.w - 6, r.y + r.h - 8); c.stroke(); c.globalAlpha = 1;
      if (cell.kind) {
        const life = cell.t / cell.dur, pulse = 1 + 0.15 * Math.sin(V.t * 14);
        const col = cell.kind === 'signal' ? '#ff3b3b' : '#7d86a8';
        c.globalAlpha = life > 0.75 ? 1 - (life - 0.75) * 3 : 1;
        c.fillStyle = col; circle(c, r.x + r.w / 2, r.y + 20, 10 * (cell.kind === 'signal' ? pulse : 1)); c.fill(); ink(c, 2);
        if (cell.kind === 'signal') drawPx(c, '!', r.x + r.w / 2, r.y + 17, 1, '#ffffff', 'center');
        drawPx(c, cell.label, r.x + r.w / 2, r.y + r.h - 19, 1, cell.kind === 'signal' ? '#ffd0d0' : '#c0c6dc', 'center');
        c.globalAlpha = 1;
      }
      if (cell.hit > 0) {
        c.globalAlpha = cell.hit / 0.35;
        c.fillStyle = cell.hitOk ? '#39ff88' : '#ff3b3b'; rr(c, r.x, r.y, r.w, r.h, 6); c.fill();
        drawPx(c, cell.hitOk ? 'SIGNAL!' : 'NOISE!', r.x + r.w / 2, r.y + r.h / 2 - 6, 2, '#0b1636', 'center');
        c.globalAlpha = 1;
      }
    }
    if (this.state === 'intro') {
      c.fillStyle = 'rgba(5,10,28,.85)'; c.fillRect(0, 22, W, H - 44);
      drawPx(c, 'WHACK THE SIGNALS', W / 2, 90, 3, '#ff3b3b', 'center', '#000');
      drawPx(c, 'LEAVE THE NOISE', W / 2, 130, 3, '#9fb0d8', 'center', '#000');
      drawPx(c, 'GET READY...', W / 2, 180, 2, '#ffd23f', 'center');
    }
  }
}

/* =====================================================================
   BREAK-ROOM NOTICEBOARD: corporate emails, no repeats until all have been read
   ===================================================================== */
const MailBag = {
  seen: new Set(),
  load() { const d = Store.get(CONFIG.storageKeys.mail, null); this.seen = new Set(d && Array.isArray(d.seen) ? d.seen : []); },
  draw() {
    const all = CONTENT.mails;
    let pool = all.filter((m) => !this.seen.has(m.subject));
    if (!pool.length) { this.seen.clear(); pool = all.slice(); }
    const m = pick(pool);
    this.seen.add(m.subject);
    Store.set(CONFIG.storageKeys.mail, { seen: [...this.seen] });
    return m;
  },
};
MailBag.load();

/* =====================================================================
   LEADERBOARD: office-wide scores (Supabase REST), with an on-device fallback.
   The game never depends on it: offline or blocked, it shows this computer's scores.
   ===================================================================== */
const dedupeBy = (list, key) => { const seen = new Set(); return list.filter((r) => { const k = String(r[key]).toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; }); };
const newId = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
  : 'xxxxxxxx-xxxx-4xxx-8xxx-xxxxxxxxxxxx'.replace(/x/g, () => Math.floor(Math.random() * 16).toString(16));

const Board = {
  status: 'idle',        // idle | loading | online | offline
  remote: [],            // office top list (best score per player)
  lastPost: null,        // { name, score, state: posting | posted | failed | local }
  local: (() => {
    const l = Store.get(CONFIG.storageKeys.board, []);
    return Array.isArray(l) ? l.filter((e) => e && typeof e.score === 'number' && typeof e.name === 'string').slice(0, 50) : [];
  })(),
  name: String(Store.get(CONFIG.storageKeys.player, '') || ''),
  playerId: (() => {
    let id = Store.get(CONFIG.storageKeys.playerId, null);
    if (typeof id !== 'string' || !/^[0-9a-f-]{36}$/i.test(id)) { id = newId(); Store.set(CONFIG.storageKeys.playerId, id); }
    return id;
  })(),

  enabled() { const L = CONFIG.leaderboard; return !!(L.url && L.key && window.fetch); },
  cleanName(s) {
    return String(s || '').replace(/[\u0000-\u001f\u007f<>]/g, '').replace(/\s+/g, ' ').trim().slice(0, CONFIG.leaderboard.nameMax);
  },
  setName(n) { this.name = n; Store.set(CONFIG.storageKeys.player, n); },

  async request(path, opts = {}) {
    const L = CONFIG.leaderboard, ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), L.timeoutMs);
    try {
      const r = await fetch(`${L.url}/rest/v1/${path}`, {
        ...opts, signal: ctl.signal,
        headers: { apikey: L.key, Authorization: `Bearer ${L.key}`, ...(opts.headers || {}) },
      });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return r;
    } finally { clearTimeout(timer); }
  },
  async refresh() {
    if (SIM) return;
    if (!this.enabled()) { this.status = 'offline'; UI.refreshBoards(); return; }
    if (this.status !== 'online') { this.status = 'loading'; UI.refreshBoards(); }
    try {
      const L = CONFIG.leaderboard;
      const r = await this.request(`${L.table}?select=name,score,days,cases,player_id&order=score.desc,created_at.asc&limit=${L.fetchLimit}`);
      const rows = await r.json();
      this.remote = dedupeBy(Array.isArray(rows) ? rows : [], 'player_id').slice(0, L.size);
      this.status = 'online';
    } catch (e) { this.status = 'offline'; }
    UI.refreshBoards();
  },
  /** Record a finished game: always on this device, and on the office board when reachable. */
  async submit(entry) {
    if (SIM) return;
    this.local.push({ ...entry, at: Date.now() });
    this.local.sort((a, b) => b.score - a.score);
    this.local = dedupeBy(this.local, 'name').slice(0, 50);
    Store.set(CONFIG.storageKeys.board, this.local);
    this.lastPost = { ...entry, state: 'posting' };
    UI.refreshBoards();
    if (!this.enabled() || entry.score <= 0) { this.lastPost.state = 'local'; UI.refreshBoards(); return; }
    try {
      await this.request(CONFIG.leaderboard.table, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Prefer: 'return=minimal' },
        body: JSON.stringify({ player_id: this.playerId, name: entry.name, score: Math.round(entry.score),
          days: Math.round(entry.days * 100) / 100, cases: entry.cases }),
      });
      this.lastPost.state = 'posted';
    } catch (e) { this.lastPost.state = 'failed'; }
    await this.refresh();
  },
  /** Rows to show: the office board when online, otherwise this computer's. */
  rows() {
    const size = CONFIG.leaderboard.size;
    if (this.status === 'online') return this.remote.slice(0, size).map((r) => ({ ...r, me: r.player_id === this.playerId }));
    return this.local.slice(0, size).map((r) => ({ ...r, me: r.name.toLowerCase() === this.name.toLowerCase() }));
  },
};

/* =====================================================================
   UI: HUD, case queue, dialogue box, alerts, overlays
   ===================================================================== */
function fxHint(fx) {
  const out = [];
  for (const [k, v] of Object.entries(fx || {})) {
    if (!v) continue;
    if (k in CONFIG.stats) {
      const n = Math.abs(v) >= 12 ? 2 : 1;
      out.push(`<span class="${v > 0 ? 'up' : 'down'}">${(v > 0 ? '▲' : '▼').repeat(n)}${CONFIG.stats[k].short}</span>`);
    } else if (k === 'cases' || k === 'favor') out.push(`<span class="down">+${v} CASE</span>`);
    else if (k === 'serious') out.push(`<span class="down">+SERIOUS</span>`);
    else if (k === 'removeCase') out.push(`<span class="up">-${v} CASE</span>`);
    else if (k === 'dbDown') out.push(`<span class="down">DB ${v}s</span>`);
  }
  return out.join(' ');
}
function el(tag, cls, html) { const e = document.createElement(tag); e.className = cls; e.innerHTML = html; return e; }

const UI = {

  init() {
    const panel = $('#statsPanel');
    for (const k of STAT_KEYS) {
      const c = CONFIG.stats[k];
      const e = document.createElement('div');

      panel.insertBefore(e, $('#status'));
      this.stat[k] = { el: e, fill: e.querySelector('.fill'), val: e.querySelector('.stat-val'), warn: e.querySelector('.stat-warn'), last: -1, flashT: 0 };
    }
    $('#muteBtn').addEventListener('pointerdown', (e) => { e.preventDefault(); toggleMute(); });

    $('#eventBox').addEventListener('pointerdown', (e) => { if ($('#eventBox').classList.contains('mini') && e.target.id !== 'evMin') UI.setEventMini(false); });
    $('#mailRead').addEventListener('pointerdown', (e) => { e.preventDefault(); closeMail(false); });

    $('#mailClose').addEventListener('pointerdown', (e) => { e.preventDefault(); closeMail(false); });
    $('#pauseBtn').addEventListener('pointerdown', (e) => { e.preventDefault(); Sound.init(); S.mode === 'paused' ? resumeGame() : pauseGame(); });
    this.syncMute();
    if (window.matchMedia && matchMedia('(pointer: coarse)').matches) this.enableTouch();
  },
  enableTouch() { if (this.touch) return; this.touch = true; $('#joy').hidden = false; $('#actBtn').hidden = false; },
  syncMute() { $('#muteBtn').textContent = Sound.muted ? '🔇' : '🔊'; },
  bump(k, v) {
    if (SIM) return;
    const s = this.stat[k]; s.el.classList.remove('up', 'down'); s.el.classList.add(v > 0 ? 'up' : 'down'); s.flashT = 0.35;
  },

  sync(dt) {
    const C = CONFIG;
    for (const k of STAT_KEYS) {
      const s = this.stat[k], v = Math.ceil(S.stats[k]);
      if (v !== s.last) { s.fill.style.width = v + '%'; s.val.textContent = v; s.last = v; }
      const jitter = k === 'caffeine' && S.stats.caffeine > C.jitter.threshold;
      s.el.classList.toggle('danger', S.mode !== 'title' && (S.stats[k] < C.stats[k].danger || jitter));
      s.warn.textContent = jitter ? 'JITTERY!' : 'LOW!';
      if (s.flashT > 0) { s.flashT -= dt; if (s.flashT <= 0) s.el.classList.remove('up', 'down'); }
    }
    // status line
    let txt = '', cls = '';

    else if (S.stats.caffeine > C.jitter.threshold) { txt = '☕ JITTERY: SANITY DRAINING'; cls = 'warn'; }
    else if (S.time < S.dbDownUntil) { txt = `💾 DATABASE DOWN ${Math.ceil(S.dbDownUntil - S.time)}s`; cls = 'warn'; }
    else if (playerZone() === 'break') { txt = S.breakT > C.breakArea.maxSeconds * 0.7 ? '🛋 BREAK: PAT IS WATCHING...' : '🛋 BREAK: +SANITY'; cls = S.breakT > C.breakArea.maxSeconds * 0.7 ? 'warn' : 'good'; }
    else if (inRegenZone()) { txt = '⚡ IN THE ZONE: +NRG REGEN'; cls = 'good'; }
    else if (S.stats.caffeine < C.energyRegen.caffeineMin) txt = '☕ LOW CAFFEINE: NO REGEN';
    const st = $('#status');
    if (st.textContent !== txt) st.textContent = txt;
    st.className = cls;
    // info bar
    const spd = C.secondsPerDay, frac = S.mode === 'title' ? 0 : (S.time % spd) / spd;
    const mins = Math.floor((C.clock.startHour * 60 + frac * (C.clock.endHour - C.clock.startHour) * 60) / 5) * 5;
    $('#dayLabel').textContent = `DAY ${S.day}`;

    $('#scoreLabel').textContent = `${S.score} PTS`;

    this.syncCases();

      $('#evTime').textContent = Math.max(0, S.event.timeLeft).toFixed(1);

  syncCases() {
    const list = $('#caseList');

    if (this.casesVersion !== S.casesVersion) {
      this.casesVersion = S.casesVersion;
      list.innerHTML = ''; this.caseEls.clear();
      const sorted = [...S.cases].sort((a, b) => (a.late - b.late) || (a.deadline - b.deadline));
      if (!sorted.length) list.appendChild(el('div', 'empty', 'Inbox zero. Enjoy it while it lasts.'));
      for (const c of sorted) {
        const e = el('div', 'case' + (c.serious ? ' serious' : ''), `
          <div class="c1"><span class="cid">${c.code}</span><span class="tag">${c.serious ? '7-DAY' : '15-DAY'}</span><span class="dl"></span></div>
          <div class="c2"></div>
          <div class="c3"><div class="pips">${STEPS.map((s, i) => `<div class="pip ${i < c.step ? 'done' : i === c.step ? 'cur' : ''}" title="${s.label}"></div>`).join('')}</div><div class="dbar"><div></div></div></div>`);
        e.querySelector('.c2').textContent = `${c.source}: ${c.title}`;
        e.addEventListener('pointerdown', (ev) => { ev.stopPropagation(); S.activeId = c.id; S.casesVersion++; sfx.blip(); });

      r.dl.textContent = c.late ? 'LATE!' : `D-${Math.ceil(frac * (c.serious ? 7 : 15))}`;
      r.bar.style.width = (c.late ? 100 : frac * 100) + '%';
      r.e.classList.toggle('late', c.late);

  syncWorkBar() {

  renderTrivia(g) {

      b.innerHTML = `<span class="k">${q.type === 'tf' ? (i ? 'F' : 'T') : i + 1}</span><span class="t"></span>`;
      b.querySelector('.t').textContent = o.text;

    wrap.append(qt, opts, el('div', 'q-timer', '<div id="qBar"></div>'));

  renderMinigame(g) {

        el('div', 'mg-line', ''), el('div', 'mg-reward', 'REWARD: ' + fxHint(g.reward)),

      body.querySelector('.mg-line').textContent = g.resultLine;
      info.textContent = g.kind === 'pong' ? `${g.score[0]} - ${g.score[1]}` : `${g.points} PTS · ${g.hits} SIGNALS · ${g.falses} FALSE ALARMS`;
      foot.textContent = '';

    }
    if (g.kind === 'pong') {
      info.textContent = opp ? 'VS ' + opp : '';

        const cvs = $('#mgCanvas');
        const setY = (e) => { const r = cvs.getBoundingClientRect(); if (MG.active && MG.active.kind === 'pong') MG.active.pointerY = (e.clientY - r.top) / r.height * MG.active.H; };
        cvs.addEventListener('pointerdown', (e) => { e.preventDefault(); cvs.setPointerCapture(e.pointerId); setY(e); });
        cvs.addEventListener('pointermove', (e) => { if (e.buttons || e.pointerType === 'mouse') setY(e); });
        cvs.addEventListener('pointerleave', () => { if (MG.active) MG.active.pointerY = null; });
      }
      return;
    }
    if (g.kind === 'whack') {
      info.textContent = 'PV NEWS LIVE';
      foot.textContent = UI.touch ? 'Tap the red signals · leave the grey noise · ESC to quit' : 'Click the red signals · 1-9 (numpad layout) or ARROWS + E · ESC to quit';

        });
      }
    }
