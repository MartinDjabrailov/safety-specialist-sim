      portrait,
      this.startButton('PRESS START', () => resumeGame()),
      el('div', 'ov-help', '<b>P / SPACE</b> resume · <b>M</b> mute'),
    ]);
  },
  showGameOver() {
    const d = CONTENT.deaths[S.deathCause] || CONTENT.deaths.energy;
    const long = d.title.length > 18;
    const days = S.time / CONFIG.secondsPerDay;
    this.overlay('gameover', [
      S.deathCause === 'clockout' ? pxCanvas('SHIFT OVER', 3, '#39ff88', '#0b3a22', 'glow-cyan') : pxCanvas('GAME OVER', 3, '#ff3b3b', '#4a0010', 'glow-red'),
      pxCanvas(wrapWords(d.title, long ? 18 : 14), long ? 4 : 6, d.color, '#000', 'glow-' + d.glow),
      portrait,
      el('div', 'ov-text', d.text),
      el('div', 'ov-score', `SURVIVED ${(Math.floor(days * 10) / 10).toFixed(1)} WORKING DAYS · ${S.onTime} CASE${S.onTime === 1 ? '' : 'S'} ON TIME<br>SCORE ${S.score}`),
      S.newHi ? el('div', 'ov-new', '★ NEW PERSONAL BEST! ★') : el('div', 'ov-hi', `YOUR BEST ${S.hi.score}`),
      this.startButton('PRESS START', () => { if (canRestart()) this.showNameEntry(); }),
      this.boardSlot(CONFIG.leaderboard.size, true),
    ]);
    if (S.newHi) sfx.hiscore();
  },
};
function chooseAny(i) {
  if (S.mode === 'dialog') chooseDialog(i);
  else if (S.mode === 'scene') chooseScene(i);
  else if (S.event) resolveEvent(i);
}
function toggleMute() { Sound.init(); Sound.setMuted(!Sound.muted); UI.syncMute(); }

/* =====================================================================
   INPUT: keyboard, mouse/touch tap-to-move, on-screen joystick
   ===================================================================== */
const KEY_DIR = { arrowup: 'up', w: 'up', arrowdown: 'down', s: 'down', arrowleft: 'left', a: 'left', arrowright: 'right', d: 'right' };
document.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (e.target && e.target.tagName === 'INPUT') {          // typing a name: let every key through
    if (k === 'enter') { e.preventDefault(); UI.submitName(); }
    else if (k === 'escape') { e.preventDefault(); S.mode === 'gameover' ? UI.showGameOver() : UI.showTitle(); }
    return;
  }
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k)) e.preventDefault();
  if (S.mode === 'title' || S.mode === 'gameover') {
    if ((k === ' ' || k === 'enter') && !e.repeat) {
      if (UI.nameEntryOpen) UI.submitName();
      else if (S.mode === 'title' || canRestart()) UI.showNameEntry();
    }
    if (k === 'm') toggleMute();
    return;
  }
  if (S.mode === 'paused' && $('#overlay').dataset.kind === 'clockout') {
    if (k === 'enter' && !e.repeat) clockOut();
    else if ([' ', 'escape', 'p'].includes(k) && !e.repeat) resumeGame();
    return;
  }
  if (S.mode === 'paused') { if ([' ', 'enter', 'p', 'escape'].includes(k) && !e.repeat) resumeGame(); else if (k === 'm') toggleMute(); return; }
  if (S.mode === 'mail') {
    if (k === '2') closeMail(true);
    else if (['1', 'e', ' ', 'enter', 'escape'].includes(k) && !e.repeat) closeMail(false);
    return;
  }
  if (k === 'o' && S.mode === 'playing') return UI.showClockOut();
  if (S.mode === 'minigame') {
    if (k === 'escape') return endMinigame(true);
    if (k === 'p') return pauseGame();
    if (k === 'm') return toggleMute();
    const dm = KEY_DIR[k]; if (dm && !input.keys.includes(dm)) input.keys.push(dm);
    if (MG.active && !e.repeat) MG.active.key(k);
    return;
  }
  if (k === 'p' || k === 'escape') return pauseGame();
  if (k === 'm') return toggleMute();
  if (['1', '2', '3', '4', '5'].includes(k)) return chooseAny(Number(k) - 1);
  if (k === 'e' || k === ' ' || k === 'enter') {
    if (UI.tw && UI.tw.n < UI.tw.full.length) { UI.tw.n = UI.tw.full.length; return; }
    if (!e.repeat && S.mode === 'playing') input.actionPressed = true;
    input.actionHeld = true;
    return;
  }
  const d = KEY_DIR[k];
  if (d && !input.keys.includes(d)) { input.keys.push(d); input.tap = d; }
});
document.addEventListener('keyup', (e) => {
  const k = e.key.toLowerCase();
  if (k === 'e' || k === ' ' || k === 'enter') input.actionHeld = false;
  const d = KEY_DIR[k];
  if (d) input.keys = input.keys.filter((x) => x !== d);
});
window.addEventListener('blur', () => { input.keys = []; input.actionHeld = false; input.touchHeld = false; input.mouseWork = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
document.addEventListener('contextmenu', (e) => e.preventDefault());

// click / tap to move (and to use things)
cv.addEventListener('pointerdown', (e) => {
  Sound.init();
  if (e.pointerType === 'touch') { UI.enableTouch(); return; }   // phones: joystick + action button only, no tap-to-move
  if (S.mode !== 'playing') return;
  const w = toWorld(e.clientX, e.clientY);
  const tx = Math.floor(w.x / T), ty = Math.floor(w.y / T);
  V.clickMark = { x: (tx + 0.5) * T, y: (ty + 0.5) * T, until: V.t + 0.5 };
  const P = PLAYER;
  // a person? (their body covers the tile they stand on and the one above)
  const n = NPCS.find((q) => q.tx === tx && (q.ty === ty || q.ty === ty + 1));
  if (n) {
    if (adjacentTo(P, n.tx, n.ty)) { P.dir = dirTo(P, n.tx, n.ty); interact({ kind: 'npc', npc: n }); return; }
    pathNextTo(P, n.tx, n.ty); P.onArrive = () => { if (adjacentTo(P, n.tx, n.ty)) { P.dir = dirTo(P, n.tx, n.ty); interact({ kind: 'npc', npc: n }); } };
    return;
  }
  const o = objAt(tx, ty);
  if (o && INTERACT_TYPES.has(o.type)) {
    if (o.type === 'M') input.mouseWork = true;         // keep holding to work
    if (adjacentTo(P, o.x, o.y, o.w, o.h)) { faceRect(P, o.x, o.y, o.w, o.h); if (o.type !== 'M') interact({ kind: 'obj', obj: o }); return; }
    if (o.type === 'M' && !occupied(22, 9, P)) pathTo(P, 22, 9); else pathNextTo(P, o.x, o.y, o.w, o.h);
    P.onArrive = () => { faceRect(P, o.x, o.y, o.w, o.h); if (o.type !== 'M' && adjacentTo(P, o.x, o.y, o.w, o.h)) interact({ kind: 'obj', obj: o }); };
    return;
  }
  if (walkable(tx, ty)) { pathTo(P, tx, ty); P.onArrive = null; }
});
window.addEventListener('pointerup', () => { input.mouseWork = false; });

// on-screen joystick + action button (phones)
(() => {
  const joy = $('#joy'), knob = $('#knob'), btn = $('#actBtn');
  let id = null;
  const move = (e) => {
    const r = joy.getBoundingClientRect();
    const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const len = Math.hypot(dx, dy), max = r.width / 2 - 20, k = len > max ? max / len : 1;
    knob.style.transform = `translate(${dx * k}px,${dy * k}px)`;
    input.joyVec = { x: clamp(dx / max, -1, 1), y: clamp(dy / max, -1, 1) };   // analogue, used by table tennis
    if (len < 14) { input.joy = null; return; }
    // hysteresis: near the diagonal keep the current axis, so the direction doesn't flicker
    const ax = Math.abs(dx), ay = Math.abs(dy);
    const horiz = input.joy === 'left' || input.joy === 'right' ? ay < ax * 1.35 : input.joy ? ax > ay * 1.35 : ax > ay;
    input.joy = horiz ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
  };
  const end = () => { id = null; input.joy = null; input.joyVec = null; knob.style.transform = ''; };
  joy.addEventListener('pointerdown', (e) => { e.preventDefault(); Sound.init(); id = e.pointerId; try { joy.setPointerCapture(id); } catch (err) { /* capture is optional */ } move(e); });
  joy.addEventListener('pointermove', (e) => { if (e.pointerId === id) move(e); });
  joy.addEventListener('pointerup', end); joy.addEventListener('pointercancel', end);
  btn.addEventListener('pointerdown', (e) => {
    e.preventDefault(); Sound.init(); btn.classList.add('held');
    if (S.mode === 'title' || S.mode === 'gameover') {
      if (UI.nameEntryOpen) return UI.submitName();
      if (S.mode === 'title' || canRestart()) UI.showNameEntry();
      return;
    }
    if (S.mode === 'paused') return resumeGame();
    if (S.mode === 'minigame') { if (MG.active) MG.active.key('e'); return; }
    if (S.mode === 'mail') return closeMail(false);
    if (UI.tw && UI.tw.n < UI.tw.full.length) { UI.tw.n = UI.tw.full.length; return; }
    if (S.mode === 'playing') { input.actionPressed = true; input.touchHeld = true; }
  });
  const up = () => { btn.classList.remove('held'); input.touchHeld = false; };
  btn.addEventListener('pointerup', up); btn.addEventListener('pointercancel', up); btn.addEventListener('pointerleave', up);
})();
window.addEventListener('resize', resizeView);

/* =====================================================================
   MAIN LOOP
   ===================================================================== */
let lastFrame = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - lastFrame) / 1000);
  lastFrame = now;
  if (S.mode === 'playing') update(dt);
  else if (S.mode === 'title') for (const n of NPCS) updateNPC(n, dt);   // office stays alive behind the title
  else if (S.mode === 'minigame' && MG.active) {
    MG.active.update(dt);
    const mc = $('#mgCanvas');
    if (MG.active && (MG.active.kind === 'pong' || MG.active.kind === 'whack') && mc) { const x = mc.getContext('2d'); x.setTransform(2, 0, 0, 2, 0, 0); x.lineJoin = 'round'; x.lineCap = 'round'; MG.active.render(x); }
  }
  updateVisuals(dt);
  updateCamera(dt, false);
  render();
  if (!$('#overlay').hidden) renderPortrait();
  UI.sync(dt);
  requestAnimationFrame(frame);
}

/* Test/balance hooks (harmless in normal play) */
window.DSS = {
  CONFIG, CONTENT, S, V, P: PLAYER, NPCS, OBJECTS, GRID, MY_DESK, walkable, bfs,
  start: startGame, gameOver, Board, clockOut, openMail, closeMail, MailBag, TriviaBag, quizBag, prepareTrivia, startTrivia, startWhack, WhackGame, spawnEvent, spawnCase, queueScold, chooseAny, MG, startMinigame, endMinigame,
  api: {
    goToTile(tx, ty) { const P = PLAYER; if (P.tx === tx && P.ty === ty && !P.moving) return true; if (!P.path.length && !P.moving) pathTo(P, tx, ty); return false; },
    goToObj(type) {
      const P = PLAYER;
      const o = OBJECTS.filter((x) => x.type === type).sort((a, b) => (Math.abs(a.x - P.tx) + Math.abs(a.y - P.ty)) - (Math.abs(b.x - P.tx) + Math.abs(b.y - P.ty)))[0];
      if (adjacentTo(P, o.x, o.y, o.w, o.h) && !P.moving) { faceRect(P, o.x, o.y, o.w, o.h); return true; }
      if (!P.path.length && !P.moving) pathNextTo(P, o.x, o.y, o.w, o.h);
      return false;
    },
    goToNpc(n) {
      const P = PLAYER;
      if (adjacentTo(P, n.tx, n.ty) && !P.moving) { P.dir = dirTo(P, n.tx, n.ty); return true; }
      if (!P.moving) pathNextTo(P, n.tx, n.ty);
      return false;
    },
    press() { input.actionPressed = true; },
    hold(b) { input.simHold = b; },
    target: () => currentTarget(),
    vendReady: () => S.time >= S.vendReadyAt,
    toiletReady: () => S.time >= S.toiletReadyAt,
    coffeeReady() { const P = PLAYER; const o = OBJECTS.filter((x) => x.type === 'C').sort((a, b) => (Math.abs(a.x - P.tx) + Math.abs(a.y - P.ty)) - (Math.abs(b.x - P.tx) + Math.abs(b.y - P.ty)))[0]; return S.time >= (S.coffeeReady[o.id] || 0); },
    zone: () => playerZone(),
    activeCase: () => activeCase(),
  },
  /* Run a whole game headlessly: policy(api, S) is called every tick */
  simulate(policy, maxSeconds = 1800, dt = 1 / 30) {
    SIM = true;
    resetGame(); S.mode = 'playing';
    let stuck = 0;
    while (S.mode !== 'gameover' && S.time < maxSeconds) {
      policy(DSS.api, S);
      if (S.mode === 'playing') { update(dt); stuck = 0; }
      else if (++stuck > 300) chooseAny(0);
    }
    const res = { seconds: +S.time.toFixed(1), days: +(S.time / CONFIG.secondsPerDay).toFixed(2), cause: S.mode === 'gameover' ? S.deathCause : 'timeout', onTime: S.onTime, late: S.lateCount, score: computeScore() };
    SIM = false; input.simHold = false;
    resetGame(); S.mode = 'title'; UI.showTitle();
    return res;
  },
};

resetGame();
UI.init();
UI.showTitle();
Board.refresh();
resizeView();
requestAnimationFrame(frame);
</script>
</body>
