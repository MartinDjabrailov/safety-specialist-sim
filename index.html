<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#07060f">
<title>Drug Safety Simulator</title>
<style>
/* =====================================================================
   STYLES
   ===================================================================== */
:root{
  --bg:#07060f; --panel:rgba(16,13,40,.9); --ink:#ece9ff; --dim:#8f89c2;
  --cyan:#29e6ff; --pink:#ff3fb4; --yellow:#ffd23f; --green:#39ff88; --red:#ff3b3b;
  --mono:"Cascadia Mono","Consolas","Lucida Console","Courier New",ui-monospace,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
body{
  color:var(--ink);font-family:var(--mono);font-weight:700;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;
}
button{font:inherit;color:inherit}
#world{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:pointer}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#hud .panel,#hud button{pointer-events:auto}
.panel{background:var(--panel);border:2px solid #3a2f7a;border-radius:10px;box-shadow:0 0 14px #6a3cff44,inset 0 0 14px #000}
#hudTop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:10px 12px}
#statsPanel{width:250px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.stat-head{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:12px;letter-spacing:1px;margin-bottom:3px}
.stat-name{color:var(--c);text-shadow:0 0 8px var(--c);white-space:nowrap}
.stat-warn{flex:1;text-align:right;color:var(--red);font-size:10px;visibility:hidden}
.stat-val{min-width:3ch;text-align:right}
.bar{position:relative;height:16px;border:2px solid #05040c;outline:2px solid var(--c);border-radius:5px;background:#0a0818;overflow:hidden}
.fill{position:absolute;left:0;top:0;bottom:0;width:50%;background:var(--c);box-shadow:0 0 12px var(--c);transition:width .12s linear}
.zone{position:absolute;top:0;bottom:0}
.zone.low{left:0;background:repeating-linear-gradient(45deg,#ff3b3b55 0 4px,transparent 4px 8px)}
.zone.high{right:0;background:repeating-linear-gradient(-45deg,#ff3b3b55 0 4px,transparent 4px 8px)}
.segs{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),#05040c calc(10% - 2px) 10%)}
.stat.danger .bar{animation:dangerBar .5s steps(1) infinite}
.stat.danger .stat-name{animation:dangerTxt .5s steps(1) infinite}
.stat.danger .stat-warn{visibility:visible;animation:blink .5s steps(1) infinite}
.stat.up .bar{box-shadow:0 0 14px var(--c)}
.stat.down .bar{box-shadow:0 0 14px var(--red)}
@keyframes dangerBar{50%{outline-color:var(--red);background:#3a0a14}}
@keyframes dangerTxt{50%{color:var(--red);text-shadow:0 0 8px var(--red)}}
#status{font-size:11px;letter-spacing:1px;min-height:1.2em;color:var(--dim)}
#status.good{color:var(--green)} #status.warn{color:#ff9d2e} #status.bad{color:var(--red);animation:blink .4s steps(1) infinite}

#midCol{display:flex;flex-direction:column;align-items:center;gap:8px}
#infoPanel{padding:6px 14px;font-size:15px;letter-spacing:1px;white-space:nowrap}
#dayLabel{color:var(--yellow);text-shadow:0 0 8px #ffd23f88}
#clock{color:var(--cyan);margin:0 10px;text-shadow:0 0 8px #29e6ff88}
#scoreLabel{color:var(--pink)}
#playerLabel{color:var(--dim);margin-left:10px;font-size:12px}
/* leaderboard */
.lb-slot{width:100%;max-width:460px;border:2px solid #3a2f7a;border-radius:10px;background:rgba(10,8,28,.85);padding:8px 10px}
.lb-head{font-size:12px;letter-spacing:2px;color:var(--cyan);margin-bottom:6px;text-align:left}
.lb-head.offline{color:#ff9d2e}
.lb-table{width:100%;border-collapse:collapse;font-size:13px}
.lb-table td{padding:3px 4px;text-align:right;white-space:nowrap}
.lb-table td.n{text-align:left;overflow:hidden;text-overflow:ellipsis;max-width:170px}
.lb-table td.r{color:var(--dim);width:2.5em;text-align:left}
.lb-table tr.top1 td.r{color:var(--yellow)}
.lb-table tr.me td{color:var(--green);text-shadow:0 0 8px #39ff8866}
.lb-table th{font-size:10px;color:var(--dim);font-weight:700;text-align:right;padding:0 4px 3px}
.lb-table th:nth-child(2){text-align:left}
.lb-empty,.lb-post{font-size:12px;color:var(--dim);padding:4px 0;text-align:left}
.lb-post.posted{color:var(--green)} .lb-post.failed{color:#ff9d2e}
.name-row{display:flex;gap:10px;width:100%;max-width:460px}
#nameInput{flex:1;min-width:0;font:inherit;font-size:20px;padding:10px 12px;border-radius:10px;border:3px solid var(--cyan);background:#0a0818;color:var(--ink);outline:none;box-shadow:0 0 14px #29e6ff55;user-select:text;-webkit-user-select:text}
#nameInput:focus{border-color:var(--yellow);box-shadow:0 0 18px #ffd23f66}
.name-err{color:var(--red);font-size:13px;min-height:1.2em}
.go-btn{font:inherit;font-size:16px;letter-spacing:2px;padding:10px 16px;border-radius:10px;border:3px solid var(--yellow);background:#2a1a08;color:var(--yellow);cursor:pointer;box-shadow:0 4px 0 #000}
.go-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
#topBtns{display:flex;gap:8px}
.tb-btn{width:38px;height:32px;border-radius:8px;border:2px solid #4b3fa0;background:#1b1840;cursor:pointer;box-shadow:0 3px 0 #000;font-size:15px;line-height:1;padding:0}
.tb-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #000}

#casePanel{width:290px;padding:8px 10px;max-height:calc(100vh - 150px);overflow:hidden}
.ph{display:flex;justify-content:space-between;font-size:13px;color:var(--cyan);letter-spacing:1px;margin-bottom:6px}
#caseList{display:flex;flex-direction:column;gap:6px}
.case{border:2px solid #3a2f7a;border-radius:8px;padding:5px 7px;background:#120f2c;cursor:pointer;font-size:11px}
.case.active{border-color:var(--yellow);box-shadow:0 0 10px #ffd23f66}
.case .tag{background:#2e3a7a;border-radius:4px;padding:0 4px;font-size:10px}
.case.serious .tag{background:var(--red);color:#fff}
.case.late{border-color:var(--red);animation:lateBlink .6s steps(1) infinite}
@keyframes lateBlink{50%{background:#3a0a14}}
.c1{display:flex;gap:6px;align-items:center}
.c1 .dl{margin-left:auto}
.c2{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:2px 0}
.c3{display:flex;gap:6px;align-items:center}
.pips{display:flex;gap:2px}
.pip{width:9px;height:7px;border:1px solid #6a6fb0;border-radius:2px}
.pip.done{background:var(--green);border-color:var(--green)}
.pip.cur{background:var(--yellow);border-color:var(--yellow)}
.dbar{flex:1;height:6px;background:#2a2550;border-radius:3px;overflow:hidden}
.dbar>div{height:100%;background:var(--cyan)}
.case.urgent .dbar>div{background:var(--red)}
.empty{font-size:11px;color:var(--dim);padding:4px 2px}

#workBar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);min-width:290px;padding:8px 12px;text-align:center;font-size:13px;letter-spacing:1px}
.wb-bar{height:12px;margin-top:6px;border:2px solid #000;outline:2px solid var(--yellow);border-radius:4px;background:#1a1636;overflow:hidden}
.wb-bar>div{height:100%;width:0;background:linear-gradient(90deg,var(--yellow),var(--green))}

/* ---------- dialogue / scold scenes ---------- */
#dialog{
  position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:12;width:min(96vw,660px);
  display:flex;gap:12px;padding:12px;background:#110d2b;border:4px solid var(--cyan);border-radius:14px;
  box-shadow:0 0 0 4px #000,0 0 30px #29e6ff66;animation:popIn .2s ease-out;
}
#dialog.scold{border-color:var(--red);box-shadow:0 0 0 4px #000,0 0 34px #ff3b3b99;background:#1a0712}
#dialog.director{border-color:var(--yellow);box-shadow:0 0 0 4px #000,0 0 44px #ffd23faa;background:#1a1204}
#dlgPortrait{width:96px;height:96px;flex:none;border-radius:10px;background:#1f1a44;border:2px solid #3a2f7a}
.dlg-body{flex:1;min-width:0}
#dlgName{font-size:14px;letter-spacing:2px;color:var(--cyan)}
.scold #dlgName{color:var(--red)} .director #dlgName{color:var(--yellow)}
#dlgText{font-size:16px;line-height:1.35;margin:6px 0 10px;min-height:2.7em}
#dlgChoices,#evChoices{display:flex;flex-direction:column;gap:6px}
.choice{
  display:flex;align-items:center;gap:10px;text-align:left;cursor:pointer;padding:7px 10px;border-radius:10px;
  border:3px solid var(--yellow);background:#2a1a08;box-shadow:0 4px 0 #000;font-size:14px;line-height:1.2;
}
.choice:active,.choice.pressed{transform:translateY(3px);box-shadow:0 1px 0 #000}
.choice .k{flex:none;width:24px;height:24px;border-radius:6px;background:var(--yellow);color:#140f2e;display:flex;align-items:center;justify-content:center}
.choice .t{flex:1}
.choice .h{font-size:11px;white-space:nowrap}
.up{color:var(--green)} .down{color:#ff6b6b}
@keyframes popIn{from{transform:translateX(-50%) scale(.6);opacity:0}}

/* ---------- event alert ---------- */
#eventBox{
  position:fixed;left:50%;top:92px;transform:translateX(-50%);z-index:10;width:min(94vw,460px);
  background:#16040f;border:4px solid var(--red);border-radius:14px;padding:12px 14px 14px;
  box-shadow:0 0 0 4px #000,0 0 34px #ff3b3b99;animation:popIn .25s ease-out;pointer-events:auto;
}
#eventBox.meeting{border-color:var(--pink);box-shadow:0 0 0 4px #000,0 0 34px #ff3fb499}
.ev-head{display:flex;justify-content:space-between;align-items:center;font-size:14px;letter-spacing:2px}
.ev-head .tag{color:var(--yellow);animation:alertTag .4s steps(1) infinite}
#evTime{color:var(--red);font-size:18px}
#evTitle{font-size:16px;line-height:1.35;margin:8px 0;text-transform:uppercase;text-shadow:0 0 10px #ff3b3b88}
.ev-timer{height:10px;border:2px solid #000;outline:2px solid var(--red);border-radius:4px;background:#2a0710;overflow:hidden;margin-bottom:10px}
#evBar{height:100%;width:100%;background:linear-gradient(90deg,var(--red),var(--yellow))}
#evIgnore{margin-top:8px;font-size:11px;color:var(--dim);text-align:right}
.ev-right{display:flex;align-items:center;gap:8px}
#evMin{width:28px;height:26px;border-radius:6px;border:2px solid #6a2030;background:#2a0710;color:var(--ink);cursor:pointer;font-size:14px;line-height:1;padding:0}
/* minimised alert: a small pill that doesn't hide the office; tap to open */
#eventBox.mini{width:auto;max-width:min(94vw,460px);padding:6px 10px;cursor:pointer}
#eventBox.mini .ev-head .tag{font-size:12px}
#eventBox.mini #evChoices,#eventBox.mini #evIgnore{display:none}
#eventBox.mini #evTitle{font-size:12px;margin:4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#eventBox.mini{width:min(94vw,420px)}
.ev-head .tag{white-space:nowrap}
#eventBox.mini .ev-timer{height:6px;margin-bottom:0}
#eventBox.mini #evMin{transform:rotate(180deg)}
/* corporate email pop-up */
#mail{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:13;width:min(94vw,560px);max-height:90vh;overflow:auto;
  background:#f5f7fb;color:#1b2033;border:4px solid #29e6ff;border-radius:12px;box-shadow:0 0 0 4px #000,0 0 30px #29e6ff66;
  font-family:"Segoe UI",Arial,sans-serif;font-weight:400;animation:popIn2 .2s ease-out}
.mail-bar{display:flex;justify-content:space-between;align-items:center;background:#2b59c3;color:#fff;padding:8px 12px;font-family:var(--mono);font-weight:700;letter-spacing:1px;font-size:13px}
#mailClose{background:none;border:0;color:#fff;font-size:18px;cursor:pointer;padding:0 4px}
.mail-meta{padding:10px 14px;border-bottom:1px solid #d5dbea;font-size:13px;line-height:1.6}
.mail-meta b{color:#5a6280;font-weight:600;display:inline-block;min-width:62px}
#mailSubject{font-weight:700}
#mailBody{padding:14px;font-size:15px;line-height:1.5;white-space:pre-wrap}
.mail-actions{display:flex;gap:8px;padding:0 14px 14px;font-family:var(--mono);font-weight:700;color:var(--ink)}
.mail-actions .choice{flex:1;justify-content:center}
@keyframes alertTag{50%{color:var(--red)}}

/* ---------- mini-games ---------- */
#mg{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:14;width:min(96vw,680px);max-height:94vh;overflow:auto;
  background:#0f0b26;border:4px solid var(--pink);border-radius:16px;padding:12px 14px;
  box-shadow:0 0 0 4px #000,0 0 40px #ff3fb488;animation:popIn2 .25s ease-out;
}
@keyframes popIn2{from{transform:translate(-50%,-50%) scale(.6);opacity:0}}
.mg-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
#mgTitle{font-size:20px;letter-spacing:3px;color:var(--pink);text-shadow:0 0 10px #ff3fb4aa}
#mgInfo{font-size:13px;color:var(--yellow);letter-spacing:1px}
#mgBody{display:flex;flex-direction:column;align-items:center;gap:10px;min-height:200px;justify-content:center;text-align:center}
#mgFoot{margin-top:10px;font-size:11px;color:var(--dim);text-align:center;letter-spacing:1px}
#mgCanvas{width:100%;height:auto;border-radius:8px;border:3px solid #000;touch-action:none;cursor:ns-resize}
.mg-intro{font-size:18px;line-height:1.4;max-width:480px}
.mg-ready{color:var(--yellow);font-size:16px;letter-spacing:3px}
.mg-line{font-size:15px;line-height:1.4;max-width:520px}
.mg-reward{font-size:14px;letter-spacing:1px}
.q-prompt{font-size:12px;color:var(--cyan);letter-spacing:2px}
.q-text{font-size:18px;line-height:1.35;max-width:560px;min-height:2.6em}
.q-opts{display:flex;flex-direction:column;gap:8px;width:100%;max-width:520px}
.q-opts.two{flex-direction:row}
.q-opts.two .choice{flex:1;justify-content:center}
.choice.right{border-color:var(--green);background:#0b3a22;box-shadow:0 0 16px #39ff8888}
.choice.wrong{border-color:var(--red);background:#3a0a14}
.q-timer{width:100%;max-width:520px;height:10px;border:2px solid #000;outline:2px solid var(--pink);border-radius:4px;background:#2a0720;overflow:hidden}
#qBar{height:100%;width:100%;background:linear-gradient(90deg,var(--pink),var(--yellow))}
.q-feedback{font-size:18px;letter-spacing:3px}

/* ---------- PV trivia ---------- */
.tv-wrap{position:relative;width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
.tv-top{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:580px;gap:8px;flex-wrap:wrap}
.tv-chip{font-size:11px;letter-spacing:1px;padding:3px 8px;border-radius:6px;background:#2e3a7a;color:var(--cyan)}
.tv-stars{color:var(--yellow);margin-left:8px;letter-spacing:1px}
.tv-type{font-size:11px;color:var(--pink);margin-left:8px;letter-spacing:1px}
.tv-streak{font-size:13px;color:var(--yellow);letter-spacing:1px}
.tv-streak.hot{color:#ff9d2e;text-shadow:0 0 10px #ff9d2e88}
.tv-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:580px}
.tv-opts .choice{font-size:13px}
.tv-opts.two .choice{justify-content:center;font-size:18px;padding:12px}
.tv-banner{position:absolute;left:50%;top:13%;transform:translate(-50%,-50%);pointer-events:none;text-align:center;
  background:rgba(8,6,22,.9);padding:10px 20px;border-radius:14px;border:3px solid var(--green);box-shadow:0 0 30px #39ff8866;animation:tvBanner .45s ease-out}
.tv-banner.bad{border-color:var(--red);box-shadow:0 0 30px #ff3b3b66;animation:tvBanner .45s ease-out,shakeS .3s linear .1s}
@keyframes tvBanner{0%{transform:translate(-50%,-50%) scale(.3) rotate(-8deg);opacity:0}60%{transform:translate(-50%,-50%) scale(1.12)}100%{transform:translate(-50%,-50%) scale(1)}}
.tv-gain{font-size:16px;color:var(--green);margin-top:4px;letter-spacing:1px}
.tv-bonus{color:var(--pink);font-size:15px;letter-spacing:2px;margin-top:4px;animation:blink .25s steps(1) 6}
.tv-why{width:100%;max-width:580px;border:2px dashed #3a2f7a;border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.4;text-align:left;background:#141033}
.tv-why b{color:var(--yellow);letter-spacing:1px}
@media (max-width:700px){ .tv-opts{grid-template-columns:1fr} .tv-banner{top:10%} }

/* ---------- touch controls ---------- */
#joy{position:fixed;left:22px;bottom:28px;width:130px;height:130px;border-radius:50%;border:3px solid #29e6ff88;background:rgba(41,230,255,.08);touch-action:none;pointer-events:auto;z-index:6}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:#29e6ff55;border:3px solid var(--cyan);pointer-events:none}
#actBtn{position:fixed;right:22px;bottom:40px;width:100px;height:100px;border-radius:50%;border:4px solid var(--yellow);background:#3a2a08cc;color:var(--yellow);font-size:13px;box-shadow:0 5px 0 #000,0 0 18px #ffd23f66;touch-action:none;pointer-events:auto;z-index:6;padding:4px;line-height:1.1}
#actBtn.held{transform:translateY(4px);box-shadow:0 1px 0 #000}

/* ---------- overlays ---------- */
#overlay{
  position:fixed;inset:0;z-index:20;display:flex;align-items:safe center;justify-content:center;overflow-y:auto;
  background:radial-gradient(ellipse at center,rgba(20,14,50,.95),rgba(4,3,12,.985));padding:18px 14px;touch-action:auto;
}
#ovInner{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;width:100%;max-width:760px}
.px{image-rendering:pixelated;image-rendering:crisp-edges;max-width:100%;height:auto;display:block}
.glow-cyan{filter:drop-shadow(0 0 8px #29e6ffaa)} .glow-yellow{filter:drop-shadow(0 0 10px #ffd23faa)}
.glow-red{filter:drop-shadow(0 0 10px #ff3b3baa)} .glow-pink{filter:drop-shadow(0 0 10px #ff3fb4aa)}
.ov-sub{color:var(--pink);letter-spacing:3px;font-size:14px;text-shadow:0 0 10px #ff3fb488}
.ov-text{font-size:16px;line-height:1.4;max-width:540px}
.ov-score{font-size:17px;color:var(--yellow);letter-spacing:1px;line-height:1.5}
.ov-hi{font-size:14px;color:var(--dim);letter-spacing:2px}
.ov-new{color:var(--green);font-size:16px;letter-spacing:2px;animation:newHi .4s steps(1) infinite}
@keyframes newHi{50%{color:var(--yellow);text-shadow:0 0 10px #ffd23f}}
.ov-help{font-size:12px;color:var(--dim);line-height:1.7;letter-spacing:1px}
.ov-help b{color:var(--ink)}
.ov-foot{font-size:11px;color:#5d578c;letter-spacing:1px;max-width:560px}
.portrait{width:220px;height:190px;max-width:60vw}
.startBtn{background:none;border:0;padding:8px;cursor:pointer}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* ---------- CRT, flash, shake ---------- */
#crt{position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px);animation:flicker 5s infinite}
#crt::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 58%,rgba(0,0,0,.55) 100%)}
@keyframes flicker{0%,100%{opacity:.85}48%{opacity:1}50%{opacity:.75}52%{opacity:1}}
#flash{position:fixed;inset:0;pointer-events:none;z-index:40;opacity:0}
#flash.on{animation:flash .35s ease-out}
@keyframes flash{from{opacity:.35}to{opacity:0}}
.shake-s{animation:shakeS .3s linear}
.shake-l{animation:shakeL .55s linear}
@keyframes shakeS{20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,-1px)}80%{transform:translate(3px,1px)}}
@keyframes shakeL{10%{transform:translate(-10px,4px)}25%{transform:translate(9px,-5px)}40%{transform:translate(-8px,-3px)}55%{transform:translate(7px,4px)}70%{transform:translate(-5px,2px)}85%{transform:translate(3px,-2px)}}

/* ---------- phone ---------- */
@media (max-width:700px){
  #hudTop{display:grid;grid-template-columns:1fr;gap:6px;padding:6px 8px}
  #statsPanel{width:auto;display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;padding:6px 8px}
  #status{grid-column:1 / -1;font-size:10px}
  .stat-head{font-size:10px;letter-spacing:0;margin-bottom:2px}
  .bar{height:11px}
  #midCol{flex-direction:row;justify-content:space-between}
  #infoPanel{font-size:12px;padding:4px 8px}
  #clock{margin:0 6px}
  .tb-btn{width:34px;height:28px}
  #casePanel{width:auto;max-height:none;padding:5px 8px}
  #caseList{gap:4px}
  .case{padding:3px 6px;font-size:10px}

  { id: 'case-019', cat: 'case', diff: 2, type: 'tf',
    q: "True or False: a report from a solicited source, such as a patient support programme, is a spontaneous report.", answer: false,
    why: "Solicited reports come from organised data collection and are handled more like study reports." },
  { id: 'case-020', cat: 'case', diff: 2, type: 'mc',
    q: "For a spontaneous report, causality is generally:",
    options: ["Presumed possible, because the reporter suspects the drug", "Always assumed unrelated",
      "Only assessed by regulators", "Irrelevant for reporting"], answer: 0,
    why: "A spontaneous report implies suspected causality by the reporter." },
  { id: 'case-021', cat: 'case', diff: 1, type: 'mc',
    q: "Which finding supports a causal relationship?",
    options: ["Positive dechallenge: the event improves when the drug is stopped", "The event started before the first dose",
      "The patient's condition explains the event", "The reporter is unsure what happened"], answer: 0,
    why: "Dechallenge and rechallenge information are classic causality clues." },
  { id: 'case-022', cat: 'case', diff: 1, type: 'tf',
    q: "True or False: a 'positive rechallenge' means the event came back when the drug was restarted.", answer: true,
    why: "Recurrence on re-exposure is strong evidence for causality." },
  { id: 'case-023', cat: 'case', diff: 2, type: 'mc',
    q: "The WHO-UMC causality system uses categories such as:",
    options: ["Certain, probable, possible, unlikely", "Mild, moderate, severe", "Serious, non-serious", "Expected, unexpected"], answer: 0,
    why: "WHO-UMC also has 'conditional/unclassified' and 'unassessable/unclassifiable'." },
  { id: 'case-024', cat: 'case', diff: 3, type: 'mc',
    q: "The Naranjo algorithm assesses causality using:",
    options: ["A scored questionnaire of about ten questions", "Disproportionality in a spontaneous database",
      "Standardised MedDRA Queries", "The benefit-risk section of a PBRER"], answer: 0,
    why: "Naranjo scores answers to around 10 questions into definite, probable, possible or doubtful." },
  { id: 'case-025', cat: 'case', diff: 1, type: 'odd',
    q: "Odd one out: which is NOT a 'special situation' usually collected even without an adverse event?",
    options: ["Exposure during pregnancy", "Overdose", "Medication error", "Taking the drug exactly as prescribed with no problems"], answer: 3,
    why: "Pregnancy exposure, overdose, misuse and medication errors are collected even without an AE." },

  // ---------------- EXPEDITED REPORTING & ICSR BASICS (20) ----------------
  { id: 'time-001', cat: 'timelines', diff: 2, type: 'mc',
    q: "Under ICH E2A, a fatal or life-threatening SUSAR from a clinical trial must reach regulators within:",
    options: ["7 calendar days", "15 calendar days", "30 calendar days", "90 calendar days"], answer: 0,
    why: "7 days for the initial report, with a complete report within 8 more days. Other SUSARs: 15 days." },
  { id: 'time-002', cat: 'timelines', diff: 1, type: 'tf',
    q: "True or False: in the EU, serious ICSRs must be submitted within 15 days of receipt.", answer: true,
    why: "Serious: 15 days. Non-serious: 90 days (EU GVP Module VI)." },
  { id: 'time-003', cat: 'timelines', diff: 2, type: 'mc',
    q: "Under ICH E2A, a SUSAR that is NOT fatal or life-threatening must be reported within:",
    options: ["15 calendar days", "7 calendar days", "30 calendar days", "In the next annual report"], answer: 0,
    why: "7 days only applies to fatal or life-threatening SUSARs." },
  { id: 'time-004', cat: 'timelines', diff: 1, type: 'tf',
    q: "True or False: expedited reporting timelines count calendar days, not working days.", answer: true,
    why: "Weekends and holidays count. The 15-day clock does not take a day off." },
  { id: 'time-005', cat: 'timelines', diff: 2, type: 'mc',
    q: "In the EU, non-serious ICSRs are submitted to EudraVigilance within:",
    options: ["90 days", "15 days", "7 days", "1 year"], answer: 0,
    why: "Non-serious EU ICSRs: 90 days from receipt." },
  { id: 'time-006', cat: 'timelines', diff: 1, type: 'mc',
    q: "What does ICSR stand for?",
    options: ["Individual Case Safety Report", "International Clinical Safety Review", "Internal Case Submission Record", "Individual Clinical Study Result"], answer: 0,
    why: "One ICSR = one patient's adverse event report." },
  { id: 'time-007', cat: 'timelines', diff: 2, type: 'mc',
    q: "Which ICH guideline defines the electronic ICSR format and data elements?",
    options: ["E2B(R3)", "E2C(R2)", "E2F", "E6(R2)"], answer: 0,
    why: "E2B(R3) sets out the data elements and message format for electronic ICSRs." },
  { id: 'time-008', cat: 'timelines', diff: 2, type: 'tf',
    q: "True or False: significant follow-up information starts a new Day 0 for reporting that follow-up.", answer: true,
    why: "Relevant follow-up has its own clock, starting when it is received." },
  { id: 'time-009', cat: 'timelines', diff: 1, type: 'mc',
    q: "Where are ICSRs submitted electronically in the EU?",
    options: ["EudraVigilance", "FAERS", "VigiBase", "MedWatch"], answer: 0,
    why: "EudraVigilance is the EU system managed by the EMA." },
  { id: 'time-010', cat: 'timelines', diff: 2, type: 'mc',
    q: "In the US, postmarketing adverse experiences that are both serious and unexpected are sent to FDA as:",
    options: ["15-day Alert reports", "7-day Alert reports", "Annual reports only", "DSURs"], answer: 0,
    why: "Serious and unexpected postmarketing cases: 15-day Alert reports." },
  { id: 'time-011', cat: 'timelines', diff: 1, type: 'tf',
    q: "True or False: FDA's database of adverse event reports for marketed drugs is called FAERS.", answer: true,
    why: "FAERS = FDA Adverse Event Reporting System." },
  { id: 'time-012', cat: 'timelines', diff: 2, type: 'mc',
    q: "Which programme do US healthcare professionals and consumers use to report voluntarily to FDA?",
    options: ["MedWatch", "Yellow Card", "EudraVigilance", "CIOMS VI"], answer: 0,
    why: "MedWatch is FDA's voluntary safety reporting programme." },
  { id: 'time-013', cat: 'timelines', diff: 2, type: 'mc',
    q: "Which classic paper form is used for international reporting of individual cases?",
    options: ["CIOMS I", "CIOMS VI", "PBRER", "SmPC"], answer: 0,
    why: "The CIOMS I form is the standard paper format for a single suspected ADR report." },
  { id: 'time-014', cat: 'timelines', diff: 1, type: 'odd',
    q: "Odd one out: which is NOT a standard section of an ICSR?",
    options: ["Patient information", "Suspect drug information", "Reaction/event information", "The reporter's favourite colour"], answer: 3,
    why: "Reporter details are collected. Their colour preferences, sadly, are not." },
  { id: 'time-015', cat: 'timelines', diff: 1, type: 'tf',
    q: "True or False: you must wait for the full medical history before reporting a valid serious case.", answer: false,
    why: "Report on time once the minimum criteria are met, then send follow-up." },
  { id: 'time-016', cat: 'timelines', diff: 1, type: 'mc',
    q: "What does SUSAR stand for?",
    options: ["Suspected Unexpected Serious Adverse Reaction", "Serious Unlisted Safety Adverse Report",
      "Suspected Unusual Study Adverse Result", "Safety Update Summary for Annual Review"], answer: 0,
    why: "SUSARs are the clinical trial cases that need expedited reporting." },
  { id: 'time-017', cat: 'timelines', diff: 1, type: 'mc',
    q: "In EU pharmacovigilance, what is the 'MAH'?",
    options: ["Marketing Authorisation Holder", "Medical Adverse Handler", "Main Assessment Hub", "Monthly Aggregate Headline"], answer: 0,
    why: "The MAH holds the licence and carries the pharmacovigilance obligations." },
  { id: 'time-018', cat: 'timelines', diff: 3, type: 'tf',
    q: "True or False: for a SUSAR in a blinded trial, the sponsor generally breaks the blind for that specific patient before reporting.", answer: true,
    why: "ICH E2A recommends unblinding the individual case, while keeping the blind for those analysing the study." },
  { id: 'time-019', cat: 'timelines', diff: 3, type: 'mc',
    q: "What is a 'nullification' ICSR used for?",
    options: ["Cancelling a previously submitted case, e.g. a duplicate or invalid report", "Upgrading a case to serious",
      "Adding follow-up information", "Asking the regulator for a signal review"], answer: 0,
    why: "Nullification tells the receiver to disregard a case that should not have been sent." },
  { id: 'time-020', cat: 'timelines', diff: 2, type: 'mc', review: true,
    q: "For a case found in the scientific literature, Day 0 is generally:",
    options: ["When the company becomes aware of a publication containing the minimum criteria", "The publication's print date",
      "The date the study started", "When the author replies to a query"], answer: 0,
    why: "Awareness of a publication meeting the minimum criteria starts the clock, just like any other source." },

  // ---------------- MEDDRA (20) ----------------
  { id: 'meddra-001', cat: 'meddra', diff: 1, type: 'mc',
    q: "Which MedDRA level sits closest to the reporter's own words?",
    options: ["LLT", "PT", "HLT", "SOC"], answer: 0,
    why: "Lowest Level Terms capture how events are actually reported. Each LLT links to one PT." },
  { id: 'meddra-002', cat: 'meddra', diff: 2, type: 'tf',
    q: "True or False: a PT can be linked to more than one SOC, but has exactly one primary SOC.", answer: true,
    why: "MedDRA is multiaxial: one primary SOC, plus possible secondary SOCs." },
  { id: 'meddra-003', cat: 'meddra', diff: 1, type: 'mc',
    q: "How many levels does the MedDRA hierarchy have?",
    options: ["5", "3", "4", "7"], answer: 0,
    why: "SOC, HLGT, HLT, PT and LLT." },
  { id: 'meddra-004', cat: 'meddra', diff: 1, type: 'mc',
    q: "What is the top level of the MedDRA hierarchy?",
    options: ["System Organ Class (SOC)", "Preferred Term (PT)", "Lowest Level Term (LLT)", "High Level Term (HLT)"], answer: 0,
    why: "SOCs group terms by body system, aetiology or purpose." },
  { id: 'meddra-005', cat: 'meddra', diff: 2, type: 'mc',
    q: "Which order goes from broadest to most specific?",
    options: ["SOC > HLGT > HLT > PT > LLT", "SOC > HLT > HLGT > PT > LLT", "LLT > PT > HLT > HLGT > SOC", "PT > SOC > LLT > HLT > HLGT"], answer: 0,
    why: "System Organ Class, High Level Group Term, High Level Term, Preferred Term, Lowest Level Term." },
  { id: 'meddra-006', cat: 'meddra', diff: 1, type: 'tf',
    q: "True or False: MedDRA stands for Medical Dictionary for Regulatory Activities.", answer: true,
    why: "It was developed under ICH for regulatory communication." },
  { id: 'meddra-007', cat: 'meddra', diff: 2, type: 'mc',
    q: "What does HLGT stand for?",
    options: ["High Level Group Term", "Higher Level General Term", "High Level Grouped Toxicity", "Hierarchical Level Group Tag"], answer: 0,
    why: "HLGTs sit between SOCs and HLTs." },
  { id: 'meddra-008', cat: 'meddra', diff: 2, type: 'mc',
    q: "Which MedDRA level is most often used for counting and analysing events?",
    options: ["Preferred Term (PT)", "Lowest Level Term (LLT)", "System Organ Class (SOC) only", "None, analysis uses free text"], answer: 0,
    why: "PTs represent a single medical concept, so they are the usual level for retrieval and analysis." },
  { id: 'meddra-009', cat: 'meddra', diff: 2, type: 'tf',
    q: "True or False: every LLT is linked to exactly one PT.", answer: true,
    why: "LLTs are synonyms, lexical variants or more specific versions of a single PT." },
  { id: 'meddra-010', cat: 'meddra', diff: 2, type: 'mc',
    q: "What are SMQs?",
    options: ["Standardised MedDRA Queries: sets of terms for a medical condition of interest", "Serious Medical Questions for reporters",
      "Special MedDRA Qualifiers for severity", "Summary Monthly Quality reports"], answer: 0,
    why: "SMQs help retrieve all cases that may relate to a condition, e.g. liver injury." },
  { id: 'meddra-011', cat: 'meddra', diff: 2, type: 'mc',
    q: "How often are new MedDRA versions released?",
    options: ["Twice a year", "Every month", "Every five years", "Only when a regulator asks"], answer: 0,
    why: "A major (March) and a minor (September) release each year." },
  { id: 'meddra-012', cat: 'meddra', diff: 1, type: 'odd',
    q: "Odd one out: which is NOT a MedDRA hierarchy level?",
    options: ["PT", "HLT", "LLT", "MLT"], answer: 3,
    why: "There is no 'Middle Level Term'. The five levels are SOC, HLGT, HLT, PT, LLT." },
  { id: 'meddra-013', cat: 'meddra', diff: 1, type: 'mc',
    q: "A reporter writes 'felt like throwing up, but didn't'. The best term is:",
    options: ["Nausea", "Vomiting", "Dyspepsia", "Abdominal pain"], answer: 0,
    why: "No vomiting happened, so code what was actually reported: nausea." },
  { id: 'meddra-014', cat: 'meddra', diff: 1, type: 'tf',
    q: "True or False: when coding, pick the term that best reflects what was reported, not your own guess at a diagnosis.", answer: true,
    why: "Code the reporter's words faithfully. Don't add or subtract information." },
  { id: 'meddra-015', cat: 'meddra', diff: 3, type: 'mc',
    q: "Which ICH-endorsed document gives guidance on choosing MedDRA terms when coding?",
    options: ["MedDRA Term Selection: Points to Consider", "ICH E6 Good Clinical Practice", "The PBRER template", "The CIOMS I form instructions"], answer: 0,
    why: "MTS:PTC gives practical coding advice; a companion document covers data retrieval." },
  { id: 'meddra-016', cat: 'meddra', diff: 2, type: 'mc',
    q: "For a PT describing an infection, which SOC is normally the primary SOC?",
    options: ["Infections and infestations", "General disorders and administration site conditions", "Investigations", "Immune system disorders"], answer: 0,
    why: "Infection terms have 'Infections and infestations' as their primary SOC." },
  { id: 'meddra-017', cat: 'meddra', diff: 3, type: 'tf', review: true,
    q: "True or False: PTs for congenital conditions have 'Congenital, familial and genetic disorders' as their primary SOC.", answer: true,
    why: "Congenital terms take this SOC as primary, with the relevant body-system SOC as secondary." },
  { id: 'meddra-018', cat: 'meddra', diff: 3, type: 'mc',
    q: "What is a 'non-current' LLT?",
    options: ["An outdated or ambiguous term kept for history but not used for new coding", "A term added in the latest version",
      "A term only used in clinical trials", "A PT with no SOC"], answer: 0,
    why: "Non-current LLTs stay in the dictionary so old data still maps, but you shouldn't choose them." },
  { id: 'meddra-019', cat: 'meddra', diff: 1, type: 'odd',
    q: "Odd one out: which is NOT a MedDRA SOC?",
    options: ["Cardiac disorders", "Nervous system disorders", "Psychiatric disorders", "Coffee deficiency disorders"], answer: 3,
    why: "Despite strong lobbying from the PV department, 'Coffee deficiency disorders' is not a SOC." },
  { id: 'meddra-020', cat: 'meddra', diff: 2, type: 'mc',
    q: "Who maintains and distributes MedDRA?",
    options: ["The MedDRA MSSO, under ICH", "The WHO", "Each national regulator separately", "The EMA alone"], answer: 0,
    why: "The Maintenance and Support Services Organization (MSSO) maintains MedDRA for ICH." },

  // ---------------- AGGREGATE REPORTS & RISK MANAGEMENT (20) ----------------
  { id: 'agg-001', cat: 'aggregate', diff: 2, type: 'mc',
    q: "Which ICH guideline describes the PBRER?",
    options: ["E2C(R2)", "E2B(R3)", "E2F", "E6"], answer: 0,
    why: "E2C(R2) is the PBRER. E2F covers the DSUR, and E2B(R3) the electronic ICSR format." },
  { id: 'agg-002', cat: 'aggregate', diff: 1, type: 'mc',
    q: "What does PBRER stand for?",
    options: ["Periodic Benefit-Risk Evaluation Report", "Post-Batch Release Evaluation Record", "Periodic Benefit Review of Emerging Risks", "Pharmacovigilance Baseline Risk Estimate Report"], answer: 0,
    why: "It evaluates the overall benefit-risk balance of a marketed product." },
  { id: 'agg-003', cat: 'aggregate', diff: 1, type: 'mc',
    q: "What does DSUR stand for?",
    options: ["Development Safety Update Report", "Drug Safety Usage Review", "Daily Signal Update Report", "Development Study Unblinding Record"], answer: 0,
    why: "The DSUR is the annual safety report for products in clinical development." },
  { id: 'agg-004', cat: 'aggregate', diff: 1, type: 'mc',
    q: "How often is a DSUR usually submitted?",
    options: ["Annually", "Monthly", "Every five years", "Only at approval"], answer: 0,
    why: "One DSUR per year, covering the reporting period since the last one." },
  { id: 'agg-005', cat: 'aggregate', diff: 2, type: 'mc',
    q: "Which ICH guideline covers the DSUR?",
    options: ["E2F", "E2C(R2)", "E2E", "E2A"], answer: 0,
    why: "E2F = DSUR. E2E = pharmacovigilance planning." },
  { id: 'agg-006', cat: 'aggregate', diff: 3, type: 'mc',
    q: "The DSUR reporting period is based on the:",
    options: ["Development International Birth Date (DIBD)", "International Birth Date (IBD)", "Date of first sale", "End of phase III"], answer: 0,
    why: "The DIBD is the date of first authorisation to conduct a clinical trial anywhere in the world." },
  { id: 'agg-007', cat: 'aggregate', diff: 2, type: 'tf',
    q: "True or False: the PBRER focuses on the overall benefit-risk balance, not just a listing of cases.", answer: true,
    why: "The move from PSUR to PBRER put benefit-risk evaluation at the centre." },
  { id: 'agg-008', cat: 'aggregate', diff: 1, type: 'mc',
    q: "In the EU, what does RMP stand for?",
    options: ["Risk Management Plan", "Regulatory Monitoring Procedure", "Reported Medication Problem", "Routine Marketing Programme"], answer: 0,
    why: "The RMP describes known and potential risks and how they are managed." },
  { id: 'agg-009', cat: 'aggregate', diff: 2, type: 'mc',
    q: "In the US, what is the programme FDA can require when labelling alone is not enough to manage a serious risk?",
    options: ["REMS", "PSMF", "RMP", "PADER"], answer: 0,
    why: "REMS = Risk Evaluation and Mitigation Strategy." },
  { id: 'agg-010', cat: 'aggregate', diff: 1, type: 'odd',
    q: "Odd one out: which is NOT a typical part of an EU RMP?",
    options: ["Safety specification", "Pharmacovigilance plan", "Risk minimisation measures", "Quarterly sales forecast"], answer: 3,
    why: "RMPs cover safety specification, pharmacovigilance plan and risk minimisation. Sales are someone else's problem." },
  { id: 'agg-011', cat: 'aggregate', diff: 2, type: 'mc',
    q: "In an RMP, an 'important identified risk' is a risk:",
    options: ["With adequate evidence of an association with the product", "That is suspected but not confirmed",
      "Where information is missing", "That only occurs in animals"], answer: 0,
    why: "Suspected-but-unconfirmed risks are 'potential risks'. Knowledge gaps are 'missing information'." },
  { id: 'agg-012', cat: 'aggregate', diff: 2, type: 'tf',
    q: "True or False: 'missing information' in an RMP means gaps in knowledge, for example use in pregnancy.", answer: true,
    why: "Missing information covers populations or situations that haven't been studied enough." },
  { id: 'agg-013', cat: 'aggregate', diff: 2, type: 'mc',
    q: "Additional risk minimisation measures can include:",
    options: ["Educational materials or a controlled access programme", "A new product logo", "A price reduction", "Faster shipping"], answer: 0,
    why: "Routine measures are the label and pack. Additional ones go further: guides, checklists, restricted access." },
  { id: 'agg-014', cat: 'aggregate', diff: 2, type: 'mc',
    q: "What is the International Birth Date (IBD)?",
    options: ["The date of the first marketing authorisation anywhere in the world", "The date of the first clinical trial",
      "The date the product was invented", "The date of the first PSUR"], answer: 0,
    why: "Periodic report schedules are usually tied to the IBD." },
  { id: 'agg-015', cat: 'aggregate', diff: 3, type: 'tf',
    q: "True or False: in the EU, PSUR submission frequencies and dates for many substances are set in the EURD list.", answer: true,
    why: "The EURD list harmonises PSUR dates across products with the same active substance." },
  { id: 'agg-016', cat: 'aggregate', diff: 2, type: 'mc',
    q: "The Data Lock Point (DLP) of a periodic report is:",
    options: ["The cut-off date for data included in the report", "The date the report is submitted",
      "The date the database was locked for maintenance", "The deadline for QC comments"], answer: 0,
    why: "Data up to the DLP goes into the report. Anything later waits for the next one." },
  { id: 'agg-017', cat: 'aggregate', diff: 1, type: 'mc',
    q: "What did PSUR originally stand for?",
    options: ["Periodic Safety Update Report", "Product Safety Usage Review", "Post-Study Update Record", "Pharmacovigilance Summary of Unexpected Reactions"], answer: 0,
    why: "In the EU the PSUR now follows the PBRER format, but the name stuck." },
  { id: 'agg-018', cat: 'aggregate', diff: 2, type: 'odd',
    q: "Odd one out: which is NOT an aggregate (periodic) report?",
    options: ["PBRER", "DSUR", "PADER", "CIOMS I form"], answer: 3,
    why: "A CIOMS I form describes a single case. The others summarise many." },
  { id: 'agg-019', cat: 'aggregate', diff: 3, type: 'mc',
    q: "A PADER is a periodic report submitted to:",
    options: ["The US FDA", "The EMA", "The WHO", "Every national regulator worldwide"], answer: 0,
    why: "PADER = Periodic Adverse Drug Experience Report, a US postmarketing requirement." },
  { id: 'agg-020', cat: 'aggregate', diff: 1, type: 'tf',
    q: "True or False: aggregate reports look at many cases together to see the bigger safety picture.", answer: true,
    why: "Single cases tell stories. Aggregate analysis finds patterns." },

  // ---------------- SIGNAL DETECTION (18) ----------------
  { id: 'signal-001', cat: 'signal', diff: 2, type: 'mc',
    q: "A PRR well above 1 for a drug-event pair means:",
    options: ["The event is reported proportionally more often with this drug than with others", "The drug causes the event",
      "The event is rare", "The label must be updated immediately"], answer: 0,
    why: "Disproportionality is a statistical flag that needs clinical evaluation. It is not proof of causation." },
  { id: 'signal-002', cat: 'signal', diff: 1, type: 'mc',
    q: "In pharmacovigilance, a 'signal' is:",
    options: ["Information suggesting a new potentially causal association (or a new aspect of a known one) that needs checking",
      "Any single adverse event report", "A confirmed risk that is already in the label", "An alert from the safety database server"], answer: 0,
    why: "A signal is a hypothesis to investigate, not a conclusion." },
  { id: 'signal-003', cat: 'signal', diff: 1, type: 'tf',
    q: "True or False: a signal proves that the drug causes the event.", answer: false,
    why: "Signals trigger assessment. Many are refuted after review." },
  { id: 'signal-004', cat: 'signal', diff: 2, type: 'mc',
    q: "What does ROR stand for in disproportionality analysis?",
    options: ["Reporting Odds Ratio", "Relative Outcome Rate", "Risk Of Reaction", "Reported Onset Range"], answer: 0,
    why: "ROR and PRR are the classic frequentist disproportionality measures." },
  { id: 'signal-005', cat: 'signal', diff: 2, type: 'mc',
    q: "Disproportionality analysis compares:",
    options: ["How often an event is reported with a drug versus with all other drugs in the database", "Sales figures between products",
      "Adverse event incidence in a randomised trial", "The number of labels mentioning an event"], answer: 0,
    why: "It uses reporting proportions, not true incidence, because spontaneous data has no denominator." },
  { id: 'signal-006', cat: 'signal', diff: 2, type: 'odd',
    q: "Odd one out: which is NOT a disproportionality measure?",
    options: ["PRR", "ROR", "Information Component (IC)", "LLT"], answer: 3,
    why: "LLT is a MedDRA level. PRR, ROR and IC are statistical signal scores." },
  { id: 'signal-007', cat: 'signal', diff: 3, type: 'mc',
    q: "The Information Component (IC) is a Bayesian disproportionality measure best known from:",
    options: ["The WHO-UMC and VigiBase", "The EU RMP template", "MedDRA SMQs", "ICH E6"], answer: 0,
    why: "The IC comes from the BCPNN method used by the Uppsala Monitoring Centre." },
  { id: 'signal-008', cat: 'signal', diff: 3, type: 'mc', review: true,
    q: "EBGM and EB05 are scores from which family of methods?",
    options: ["Empirical Bayes (e.g. the Multi-item Gamma Poisson Shrinker)", "Survival analysis", "Randomised trial design", "MedDRA coding rules"], answer: 0,
    why: "Empirical Bayes 'shrinks' unstable estimates from small counts; used for example with FAERS data." },
  { id: 'signal-009', cat: 'signal', diff: 2, type: 'tf',
    q: "True or False: with very few reports, disproportionality estimates can be unstable.", answer: true,
    why: "Small counts give wide confidence intervals, which is why thresholds often require a minimum number of cases." },
  { id: 'signal-010', cat: 'signal', diff: 2, type: 'mc',
    q: "What is 'stimulated reporting'?",
    options: ["More reports caused by publicity or a safety communication, not by a real change in risk", "Reports from stimulant drugs",
      "Reports requested by the company during a study", "Reports sent twice by mistake"], answer: 0,
    why: "Media attention can inflate reporting and distort disproportionality." },
  { id: 'signal-011', cat: 'signal', diff: 1, type: 'mc',
    q: "What is usually the first step after a potential signal is detected?",
    options: ["Validate it: check whether the evidence justifies further analysis", "Change the label immediately",
      "Withdraw the product", "Delete the cases"], answer: 0,
    why: "Signal management: detection, validation, analysis and prioritisation, assessment, then recommended action." },
  { id: 'signal-012', cat: 'signal', diff: 1, type: 'odd',
    q: "Odd one out: which is NOT a step in signal management?",
    options: ["Detection", "Validation", "Assessment", "Decoration"], answer: 3,
    why: "No matter how nice the slides are, decoration is not a GVP step." },
  { id: 'signal-013', cat: 'signal', diff: 3, type: 'tf', review: true,
    q: "True or False: 'masking' is when heavy reporting of one drug-event pair hides a disproportionality signal for other drugs.", answer: true,
    why: "Frequently reported combinations inflate the background and can mask signals for other products." },

const $ = (s) => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const STAT_KEYS = Object.keys(CONFIG.stats);
const Store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage blocked: ignore */ } },
};
let SIM = false; // true while the balance simulator runs (no sound/UI side effects)

/* =====================================================================
   MAP: 40x26 tile office, built from rooms + furniture placements
   ===================================================================== */
const T = 32;                 // tile size in world pixels
const MAP_W = 40, MAP_H = 26;
const FEET = 8;               // feet sit this far below the tile center
const GRID = [];              // GRID[y][x] = '#' wall, '.' floor, or a furniture letter
const FLOOR = [];             // FLOOR[y][x] = zone key used for floor styling
const OBJECTS = [];           // furniture objects { type, x, y, w, h }
const ZONES = {
  director: { x: 1,  y: 1,  w: 10, h: 6,  label: 'DIRECTOR' },
  manager:  { x: 12, y: 1,  w: 11, h: 6,  label: 'MANAGER' },
  restroom: { x: 24, y: 1,  w: 3,  h: 6,  label: 'WC' },
  meeting:  { x: 28, y: 1,  w: 11, h: 6,  label: 'MEETING ROOM' },
  open:     { x: 1,  y: 8,  w: 38, h: 10, label: 'PV OPEN PLAN' },
  kitchen:  { x: 1,  y: 19, w: 14, h: 6,  label: 'KITCHEN' },
  break:    { x: 16, y: 19, w: 23, h: 6,  label: 'BREAK AREA' },
};
const DOORS = [[8, 7, 2, 1], [17, 7, 2, 1], [25, 7, 1, 1], [30, 7, 2, 1], [6, 18, 2, 1], [22, 18, 3, 1]];
// Furniture letters: D desk, M my desk, C coffee machine, K counter, F fridge, k kitchen table, T meeting table,
// W whiteboard, H shelf, X manager desk, Z director desk, P printer, s sofa, v TV, g ping pong, a arcade, p plant, w water cooler,
// L toilet, n sink, V vending machine
const INTERACT_TYPES = new Set(['M', 'C', 'P', 'F', 'a', 'v', 'W', 'T', 'X', 'Z', 's', 'w', 'k', 'H', 'D', 'p', 'g', 'K', 'L', 'n', 'V']);

function buildMap() {
  for (let y = 0; y < MAP_H; y++) { GRID[y] = Array(MAP_W).fill('#'); FLOOR[y] = Array(MAP_W).fill('open'); }
  const carve = (x, y, w, h, key) => { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) { GRID[j][i] = '.'; FLOOR[j][i] = key; } };
  for (const [key, z] of Object.entries(ZONES)) carve(z.x, z.y, z.w, z.h, key);
  for (const d of DOORS) carve(d[0], d[1], d[2], d[3], 'door');
  const place = (type, x, y, w = 1, h = 1) => {
    for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) GRID[j][i] = type;
    OBJECTS.push({ type, x, y, w, h, id: OBJECTS.length });
  };
  // director
  place('H', 4, 1, 4, 1); place('p', 1, 1); place('p', 10, 1); place('Z', 3, 3, 4, 1); place('p', 1, 6);
  // manager
  place('H', 14, 1, 4, 1); place('p', 22, 1); place('X', 15, 3, 4, 1); place('p', 12, 6);
  // meeting room
  place('W', 29, 1, 8, 1); place('T', 29, 3, 8, 2); place('p', 28, 6); place('p', 38, 6);
  // restroom (WC)
  place('L', 25, 1); place('n', 24, 4);
  // open plan desk clusters (2 tiles per desk, back to back)
  for (const cx of [3, 11, 19, 27]) for (const r of [10, 14]) for (const dy of [0, 1]) for (const dx of [0, 2]) {
    const mine = cx === 19 && r === 10 && dy === 0 && dx === 2;
    place(mine ? 'M' : 'D', cx + dx, r + dy, 2, 1);
  }
  place('P', 37, 10, 1, 2); place('w', 1, 8); place('p', 38, 8); place('p', 1, 13); place('p', 38, 13);
  place('C', 33, 8, 2, 1);   // open-plan coffee corner, close to the desks
  place('V', 36, 8);         // vending machine: snacks for Energy
  // kitchen
  place('K', 1, 24, 7, 1); place('C', 8, 24, 2, 1); place('K', 10, 24, 3, 1); place('F', 13, 23, 2, 2); place('k', 5, 20, 3, 2);
  // break area
  place('v', 19, 19, 3, 1); place('s', 18, 22, 5, 1); place('g', 28, 21, 5, 2); place('a', 37, 19, 1, 2); place('p', 16, 24); place('p', 38, 24);
  // desks remember which side the chair is on
  for (const o of OBJECTS) if (o.type === 'D' || o.type === 'M') o.sitterAbove = walkable(o.x, o.y - 1);
  for (const o of OBJECTS) if (o.type === 'C') o.label = 'COFFEE';
}
function walkable(tx, ty) { return tx >= 0 && ty >= 0 && tx < MAP_W && ty < MAP_H && GRID[ty][tx] === '.'; }
function objAt(tx, ty) { return OBJECTS.find((o) => tx >= o.x && tx < o.x + o.w && ty >= o.y && ty < o.y + o.h) || null; }
function zoneOfTile(tx, ty) {
  for (const [key, z] of Object.entries(ZONES)) if (tx >= z.x && tx < z.x + z.w && ty >= z.y && ty < z.y + z.h) return key;
  return null;
}
buildMap();

const deskAt = (x, y) => OBJECTS.find((o) => o.x === x && o.y === y);
const seatTile = (o) => ({ tx: o.x + 1, ty: o.sitterAbove ? o.y - 1 : o.y + 1 });
const HOMES = {

const POIS = {

/* =====================================================================
   PATHFINDING (BFS on the tile grid)
   ===================================================================== */
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
const DIR_LIST = Object.entries(DIRS);
/** Shortest walkable path from (sx,sy) to any tile where isGoal(x,y) is true. Returns [{tx,ty}] excluding start, or null. */
function bfs(sx, sy, isGoal, avoid = null) {
  const N = MAP_W * MAP_H, prev = new Int32Array(N).fill(-1), start = sx + sy * MAP_W;
  const q = [start]; prev[start] = start;
  for (let h = 0; h < q.length; h++) {
    const cur = q[h], cx = cur % MAP_W, cy = (cur / MAP_W) | 0;
    if (cur !== start && isGoal(cx, cy)) {
      const path = [];
      for (let c = cur; c !== start; c = prev[c]) path.push({ tx: c % MAP_W, ty: (c / MAP_W) | 0 });
      return path.reverse();
    }
    for (const [, [dx, dy]] of DIR_LIST) {
      const nx = cx + dx, ny = cy + dy, ni = nx + ny * MAP_W;
      if (!walkable(nx, ny) || prev[ni] !== -1) continue;
      if (avoid && avoid(nx, ny) && !isGoal(nx, ny)) continue;
      prev[ni] = cur; q.push(ni);
    }
  }
  return isGoal(sx, sy) ? [] : null;
}
const neighborsOfRect = (x, y, w, h) => {
  const out = [];
  for (let i = x; i < x + w; i++) { out.push([i, y - 1], [i, y + h]); }
  for (let j = y; j < y + h; j++) { out.push([x - 1, j], [x + w, j]); }
  return out;
};

/* =====================================================================
   ENTITIES + GRID MOVEMENT (Pokemon style: one tile per step)
   ===================================================================== */
function makeEntity(id, def) {
  const h = HOMES[id];
  return { id, def, name: def.name, role: def.role || 'player', look: def.look,
    tx: h.tx, ty: h.ty, fx: h.tx, fy: h.ty, x: 0, y: 0, dir: h.dir, home: h,
    moving: false, moveT: 0, moveDur: 0.2, foot: 0, path: [], blockT: 0, onArrive: null,
    state: 'idle', waitT: rand(1, 4), say: null, chatReadyAt: 0, seed: Math.random() * 10, exclaimUntil: 0 };
}
const PLAYER = makeEntity('casey', CONTENT.people.casey);
Object.assign(PLAYER, { turnT: 0, wasWalking: false, lockedUntil: 0, lockReason: '', lockStart: 0, bumpT: 0 });
const NPCS = ['nora', 'max', 'lin', 'quinn', 'manager', 'director'].map((id) => makeEntity(id, CONTENT.people[id]));
const MANAGER = NPCS.find((n) => n.role === 'manager');
const DIRECTOR = NPCS.find((n) => n.role === 'director');
const ALL = [PLAYER, ...NPCS];

function occupied(tx, ty, except) { return ALL.some((e) => e !== except && e.tx === tx && e.ty === ty); }
function entityAt(tx, ty, except) { return ALL.find((e) => e !== except && e.tx === tx && e.ty === ty) || null; }
function canEnter(e, tx, ty) { return walkable(tx, ty) && !occupied(tx, ty, e); }
function facingTile(e) { const d = DIRS[e.dir]; return { tx: e.tx + d[0], ty: e.ty + d[1] }; }
function dirTo(e, tx, ty) {
  const dx = tx - e.tx, dy = ty - e.ty;
  return Math.abs(dx) >= Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
}
function placeEntity(e, tx, ty, dir) { e.tx = e.fx = tx; e.ty = e.fy = ty; e.moving = false; e.path = []; if (dir) e.dir = dir; syncPixel(e); }
function syncPixel(e) {
  const k = e.moving ? Math.min(1, e.moveT / e.moveDur) : 1;
  e.x = (e.fx + (e.tx - e.fx) * k + 0.5) * T;
  e.y = (e.fy + (e.ty - e.fy) * k + 0.5) * T + FEET;
}
/** Try to step one tile in a direction. Returns true if the step started. */
function startStep(e, dir, dur) {
  e.dir = dir;
  const [dx, dy] = DIRS[dir], nx = e.tx + dx, ny = e.ty + dy;
  if (!canEnter(e, nx, ny)) return false;
  e.fx = e.tx; e.fy = e.ty; e.tx = nx; e.ty = ny;
  e.moving = true; e.moveT = 0; e.moveDur = dur; e.foot ^= 1;
  return true;
}
function updateStep(e, dt) {
  if (e.moving) { e.moveT += dt; if (e.moveT >= e.moveDur) { e.moving = false; e.fx = e.tx; e.fy = e.ty; } }
  syncPixel(e);
}
/** Follow e.path one tile at a time; waits (and eventually re-plans) when someone is in the way. */
function followPath(e, dt, dur) {
  if (e.moving || !e.path.length) return;
  const next = e.path[0];
  if (Math.abs(next.tx - e.tx) + Math.abs(next.ty - e.ty) !== 1) { e.path = []; return; }
  if (startStep(e, dirTo(e, next.tx, next.ty), dur)) { e.path.shift(); e.blockT = 0; return; }
  e.blockT += dt;
  if (e.blockT > 0.8) { // blocked: re-plan around people
    e.blockT = 0;
    const goal = e.path[e.path.length - 1];
    const p = bfs(e.tx, e.ty, (x, y) => x === goal.tx && y === goal.ty, (x, y) => occupied(x, y, e));
    e.path = p || [];
  }
}
function pathTo(e, tx, ty) {
  const p = bfs(e.tx, e.ty, (x, y) => x === tx && y === ty);
  e.path = p || [];
  return !!p;
}
/** Walk next to a rectangle (object/person tile), then face it. */
function pathNextTo(e, x, y, w = 1, h = 1) {
  const goals = new Set(neighborsOfRect(x, y, w, h).map(([a, b]) => a + ',' + b));
  const p = bfs(e.tx, e.ty, (a, b) => goals.has(a + ',' + b), (a, b) => occupied(a, b, e));
  e.path = p || [];
  return !!p;
}
function adjacentTo(e, x, y, w = 1, h = 1) {
  return neighborsOfRect(x, y, w, h).some(([a, b]) => a === e.tx && b === e.ty);
}
function faceRect(e, x, y, w = 1, h = 1) {
  const cx = clamp(e.tx, x, x + w - 1), cy = clamp(e.ty, y, y + h - 1);
  e.dir = dirTo(e, cx, cy);
}

   ===================================================================== */
const S = {
  mode: 'title',          // title | playing | dialog | scene | minigame | paused | gameover
  mgReady: {},             // mini-game id -> time it can be played again
  triviaStreak: 0,         // PV Trivia streak (carries across trivia games within a shift)
  time: 0, day: 1, stats: {},
  cases: [], nextCaseAt: 0, caseSeq: 0, activeId: null, casesVersion: 0, onTime: 0, lateCount: 0, submitted: 0,
  coffeeReady: {}, brewing: null, toiletReadyAt: 0, vendReadyAt: 0, printerReadyAt: 0, printerJamUntil: 0, propReady: {}, dbDownUntil: 0,
  overloadT: 0, breakT: 0, breakScolded: false, working: false, target: null,

// Visual-only state
const V = { t: 0, particles: [], pops: [], shakeT: 0, shakeMag: 0, typeT: 0, workSayT: 0, dangerTickT: 0, lastSayAt: -99, evSecond: 99, happyUntil: 0, clickMark: null };

function resetGame() {
  S.time = 0; S.day = 1;
  for (const k of STAT_KEYS) S.stats[k] = CONFIG.stats[k].start;
  Object.assign(S, { cases: [], nextCaseAt: CONFIG.cases.firstAt, caseSeq: 1040, activeId: null, onTime: 0, lateCount: 0, submitted: 0,
    coffeeReady: {}, brewing: null, toiletReadyAt: 0, vendReadyAt: 0, printerReadyAt: 0, printerJamUntil: 0, propReady: {}, dbDownUntil: 0,

/* =====================================================================
   GAME FLOW
   ===================================================================== */
function startGame() {
  Sound.init();
  resetGame();
  S.mode = 'playing';
  UI.hideOverlay(); UI.hideEvent(); UI.hideDialog();
  sfx.start(); Music.start();
  say(pick(CONTENT.lines.start));
}
function pauseGame() {
  if (!['playing', 'dialog', 'scene', 'minigame', 'mail'].includes(S.mode)) return;
  S.pausedFrom = S.mode; S.mode = 'paused';
  Music.stop(); sfx.pause(); UI.showPause();
}
function resumeGame() {
  if (S.mode !== 'paused') return;
  S.mode = S.pausedFrom || 'playing';
  UI.hideOverlay(); Music.start(); sfx.pause();
}
function canRestart() { return performance.now() - S.gameOverAt > CONFIG.fx.restartLockMs; }
function computeScore() { return Math.floor(S.time / CONFIG.secondsPerDay * CONFIG.score.perDay) + S.onTime * CONFIG.score.perCase; }

function gameOver(cause) {
  if (S.mode === 'gameover') return;
  S.mode = 'gameover'; S.deathCause = cause; S.score = computeScore();
  S.event = null; S.dialog = null; S.scene = null;
  if (SIM) return;
  const days = S.time / CONFIG.secondsPerDay;
  if (S.score > S.hi.score) { S.hi = { score: S.score, days: +days.toFixed(2), cases: S.onTime }; S.newHi = true; Store.set(CONFIG.storageKeys.hi, S.hi); }
  Board.submit({ name: Board.name || 'Casey', score: S.score, days, cases: S.onTime });
  S.gameOverAt = performance.now();
  UI.hideEvent(); UI.hideDialog();
  Music.stop();
  if (cause === 'clockout') sfx.day();
  else { sfx.gameover(); FX.shake('l'); FX.flash('#ff3b3b'); }
  UI.showGameOver();
}
/** End the shift on purpose: a normal game over that still counts for the leaderboard. */
function clockOut() {
  if (!['playing', 'paused'].includes(S.mode)) return;
  S.mode = 'playing';
  gameOver('clockout');
}

/* ---- WC, vending machine, TV email ---- */
function useToilet() {
  const C = CONFIG.toilet, T2 = CONTENT.toilet;
  if (S.time < S.toiletReadyAt) { say(pick(T2.busy)); sfx.denied(); return; }
  PLAYER.lockedUntil = S.time + C.seconds; PLAYER.lockReason = 'toilet'; PLAYER.lockStart = S.time;
  S.inToilet = true;
  say(T2.enter, 1.5); sfx.blip();
}
function finishToilet() {
  S.inToilet = false;
  S.toiletReadyAt = S.time + CONFIG.toilet.cooldown;
  applyEffects(CONFIG.toilet.effects);
  say(pick(CONTENT.toilet.lines)); sfx.choose();
}
function useVending() {
  const Vd = CONTENT.vending;
  if (S.time < S.vendReadyAt) { say(pick(Vd.busy)); sfx.denied(); return; }
  const snacks = shuffle([...Vd.snacks]).slice(0, CONFIG.vending.choices).map((s) => ({ ...s, snack: true }));
  const choices = [...snacks, { text: Vd.walkAwayText, effects: {}, snack: false }];
  S.mode = 'dialog'; S.dialog = { npc: null, vend: true, topic: { line: Vd.line }, choices };
  if (!SIM) { UI.showDialog('vend', { name: Vd.name, portrait: 'vending' }, Vd.line, choices); sfx.blip(); }
}
function chooseSnack(ch) {
  S.dialog = null; S.mode = 'playing';
  if (!SIM) UI.hideDialog();
  if (!ch.snack) { say(pick(CONTENT.vending.walkAway)); return; }
  S.vendReadyAt = S.time + CONFIG.vending.cooldown;
  if (Math.random() < CONFIG.vending.stuckChance) { say(pick(CONTENT.vending.stuck)); if (!SIM) sfx.denied(); return; }
  applyEffects(ch.effects);
  say(ch.reply);
  if (!SIM) sfx.coffee();
  checkDeath();
}
function openMail() {
  if (SIM) return;
  const list = CONTENT.mails;
  let m = pick(list);
  if (list.length > 1) while (m === S.lastMail) m = pick(list);
  S.lastMail = m;
  S.mode = 'mail';
  UI.showMail(m);
  sfx.newCase();
}
function closeMail(replyAll) {
  if (S.mode !== 'mail') return;
  const M = CONTENT.mail;
  S.mode = 'playing';
  UI.hideMail();
  if (replyAll) { applyEffects(M.replyAllEffects); say(pick(M.replyAllLines), 3.5); sfx.meh(); }
  else { applyEffects(M.readEffects); say(pick(M.readLines)); sfx.choose(); }
  checkDeath();
}
function checkDeath() {
  if (S.mode === 'gameover' || S.mode === 'title') return;
  if (S.overloadT >= CONFIG.jitter.overloadSeconds) return gameOver('overload');
  for (const k of STAT_KEYS) if (S.stats[k] <= 0) return gameOver(k);
}

/* Main simulation step (world is frozen while a dialogue or scene is open) */
function update(dt) {
  S.time += dt;
  const day = Math.floor(S.time / CONFIG.secondsPerDay) + 1;
  if (day > S.day) { S.day = day; onNewDay(); }
  updateStats(dt);
  updateTimers();          // finish brewing/meetings before new interactions
  updatePlayer(dt);
  handleInteraction(dt);
  updateCases();
  updateEvents(dt);
  for (const n of NPCS) updateNPC(n, dt);
  updateScolds(dt);
  updateDirector(dt);
  S.score = computeScore();
  checkDeath();
}
function onNewDay() {
  if (SIM) return;
  pop(`DAY ${S.day}!`, '#ffd23f', 4);
  sfx.day();
  say(pick(CONTENT.lines.newDay));
}

/* =====================================================================
   STATS + EFFECTS
   ===================================================================== */
function inRegenZone() { const c = S.stats.caffeine, z = CONFIG.energyRegen; return c >= z.caffeineMin && c <= z.caffeineMax; }
function anyDanger() { return STAT_KEYS.some((k) => S.stats[k] < CONFIG.stats[k].danger); }
function playerZone() { return zoneOfTile(PLAYER.tx, PLAYER.ty); }

function updateStats(dt) {
  const st = S.stats, C = CONFIG, m = Math.min(C.difficulty.maxDrainMult, 1 + (S.day - 1) * C.difficulty.drainPerDay);
  for (const k of STAT_KEYS) st[k] -= C.stats[k].drain * m * dt;
  if (inRegenZone()) st.energy += C.energyRegen.rate * dt;
  if (st.caffeine > C.jitter.threshold) st.sanity -= C.jitter.sanityDrain * dt;
  if (st.caffeine >= C.jitter.overloadAt) S.overloadT += dt;
  else S.overloadT = Math.max(0, S.overloadT - dt * C.jitter.overloadRecover);
  if (playerZone() === 'break' && !PLAYER.moving) {
    st.sanity += C.breakArea.sanityPerSec * dt;
    if (S.breakT === 0 && !SIM) say(pick(CONTENT.lines.breakTime));
    S.breakT += dt;
    if (S.breakT > C.breakArea.maxSeconds && !S.breakScolded) { S.breakScolded = true; queueScold('manager', 'break'); }
  } else if (playerZone() !== 'break') { S.breakT = 0; S.breakScolded = false; }
  for (const k of STAT_KEYS) st[k] = clamp(st[k], 0, 100);
}

/** Apply a bag of effects (stat deltas + special keys). Returns the net stat change. */
function applyEffects(fx) {
  let net = 0;
  for (const [k, v] of Object.entries(fx || {})) {
    if (!v) continue;
    if (k in S.stats) {
      S.stats[k] = clamp(S.stats[k] + v, 0, 100);
      pop(`${v > 0 ? '+' : ''}${v} ${CONFIG.stats[k].short}`, v > 0 ? CONFIG.stats[k].color : '#ff4d4d');
      UI.bump(k, v);
      net += v;
    } else if (k === 'cases') { for (let i = 0; i < v; i++) spawnCase({}); }
    else if (k === 'serious') { for (let i = 0; i < v; i++) spawnCase({ serious: true }); }
    else if (k === 'favor') { for (let i = 0; i < v; i++) spawnCase({ favor: true }); }
    else if (k === 'removeCase') removeCases(v);
    else if (k === 'dbDown') S.dbDownUntil = Math.max(S.dbDownUntil, S.time + v);
  }
  return net;
}

/* =====================================================================
   PLAYER CONTROL (grid movement)
   ===================================================================== */
function heldDir() {
  if (input.joy) return input.joy;
  return input.keys.length ? input.keys[input.keys.length - 1] : null;
}
function playerStepTime() {
  const C = CONFIG.player;
  let t = C.stepTime;
  if (S.stats.energy < CONFIG.moods.exhaustedBelow) t *= C.exhaustedStepMult;
  if (S.stats.caffeine > CONFIG.jitter.threshold) t *= C.jitteryStepMult;
  return t;
}
function updatePlayer(dt) {
  const P = PLAYER;
  updateStep(P, dt);
  if (P.lockedUntil > S.time || P.moving) return;
  const d = heldDir();
  if (d) {
    input.tap = null; P.path = []; P.onArrive = null;
    if (P.turnT > 0) { P.turnT -= dt; return; }
    if (d !== P.dir && !P.wasWalking) { P.dir = d; P.turnT = CONFIG.player.turnDelay; return; }
    if (startStep(P, d, playerStepTime())) { P.wasWalking = true; updateStep(P, 0); }
    else { P.wasWalking = false; if (V.t > P.bumpT) { P.bumpT = V.t + 0.3; sfx.bump(); } }
    return;
  }
  P.wasWalking = false; P.turnT = 0;
  if (input.tap) { P.dir = input.tap; input.tap = null; P.path = []; P.onArrive = null; return; }   // a very quick tap still turns
  if (P.path.length) { followPath(P, dt, playerStepTime()); if (!P.moving && P.blockT === 0 && !P.path.length) P.path = []; }
  else if (P.onArrive) { const f = P.onArrive; P.onArrive = null; f(); }
}

/* What is on the tile Casey is facing? */
function currentTarget() {
  if (PLAYER.moving) return null;
  const f = facingTile(PLAYER);
  const n = NPCS.find((e) => e.tx === f.tx && e.ty === f.ty);
  if (n) return { kind: 'npc', npc: n };
  const o = objAt(f.tx, f.ty);
  if (o && INTERACT_TYPES.has(o.type)) return { kind: 'obj', obj: o };
  return null;
}
function workHeld() { return input.actionHeld || input.touchHeld || input.mouseWork || input.simHold; }

function handleInteraction(dt) {
  const target = currentTarget();
  S.target = target;
  if (input.actionPressed) {
    input.actionPressed = false;
    if (target && PLAYER.lockedUntil <= S.time) interact(target);
  }
  S.working = false;
  if (target && target.kind === 'obj' && target.obj.type === 'M' && workHeld() && PLAYER.lockedUntil <= S.time) workTick(dt);
}

function interact(target) {
  if (target.kind === 'npc') return talkTo(target.npc);
  const o = target.obj;
  switch (o.type) {
    case 'M': if (!S.cases.length) say(pick(CONTENT.lines.noCases)); return;
    case 'C': return useCoffee(o);
    case 'P': return usePrinter();
    case 'L': return useToilet();
    case 'V': return useVending();
    case 'v': return openMail();
    case 'a': return startTrivia();
    case 'g': {
      if (!minigameReady('pong')) { say('The paddles need a rest. Try again in a bit.'); return; }
      const mates = NPCS.filter((n) => n.role === 'colleague' && n.state !== 'talk');
      return startMinigame('pong', pick(mates.length ? mates : NPCS.filter((n) => n.role === 'colleague')));
    }
    case 'T': case 'W':
      if (S.event && S.event.def.type === 'meeting') return startMeeting();
      return useProp(o);
    default: return useProp(o);
  }
}

function useCoffee(o) {
  if (S.brewing) return;
  if (S.time < (S.coffeeReady[o.id] || 0)) { say(pick(CONTENT.lines.coffeeWait)); sfx.denied(); return; }
  PLAYER.lockedUntil = S.time + CONFIG.coffee.brewSeconds; PLAYER.lockReason = 'coffee'; PLAYER.lockStart = S.time;
  S.brewing = o;
  sfx.brew();
}
function finishCoffee() {
  const machine = S.brewing;
  S.brewing = null;
  const C = CONFIG;
  const fx = { caffeine: C.coffee.caffeine, energy: C.coffee.energy };
  let line = pick(CONTENT.lines.coffee);
  if (S.stats.caffeine + fx.caffeine > C.jitter.threshold) { fx.sanity = C.jitter.coffeeSanityHit; line = pick(CONTENT.lines.coffeeJittery); }
  applyEffects(fx);
  S.coffeeReady[machine.id] = S.time + C.coffee.cooldown;
  say(line); sfx.coffee(); V.happyUntil = V.t + 1.2;
}
function usePrinter() {
  const C = CONFIG.printer, Pc = CONTENT.printer;
  if (S.time < S.printerReadyAt) { say(pick(Pc.busy)); return; }
  S.printerReadyAt = S.time + C.cooldown;

    S.printerJamUntil = S.time + 4;
    applyEffects(Pc.jam.effects); say(pick(Pc.jam.lines)); sfx.jam(); FX.shake('s');
    for (let i = 0; i < 6; i++) emit('paper', 37.5 * T, 10.5 * T, { vx: rand(-60, 10), vy: rand(-80, -30), g: 160, life: 1.2 });
  } else {
    applyEffects(Pc.ok.effects); say(pick(Pc.ok.lines)); sfx.action();

}
function useProp(o) {
  const p = CONTENT.props[o.type];
  if (!p) return;
  say(pick(p.lines));
  if (p.effects && S.time >= (S.propReady[o.type] || 0)) { applyEffects(p.effects); S.propReady[o.type] = S.time + CONFIG.props.cooldown; }

function updateTimers() {
  if (S.brewing && S.time >= PLAYER.lockedUntil) finishCoffee();

/* =====================================================================
   CASES (the core loop)
   ===================================================================== */
const STEPS = CONFIG.work.steps;
function spawnCase(opts = {}) {
  const C = CONFIG.cases;
  const serious = opts.serious ?? Math.random() < C.seriousChance;
  const total = serious ? C.seriousDeadline : C.normalDeadline;
  S.caseSeq++;
  const c = { id: S.caseSeq, code: `AE-${S.caseSeq}`, serious, favor: !!opts.favor,
    title: pick(serious ? CONTENT.cases.serious : CONTENT.cases.normal),
    source: opts.favor ? 'FAVOR' : pick(CONTENT.cases.sources),
    step: 0, progress: 0, deadline: S.time + total, total, late: false, bounced: false };
  S.cases.push(c); S.casesVersion++;
  if (!SIM) { pop(serious ? 'SERIOUS CASE!' : 'NEW CASE', serious ? '#ff3b3b' : '#29e6ff', 3); sfx.newCase(); }
  return c;
}
function removeCases(n) {
  for (let i = 0; i < n; i++) {
    const cands = S.cases.filter((c) => c !== activeCase() && c.step === 0);
    const c = cands[cands.length - 1] || null;
    if (!c) return;
    S.cases.splice(S.cases.indexOf(c), 1); S.casesVersion++;
  }
}
/** The case being worked: the one the player clicked, else earliest on-time deadline, else oldest late one. */
function activeCase() {
  if (S.activeId != null) { const c = S.cases.find((x) => x.id === S.activeId); if (c) return c; S.activeId = null; }
  let best = null;
  for (const c of S.cases) {
    if (!best) { best = c; continue; }
    if (best.late && !c.late) best = c;
    else if (best.late === c.late && c.deadline < best.deadline) best = c;
  }
  return best;
}
function workTick(dt) {
  const c = activeCase();
  if (!c) return;
  PLAYER.dir = dirTo(PLAYER, clamp(PLAYER.tx, MY_DESK.x, MY_DESK.x + 1), MY_DESK.y);
  if (S.time < S.dbDownUntil) return;
  const C = CONFIG.work;
  S.working = true;
  let speed = 1;
  if (S.stats.energy < CONFIG.moods.exhaustedBelow) speed = C.exhaustedSpeed;
  if (S.stats.caffeine > CONFIG.jitter.threshold) speed *= C.jitterySpeed;
  c.progress += dt * speed;
  S.stats.energy -= C.energyPerSec * dt;
  S.stats.sanity -= C.sanityPerSec * dt;
  if (!SIM) {
    V.typeT -= dt; if (V.typeT <= 0) { sfx.type(); V.typeT = 0.11; }
    V.workSayT -= dt; if (V.workSayT <= 0) { say(pick(CONTENT.lines.work)); V.workSayT = 6; }
  }
  if (c.progress >= STEPS[c.step].seconds) completeStep(c);
}
function completeStep(c) {
  const step = STEPS[c.step];
  if (step.id === 'qc' && !c.bounced && Math.random() < CONFIG.work.qcBounceChance) {
    c.bounced = true; c.step = STEPS.findIndex((s) => s.id === 'narrative'); c.progress = 0; S.casesVersion++;
    if (!SIM) { pop('QC BOUNCE!', '#ff3b3b', 3); say(pick(CONTENT.lines.qcBounce)); sfx.bad(); }
    queueScold('manager', 'qc');
    return;
  }
  c.step++; c.progress = 0; S.casesVersion++;
  if (c.step >= STEPS.length) return submitCase(c);
  if (!SIM) { pop(`${step.label} DONE`, '#39ff88'); sfx.stepDone(); say(pick(CONTENT.lines.steps[step.id])); V.workSayT = 4; }
}
function submitCase(c) {
  S.cases.splice(S.cases.indexOf(c), 1); S.casesVersion++; S.submitted++;
  if (S.activeId === c.id) S.activeId = null;
  if (!c.late) {
    S.onTime++;
    applyEffects(CONFIG.cases.onTime);
    if (!SIM) { pop(`+${CONFIG.score.perCase} ON TIME!`, '#39ff88', 3); sfx.submit(); say(pick(CONTENT.lines.steps.submit)); V.happyUntil = V.t + 1.5;
      for (let i = 0; i < 10; i++) emit('star', PLAYER.x + rand(-20, 20), PLAYER.y - 40, { vx: rand(-60, 60), vy: rand(-90, -30), life: 0.8 }); }
  } else {
    applyEffects(CONFIG.cases.lateSubmit);
    if (!SIM) { pop('SUBMITTED (LATE)', '#ff9d2e', 3); sfx.stepDone(); }
  }
}
function updateCases() {
  const C = CONFIG.cases;
  if (S.time >= S.nextCaseAt) {
    spawnCase({});
    const f = Math.min(CONFIG.difficulty.maxArrivalMult, 1 + (S.day - 1) * CONFIG.difficulty.arrivalPerDay);
    S.nextCaseAt = S.time + rand(C.arrivalMin, C.arrivalMax) / f;
  }
  for (const c of S.cases) {
    if (c.late || S.time <= c.deadline) continue;
    c.late = true; S.lateCount++; S.casesVersion++;
    applyEffects(C.late);
    if (!SIM) { pop('CASE LATE!', '#ff3b3b', 3); say(pick(CONTENT.lines.late)); sfx.bad(); FX.shake('s'); FX.flash('#ff3b3b'); }
    queueScold('manager', 'late');
  }
}

/* =====================================================================
   NPCs: wandering, chatting
   ===================================================================== */
function npcStep(n) {
  const C = CONFIG.npc;
  return n.role === 'manager' ? C.managerStep : n.role === 'director' ? C.directorStep : C.colleagueStep;
}
const atHome = (n) => n.tx === n.home.tx && n.ty === n.home.ty;
function npcWander(n) {

  if (!atHome(n)) target = [n.home.tx, n.home.ty];
  else target = pick(POIS[n.role === 'colleague' ? 'colleague' : n.role]);
  pathTo(n, target[0], target[1]);
  n.state = 'walk';
}
function updateNPC(n, dt) {
  updateStep(n, dt);
  if (n.state === 'talk' || n.state === 'scene') return;
  if (n.state === 'approach') return;      // handled by updateScolds
  if (n.path.length) { followPath(n, dt, npcStep(n)); return; }
  if (n.moving) return;
  if (n.state === 'walk' || n.state === 'leave') {
    n.state = 'idle';
    n.waitT = atHome(n) ? rand(CONFIG.npc.deskMin, CONFIG.npc.deskMax) : rand(CONFIG.npc.idleMin, CONFIG.npc.idleMax);
    if (atHome(n)) n.dir = n.home.dir;

}
function npcSay(n, text, dur = 3) { if (!SIM) n.say = { text, until: V.t + dur }; }

function talkTo(n) {

  if (n.state === 'leave') return;
  if (S.time < n.chatReadyAt) { npcSay(n, pick(CONTENT.busy)); sfx.blip(); return; }
  const def = n.def;
  const topic = def.role === 'colleague' && def.favor && Math.random() < CONFIG.npc.favorChance ? CONTENT.favor : pick(def.talks);
  n.chatReadyAt = S.time + CONFIG.npc.chatCooldown;
  n.path = []; n.state = 'talk';
  n.dir = dirTo(n, PLAYER.tx, PLAYER.ty); PLAYER.dir = dirTo(PLAYER, n.tx, n.ty);
  // colleagues offer their mini-game as an extra reply
  const mg = minigameOf(n);
  const choices = mg && minigameReady(mg) && !SIM ? [...topic.choices, { text: '🎮 ' + CONTENT.minigames[mg].offer, minigame: mg }] : topic.choices;
  S.mode = 'dialog'; S.dialog = { npc: n, topic, choices };

}
function chooseDialog(i) {
  const d = S.dialog;
  if (!d || S.mode !== 'dialog') return;
  const ch = d.choices[i];
  if (!ch) return;
  if (d.vend) return chooseSnack(ch);
  if (ch.minigame) { S.dialog = null; UI.hideDialog(); return startMinigame(ch.minigame, d.npc); }
  applyEffects(ch.effects);
  if (ch.reply) npcSay(d.npc, ch.reply);
  d.npc.state = 'idle'; d.npc.waitT = 2.5;
  S.dialog = null; S.mode = 'playing';

/* =====================================================================
   SCOLDINGS (Manager) + DIRECTOR scenes
   ===================================================================== */
function queueScold(who, reason) {
  if (S.scoldQueue.length >= CONFIG.scold.maxQueue) return;
  if (S.scoldQueue.some((q) => q.who === who && q.reason === reason)) return;
  if (S.approaching && S.approaching.reason === reason && (S.approaching.role === who)) return;
  S.scoldQueue.push({ who, reason });
}
function updateScolds(dt) {
  if (!S.approaching && S.scoldQueue.length && S.time >= S.scoldReadyAt && !S.dialog) {
    const q = S.scoldQueue.shift();
    const n = q.who === 'director' ? DIRECTOR : MANAGER;
    n.state = 'approach'; n.reason = q.reason; n.approachT = 0; n.path = [];
    n.exclaimUntil = V.t + CONFIG.scold.exclaimSeconds; n.pauseUntil = S.time + CONFIG.scold.exclaimSeconds;
    S.approaching = n;
    if (!SIM) {
      const big = n.role === 'director';
      pop(big ? CONTENT.lines.directorIncoming : CONTENT.lines.managerIncoming, big ? '#ffd23f' : '#ff3b3b', 3);
      big ? (sfx.directorIncoming(), FX.shake('l')) : sfx.exclaim();
    }
  }
  const n = S.approaching;
  if (!n || n.state !== 'approach') return;
  n.approachT += dt;
  if (S.time < n.pauseUntil) return;              // the Pokemon-trainer "!" pause
  if (S.inToilet) return;                         // nobody scolds you through the WC door
  const P = PLAYER;
  if (!n.moving && adjacentTo(n, P.tx, P.ty) && !P.moving) {
    n.dir = dirTo(n, P.tx, P.ty);
    return openScold(n);
  }
  if (n.approachT > CONFIG.scold.giveUpAfter && !n.moving) return openScold(n);
  if (!n.moving) {
    // re-plan every step because the player keeps moving
    const goals = new Set(DIR_LIST.map(([, [dx, dy]]) => (P.tx + dx) + ',' + (P.ty + dy)));
    const p = bfs(n.tx, n.ty, (a, b) => goals.has(a + ',' + b) && !occupied(a, b, n), (a, b) => occupied(a, b, n));
    if (p && p.length) { if (startStep(n, dirTo(n, p[0].tx, p[0].ty), npcStep(n))) n.blockT = 0; }
  }
}
function openScold(n) {

  const kind = n.role;
  let line, fx;
  if (kind === 'manager') {
    const r = n.def.scold[n.reason] || n.def.scold.late;
    line = pick(r.lines); fx = r.effects;
  } else {
    const sc = n.reason === 'lowCompliance' ? n.def.lowCompliance : pick(n.def.scenes);
    line = sc.line; fx = sc.effects;
  }
  line = line.replace('{compliance}', Math.round(S.stats.compliance));
  n.path = []; n.state = 'scene';
  n.dir = dirTo(n, PLAYER.tx, PLAYER.ty);
  if (adjacentTo(n, PLAYER.tx, PLAYER.ty)) PLAYER.dir = dirTo(PLAYER, n.tx, n.ty);
  S.mode = 'scene'; S.scene = { npc: n, kind, line, choices: n.def.replies };
  applyEffects(fx);
  if (!SIM) {
    UI.showDialog(kind === 'director' ? 'director' : 'scold', n, line, n.def.replies);
    if (kind === 'director') { sfx.director(); FX.shake('l'); FX.flash('#ffd23f'); }
    else { sfx.scold(); FX.shake('s'); }
  }
}
function chooseScene(i) {
  const sc = S.scene;

  const ch = sc.choices[i];
